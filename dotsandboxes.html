<html lang="en">
<head>

<meta name="theme-color" content="#241a2d" media="(prefers-color-scheme: dark)"/>

<style>
/* Dots & Boxes only. Tokens, sheets, switches, buttons and icons live in games.css / games-ui.js. */
body[data-game="dab"]{padding:0;display:block}
.app{
  --glow:var(--pink);
  inline-size:min(100%,30rem);margin-inline:auto;block-size:100%;position:relative;z-index:1;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;row-gap:.6rem;
  padding:max(.6rem,env(safe-area-inset-top)) 1rem max(.8rem,env(safe-area-inset-bottom));
  transition:--glow .6s;
}
.app[data-active="Satyam"]{--glow:var(--satyam)}
.app[data-active="Snks"]{--glow:var(--snks)}
.bar{display:flex;align-items:center;gap:.5rem}

/* score stickers: the player whose turn it is lifts up and fills with their colour */
.scores{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;padding-block-end:.25rem}
.score{
  --c:var(--satyam);
  display:grid;grid-template-columns:auto 1fr;grid-template-areas:"num name" "num wins";align-items:center;column-gap:.6rem;min-inline-size:0;
  padding:.55rem .75rem;color:var(--text);
  background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r-md);box-shadow:0 .22rem 0 var(--shadow);
  transition:background-color .3s,translate .35s var(--ease-spring),box-shadow .35s var(--ease-spring);
}
.score.p2{--c:var(--snks)}
.score .name{grid-area:name;display:flex;align-items:center;gap:.3rem;font:600 .88rem var(--font-display);align-self:end;white-space:nowrap;min-inline-size:0}
.score .you{font-style:normal;font-weight:500;font-size:.72rem;opacity:.75}
.score .num{grid-area:num;font:700 2.3rem/1 var(--font-display);font-variant-numeric:tabular-nums;min-inline-size:1.1ch;text-align:center}
.score .wins{grid-area:wins;font-size:.78rem;color:var(--text-dim);align-self:start}
.glyph{display:inline-grid;flex:none}
.glyph .i{inline-size:.95rem;block-size:.95rem}
.p1 .glyph{color:var(--satyam-d)} .p2 .glyph{color:var(--snks-d)}
.score[data-active]{background:var(--c);color:var(--plum);translate:0 -.26rem;box-shadow:0 .48rem 0 var(--shadow)}
.score[data-active] .wins{color:var(--plum);opacity:.8}
.score[data-active] .glyph{color:var(--plum)}
.num.bump{animation:bump .5s var(--ease-spring)}

/* the tray the board sits in */
.stage{position:relative;isolation:isolate;display:grid;place-items:center;container-type:size;min-block-size:0}
.stage::before{
  content:'';position:absolute;inset:-4% -18%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in oklab,var(--glow) 48%,transparent),transparent 76%);
}
.app[data-turn="me"] .stage::before{animation:glowBreath 2.8s ease-in-out infinite}
.frame{
  position:relative;inline-size:min(100cqi,100cqb);aspect-ratio:1;padding:.3rem;
  background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r-lg);box-shadow:0 var(--lift) 0 var(--shadow);
}
@supports (corner-shape:squircle){.frame{corner-shape:squircle;border-radius:2.4rem}}
.app[data-phase="loading"] .stage,.app[data-phase="error"] .stage{visibility:hidden}
.board{display:block;inline-size:100%;block-size:100%;overflow:visible;user-select:none;-webkit-user-select:none}

/* empty lines are dotted; the one under your finger lights up in your colour */
.guide{fill:none;stroke:color-mix(in oklab,var(--text) 28%,transparent);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:.1 12.4}
.guide.press,.guide.kbd{stroke:var(--me);stroke-width:8;stroke-dasharray:none;opacity:.8}
.glow,.edge{fill:none;stroke-linecap:round;stroke-dasharray:100;opacity:0}
.glow{stroke:var(--line);stroke-width:15}
.edge{stroke:var(--c);stroke-width:8.5}
.o1{--c:var(--satyam)} .o2{--c:var(--snks)}
.edge.o1,.edge.o2,.glow.o1,.glow.o2{opacity:1}
.glow.last{stroke:var(--butter);stroke-width:21}
.dot{fill:var(--line)}

/* claimed boxes: a coloured tile with polka dots and a star or a heart */
.box{--c:transparent}
.box.o1{--c:var(--satyam)} .box.o2{--c:var(--snks)}
.pool{fill:var(--c);opacity:0}
.tone{fill:url(#polka);opacity:0}
.box:is(.o1,.o2) .pool{opacity:1}
.box:is(.o1,.o2) .tone{opacity:.55}
.m1,.m2{display:none;fill:#fff;stroke:var(--plum);stroke-width:3.2;stroke-linejoin:round;paint-order:stroke}
.box.o1 .m1,.box.o2 .m2{display:block}
.box :is(.pool,.tone,.m1,.m2,.ping){transform-box:fill-box;transform-origin:center}
.hint{fill:none;stroke:transparent;stroke-width:3;stroke-dasharray:9 7}
.box.warn .hint{stroke:#ff8a3d;fill:color-mix(in oklab,var(--peach) 45%,transparent)}
.box.gain .hint{stroke:var(--text);fill:color-mix(in oklab,var(--mint) 60%,transparent)}
.ping{fill:var(--butter);stroke:var(--line);stroke-width:2.5;display:none}
.app[data-turn="me"] .box.ready:not(.o1):not(.o2) .ping{display:block;animation:ping 1.7s ease-in-out infinite}
.hit{fill:transparent;cursor:pointer;outline:none}

/* the speech bubble under the board */
.status{display:grid;align-content:start;justify-items:start;gap:.5rem;min-block-size:8.4rem;padding-block-start:.1rem}
.line{
  padding:.4rem 1.05rem;font:600 1.55rem/1.1 var(--font-display);color:var(--text);
  background:var(--card);border:var(--bw) solid var(--line);border-radius:1.5rem;border-end-start-radius:.4rem;
  box-shadow:0 .22rem 0 var(--shadow);transition:background-color .3s;
}
.line .i{inline-size:1.1em;block-size:1.1em;vertical-align:-.15em}
.app[data-turn="me"] .line{background:var(--me);color:var(--plum)}
.app[data-phase="finished"] .line{background:var(--butter);color:var(--plum)}
.sub{font-size:.9rem;color:var(--text-dim);padding-inline:.35rem}
.actions{display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:stretch;inline-size:100%;margin-block-start:.1rem}

/* motion: dots pop in from the middle when a board appears */
.dot{animation:ignite .65s var(--ease-spring) both;animation-delay:calc(var(--d,0)*55ms);transform-box:fill-box;transform-origin:center}
.guide{animation:fade .6s ease both;animation-delay:calc(var(--d,0)*55ms)}
.edge.draw,.glow.draw{animation:draw .34s var(--ease-out) both}
.box.claim :is(.pool,.tone,.m1,.m2){animation:pop .55s var(--ease-spring) both}
@keyframes ignite{from{opacity:0;scale:0}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;scale:.45;rotate:-14deg}}
@keyframes ping{50%{scale:1.6;opacity:.6}}
@keyframes glowBreath{50%{opacity:.55}}
</style>
</head>
<body data-game="dab">

<div class="app" id="app" data-phase="loading" data-turn="none" data-link="ok">
  <header class="bar">
    <a class="backlink" href="index.html" aria-label="Back to Tether">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

      <span class="ic" aria-hidden="true"><svg class="i"><use href="#i-g-dab"/></svg></span>

  <section class="scores" aria-label="Score">

  <main class="stage" id="stage">

      <svg id="board" class="board" role="group"
           aria-label="Game board. Arrow keys move between lines, Enter or Space draws the line."></svg>

  <section class="status" aria-label="Game status">

      <div class="seg" role="group" aria-label="Next board size">
        <button type="button" data-size="3" aria-pressed="false">3×3</button>
        <button type="button" data-size="5" aria-pressed="true">5×5</button>

      <button type="button" class="btn" id="rematch">Rematch</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" aria-hidden="true"></div>

<script>
(()=>{
'use strict';

/* ═══════════════════ 1. CONFIG ═══════════════════ */
const CFG={
  url:'https://ggfxdeuwifmqulyhchtv.supabase.co',
  key:'sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI',
  S:100, PAD:40,          // edge length / outer margin, in SVG units
  POLL_MS:15000, TIMEOUT_MS:12000, RESULT_DELAY_MS:900,
};
const SEAT={Satyam:1,Snks:2};
const NAME={1:'Satyam',2:'Snks'};
const other=n=>n==='Satyam'?'Snks':'Satyam';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ═══════════════════ 2. RULES (pure; mirrors dab_make_move in SQL) ═══════════════════ */
/* RULES-START */
const Rules={
  // Orders updates: a new game always outranks any move of the old one.
  version:m=>m.game_no*100000+m.move_no,
  boxesFor(type,idx,n){
    const out=[];
    if(type==='h'){const r=Math.floor(idx/n),c=idx%n;if(r>0)out.push((r-1)*n+c);if(r<n)out.push(r*n+c)}
    else{const r=Math.floor(idx/(n+1)),c=idx%(n+1);if(c>0)out.push(r*n+c-1);if(c<n)out.push(r*n+c)}
    return out;
  },
  sides(m,b){
    const n=m.size,r=Math.floor(b/n),c=b%n;
    return (m.h[r*n+c]?1:0)+(m.h[(r+1)*n+c]?1:0)+(m.v[r*(n+1)+c]?1:0)+(m.v[r*(n+1)+c+1]?1:0);
  },
  apply(m,type,idx,name){
    const x=JSON.parse(JSON.stringify(m)),code=SEAT[name];
    x[type][idx]=code;
    let done=0;
    for(const b of Rules.boxesFor(type,idx,x.size)){
      if(!x.boxes[b]&&Rules.sides(x,b)===4){x.boxes[b]=code;done++}
    }
    x.score_satyam=x.boxes.filter(v=>v===1).length;
    x.score_snks=x.boxes.filter(v=>v===2).length;
    x.move_no+=1;
    x.last_type=type;x.last_index=idx;x.last_by=name;x.last_completed=done;
    x.turn=done?name:other(name);
    if(x.boxes.every(Boolean)){
      x.status='finished';
      x.winner_name=x.score_satyam>x.score_snks?'Satyam':x.score_snks>x.score_satyam?'Snks':null;
      if(x.winner_name==='Satyam')x.wins_satyam+=1;
      if(x.winner_name==='Snks')x.wins_snks+=1;
    }
    return {match:x,completed:done};
  },
  // Realtime can deliver Postgres arrays as '{1,0,2}' text on older servers.
  normalize(r){
    for(const k of ['h','v','boxes']){
      if(typeof r[k]==='string')r[k]=r[k].replace(/[{}]/g,'').split(',').filter(s=>s!=='').map(Number);
    }
    return r;
  },
  complete(r){return !!(r&&Array.isArray(r.h)&&Array.isArray(r.v)&&Array.isArray(r.boxes)&&r.game_no!=null)},
};
/* RULES-END */

/* ═══════════════════ 3. SETTINGS ═══════════════════ */
const Settings=(()=>{          // only the board-size choice is Dots & Boxes' own; the rest is shared (games-ui.js)
  const KEY='dab:settings';
  const v={size:5};
  try{Object.assign(v,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{}
  return{
    get:k=>v[k],
    set(k,x){v[k]=x;try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}},
  };
})();

/* ═══════════════════ 4. FEEDBACK (sound, haptics, announcements: shared, see games-ui.js) ═══════════════════ */
const Fx={
  sound:name=>TetherUI.sfx.play(name),
  buzz:p=>TetherUI.haptic(p),
  say:t=>TetherUI.say(t),
};

/* ═══════════════════ 5. NETWORK ═══════════════════ */
const withTimeout=(p,ms=CFG.TIMEOUT_MS)=>Promise.race([
  p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timed out. Check your connection.')),ms)),
]);
const Net={
  sb:null,name:null,ch:null,
  async connect(){
    this.sb=supabase.createClient(CFG.url,CFG.key);
    const{data:{session}}=await this.sb.auth.getSession();
    let uid=session?.user?.id;
    if(!uid){
      const{data,error}=await this.sb.auth.signInAnonymously();
      if(error)throw error;uid=data.user.id;
    }
    const{data:rows,error}=await this.sb.from('sessions').select('user_name').eq('auth_uid',uid).limit(1);
    if(error)throw error;
    if(!rows?.[0])throw Object.assign(new Error('no session'),{code:'NO_SESSION'});
    this.name=rows[0].user_name;
  },
  async fetch(){
    const{data,error}=await this.sb.from('dab_match').select('*').eq('id',1).maybeSingle();
    if(error)throw error;
    return data?Rules.normalize(data):null;
  },
  async rpc(fn,args){
    const{error}=await withTimeout(this.sb.rpc(fn,args));
    if(error)throw error;
  },
};

/* ═══════════════════ 6. BOARD (SVG renderer + input) ═══════════════════ */
const Board=(()=>{
  const svg=$('#board'),NS='http://www.w3.org/2000/svg';
  const{S,PAD}=CFG;
  const px=i=>PAD+i*S;
  const starPath=(cx,cy,R,r)=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;d+=(i?'L':'M')+(cx+rad*Math.cos(a)).toFixed(1)+' '+(cy+rad*Math.sin(a)).toFixed(1)}return d+'Z'};
  const heartPath=(cx,cy)=>`M${cx} ${cy+15}C${cx-27} ${cy-2} ${cx-15} ${cy-21} ${cx} ${cy-8}C${cx+15} ${cy-21} ${cx+27} ${cy-2} ${cx} ${cy+15}Z`;
  let n=0,edges={h:[],v:[]},glows={h:[],v:[],},guides={h:[],v:[]},hits=[],boxes=[],lastEl=[],cursor=null;

  const el=(tag,attrs,parent)=>{
    const e=document.createElementNS(NS,tag);
    for(const k in attrs)e.setAttribute(k,attrs[k]);
    if(parent)parent.appendChild(e);
    return e;
  };

  function build(size){
    n=size;
    const W=n*S+PAD*2,mid=(n)/2;
    svg.setAttribute('viewBox',`0 0 ${W} ${W}`);
    svg.replaceChildren();
    svg.insertAdjacentHTML('afterbegin',`<defs>
      <pattern id="polka" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2.2" cy="2.2" r="1.3" fill="#fff"/><circle cx="6.7" cy="6.7" r="1.3" fill="#fff"/></pattern>
    </defs>`);
    const gBoxes=el('g',{},svg),gGuides=el('g',{},svg),gGlow=el('g',{},svg),
          gEdges=el('g',{},svg),gDots=el('g',{},svg),gHits=el('g',{},svg);
    edges={h:[],v:[]};glows={h:[],v:[]};guides={h:[],v:[]};hits=[];boxes=[];lastEl=[];cursor=null;

    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      const g=el('g',{class:'box'},gBoxes);
      const x=px(c)+9,y=px(r)+9,w=S-18,cx=px(c)+S/2,cy=px(r)+S/2;
      el('rect',{class:'hint',x,y,width:w,height:w,rx:6},g);
      el('rect',{class:'pool',x,y,width:w,height:w,rx:6},g);
      el('rect',{class:'tone',x,y,width:w,height:w,rx:6},g);
      el('path',{class:'m1',d:starPath(cx,cy,19,8.6)},g);      // Satyam's mark
      el('path',{class:'m2',d:heartPath(cx,cy)},g);            // Snks's mark
      el('circle',{class:'ping',cx,cy,r:7},g);
      g.dataset.o='0';
      boxes.push(g);
    }

    const T=matchMedia('(pointer: coarse)').matches?66:56;   // hit thickness
    const mk=(type,r,c,x1,y1,x2,y2)=>{
      const idx=type==='h'?r*n+c:r*(n+1)+c;
      const d=Math.hypot((x1+x2)/2-(PAD+n*S/2),(y1+y2)/2-(PAD+n*S/2))/S;   // distance from centre, for the ignite stagger
      const gd=el('line',{class:'guide',x1,y1,x2,y2,pathLength:100},gGuides);
      gd.style.setProperty('--d',d.toFixed(2));
      const gl=el('line',{class:'glow',x1,y1,x2,y2,pathLength:100},gGlow);
      const ed=el('line',{class:'edge',x1,y1,x2,y2,pathLength:100},gEdges);
      gl.dataset.o=ed.dataset.o='0';
      const horiz=type==='h';
      const hit=el('rect',{
        class:'hit',x:horiz?x1+14:x1-T/2,y:horiz?y1-T/2:y1+14,
        width:horiz?S-28:T,height:horiz?T:S-28,
        role:'button',tabindex:-1,'data-t':type,'data-i':idx,
      },gHits);
      hit._g=gd;hit._cx=(x1+x2)/2;hit._cy=(y1+y2)/2;hit._r=r;hit._c=c;
      edges[type][idx]=ed;glows[type][idx]=gl;guides[type][idx]=gd;
      hits.push(hit);
      setLabel(hit,type,r,c,0);
    };
    for(let r=0;r<=n;r++)for(let c=0;c<n;c++)mk('h',r,c,px(c),px(r),px(c)+S,px(r));
    for(let r=0;r<n;r++)for(let c=0;c<=n;c++)mk('v',r,c,px(c),px(r),px(c),px(r)+S);

    for(let r=0;r<=n;r++)for(let c=0;c<=n;c++){
      const d=Math.hypot(c-mid,r-mid).toFixed(2);
      const o=el('circle',{class:'dot',cx:px(c),cy:px(r),r:6.4},gDots);
      o.style.setProperty('--d',d);
    }
    svg.setAttribute('aria-label',`Game board, ${n} by ${n} boxes. Arrow keys move between lines, Enter or Space draws the line.`);
  }

  function setLabel(hit,type,r,c,owner){
    const dir=type==='h'?'Horizontal':'Vertical';
    hit.setAttribute('aria-label',`${dir} line, row ${r+1}, column ${c+1}, ${owner?'drawn by '+NAME[owner]:'free'}`);
    if(owner)hit.setAttribute('aria-disabled','true');else hit.removeAttribute('aria-disabled');
  }

  /* Returns what changed, so the caller can pick sounds and haptics. */
  function paint(m,animate){
    const drawn=[],claimed=[];
    for(const type of ['h','v']){
      m[type].forEach((o,i)=>{
        const e=edges[type][i];
        if(!e||+e.dataset.o===o)return;
        const prev=+e.dataset.o,g=glows[type][i],cls=o?` o${o}`:'';
        e.dataset.o=g.dataset.o=o;
        e.setAttribute('class','edge'+cls);g.setAttribute('class','glow'+cls);
        if(o&&!prev&&animate){e.classList.add('draw');g.classList.add('draw');drawn.push({type,idx:i,owner:o})}
        const hit=hits.find(h=>h.dataset.t===type&&+h.dataset.i===i);
        if(hit)setLabel(hit,type,hit._r,hit._c,o);
      });
    }
    m.boxes.forEach((o,i)=>{
      const b=boxes[i];if(!b)return;
      if(+b.dataset.o!==o){
        const prev=+b.dataset.o;
        b.dataset.o=o;
        b.setAttribute('class','box'+(o?' o'+o:''));
        if(o&&!prev&&animate){b.classList.add('claim');claimed.push(o)}
      }
      b.classList.toggle('ready',!o&&Rules.sides(m,i)===3);
    });
    lastEl.forEach(e=>e.classList.remove('last'));
    lastEl=[];
    if(m.last_type){
      const e=edges[m.last_type][m.last_index],g=glows[m.last_type][m.last_index];
      if(e){e.classList.add('last');g.classList.add('last');lastEl=[e,g]}
    }
    return{drawn,claimed};
  }

  /* Hold a line to see what it would do: amber hands them a box, white wins you one. */
  function preview(type,idx,m){
    clearPreview();
    const h=hits.find(x=>x.dataset.t===type&&+x.dataset.i===idx);
    if(!h||m[type][idx])return;
    h._g.classList.add('press');
    for(const b of Rules.boxesFor(type,idx,m.size)){
      if(m.boxes[b])continue;
      const s=Rules.sides(m,b);
      if(s===3)boxes[b].classList.add('gain');else if(s===2)boxes[b].classList.add('warn');
    }
  }
  function clearPreview(){
    $$('.guide.press',svg).forEach(g=>g.classList.remove('press'));
    boxes.forEach(b=>b.classList.remove('warn','gain'));
  }

  /* keyboard: one tab stop, arrow keys travel to the nearest line in that direction */
  function focusHit(h){
    if(cursor)cursor.tabIndex=-1;
    cursor=h;h.tabIndex=0;h.focus({preventScroll:true});
  }
  function nearest(from,dx,dy){
    let best=null,bestScore=Infinity;
    for(const h of hits){
      if(h===from)continue;
      const ox=h._cx-from._cx,oy=h._cy-from._cy;
      const along=ox*dx+oy*dy;
      if(along<=1)continue;
      const across=Math.abs(ox*dy-oy*dx);
      const score=along+across*2.2;
      if(score<bestScore){bestScore=score;best=h}
    }
    return best;
  }
  function initKeys(onActivate,getMatch,canPlay){
    if(!svg.querySelector('[tabindex="0"]')&&hits[0])hits[0].tabIndex=0;
    const act=h=>onActivate(h.dataset.t,+h.dataset.i);
    svg.addEventListener('keydown',e=>{
      const h=e.target.closest?.('.hit');if(!h)return;
      const dir={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[e.key];
      if(dir){e.preventDefault();const nx=nearest(h,...dir);if(nx)focusHit(nx)}
      else if(e.key==='Enter'){e.preventDefault();act(h)}
      else if(e.key===' ')e.preventDefault();     // Space fires on keyup, like a native button
    });
    svg.addEventListener('keyup',e=>{
      const h=e.target.closest?.('.hit');
      if(h&&e.key===' ')act(h);
    });
    svg.addEventListener('focusin',e=>{
      const h=e.target.closest?.('.hit');if(!h)return;
      if(cursor&&cursor!==h)cursor.tabIndex=-1;cursor=h;h.tabIndex=0;
      if(h.matches(':focus-visible')&&canPlay()){h._g.classList.add('kbd');preview(h.dataset.t,+h.dataset.i,getMatch())}
    });
    svg.addEventListener('focusout',e=>{
      const h=e.target.closest?.('.hit');if(h){h._g.classList.remove('kbd');clearPreview()}
    });
  }
  function initPointer(onActivate,getMatch,canPlay){
    svg.addEventListener('pointerdown',e=>{
      const h=e.target.closest?.('.hit');
      if(h&&canPlay())preview(h.dataset.t,+h.dataset.i,getMatch());
    });
    ['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,clearPreview));
    svg.addEventListener('click',e=>{
      const h=e.target.closest?.('.hit');
      if(h)onActivate(h.dataset.t,+h.dataset.i);
    });
  }
  return{build,paint,preview,clearPreview,initKeys,initPointer,rebindKeys:()=>{if(hits[0]&&!svg.querySelector('[tabindex="0"]'))hits[0].tabIndex=0}};
})();

/* ═══════════════════ 7. UI (status, scores, sheets) ═══════════════════ */
const UI=(()=>{
  const app=$('#app'),line=$('#line'),sub=$('#sub'),actions=$('#actions'),toastEl=$('#toast');
  let key='',seeded=false,resultOn=false,resultTimer=0,watched=0,sel=Settings.get('size'),prevScore={1:null,2:null};

  function identify(me){
    $(me==='Satyam'?'#score1':'#score2').querySelector('.you').hidden=false;
  }
  function setSel(s){
    sel=s;Settings.set('size',s);
    $$('.seg [data-size]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.size===s)));
  }
  function toast(msg){
    toastEl.textContent=msg;toastEl.classList.add('on');
    clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('on'),2400);
    Fx.say(msg);
  }
  function fatal(title,msg){
    app.dataset.phase='error';app.dataset.turn='none';
    line.textContent=title;sub.textContent=msg;actions.hidden=true;
  }

  function render(m){
    const k=m.game_no+':'+m.size;
    if(k!==key){
      key=k;seeded=false;resultOn=false;clearTimeout(resultTimer);resultTimer=0;watched=0;
      setSel(m.size);Board.build(m.size);Board.rebindKeys();
    }
    const out=Board.paint(m,seeded);
    seeded=true;
    feedback(out);
    chrome(m);
  }

  function feedback(out){
    if(!out.drawn.length&&!out.claimed.length)return;
    const mine=SEAT[Game.me];
    if(out.claimed.length){
      const iDid=out.claimed.includes(mine);
      Fx.sound(iDid?'claim':'oppClaim');Fx.buzz(iDid?[18,50,18]:10);
    }else if(out.drawn.some(d=>d.owner===mine))Fx.sound('draw');
    else Fx.sound('opp');
  }

  function bump(id){const e=$(id);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}

  function chrome(m){
    const me=Game.me,opp=Game.opp,playing=m.status==='playing',mine=m.turn===me;

    // phase machine: playing → (last box lands) → finished
    if(playing){
      watched=m.game_no;resultOn=false;clearTimeout(resultTimer);resultTimer=0;
    }else if(watched===m.game_no){
      watched=0;finishFx(m);
      resultTimer=setTimeout(()=>{resultTimer=0;resultOn=true;if(Game.match)chrome(Game.match)},CFG.RESULT_DELAY_MS);
    }else if(!resultTimer){
      resultOn=true;
    }

    // scores
    [['1','satyam','Satyam'],['2','snks','Snks']].forEach(([i,k,name])=>{
      const s=m['score_'+k],w=m['wins_'+k];
      $('#n'+i).textContent=s;
      if(prevScore[i]!==null&&prevScore[i]!==s)bump('#n'+i);
      prevScore[i]=s;
      $('#w'+i).textContent=w+(w===1?' win':' wins');
      $('#score'+i).toggleAttribute('data-active',playing?m.turn===name:(resultOn&&m.winner_name===name));
    });

    app.dataset.phase=playing?'playing':'finished';
    app.dataset.turn=playing?(mine?'me':'them'):'none';
    app.dataset.active=playing?m.turn:(resultOn&&m.winner_name?m.winner_name:'');

    let text,subText,lineIcon='';
    if(playing){
      const again=m.last_completed>0&&m.last_by===m.turn;
      const left=m.boxes.filter(v=>!v).length;
      text=mine?(again?'Box! Go again':'Your turn!'):(again?`${opp} goes again!`:`${opp} is thinking…`);
      lineIcon=mine&&again?'sparkle':'';
      subText=left+(left===1?' box left':' boxes left');
    }else if(!resultOn){
      text='Last box…';subText='';
    }else{
      const myN=me==='Satyam'?m.score_satyam:m.score_snks,opN=me==='Satyam'?m.score_snks:m.score_satyam;
      text=!m.winner_name?"It's a tie!":m.winner_name===me?'You win!':`${opp} wins!`;
      lineIcon=!m.winner_name?'':m.winner_name===me?'sparkle':'heart';
      subText=`${myN} to ${opN} in boxes`;
    }
    line.textContent=text;
    if(lineIcon)line.insertAdjacentHTML('beforeend',' '+TetherUI.icon(lineIcon,'fill'));
    sub.textContent=subText;
    actions.hidden=!(resultOn&&!playing);
    Fx.say(playing?text:(resultOn?`${text} ${subText}.`:''));
  }

  function finishFx(m){
    const won=m.winner_name===Game.me;
    Fx.buzz(m.winner_name?(won?[25,60,25,60,60]:[20,40,20]):20);
    Fx.sound(!m.winner_name?'tie':won?'win':'lose');
  }

  return{identify,setSel,sel:()=>sel,toast,fatal,render,link(ok){const c=document.getElementById('connStatus');if(c){c.className=ok?'conn':'conn warn';c.setAttribute('aria-label',ok?'Connected':'Reconnecting')}}};
})();

/* ═══════════════════ 8. GAME (controller: state + sync) ═══════════════════ */
const Game={
  me:null,opp:null,match:null,busy:false,

  async boot(){
    try{
      await Net.connect();
      this.me=Net.name;this.opp=other(this.me);document.body.dataset.me=this.me;
      UI.identify(this.me);
      const m=await Net.fetch();
      if(!m)return UI.fatal('Not set up yet.','Run dots_and_boxes.sql in Supabase, then reopen this page.');
      this.accept(m,true);
      Board.initPointer((t,i)=>this.play(t,i),()=>this.match,()=>this.canPlay());
      Board.initKeys((t,i)=>this.play(t,i),()=>this.match,()=>this.canPlay());
      this.connect();
    }catch(e){
      console.error(e);
      if(e.code==='NO_SESSION')return UI.fatal('Log in first.','Open Tether chat on this device, then come back.');
      const missing=/dab_match|relation|does not exist/i.test(e.message||'');
      UI.fatal(missing?'Not set up yet.':'Something broke.',missing?'Run dots_and_boxes.sql in Supabase, then reopen this page.':(e.message||'Unknown error'));
    }
  },

  canPlay(){return !!this.match&&this.match.status==='playing'&&this.match.turn===this.me&&!this.busy},

  /* A row only replaces the current state if it is not older. Stale fetches and
     late events can no longer undo a move we have already painted. */
  accept(m,force=false){
    if(!force&&this.match&&Rules.version(m)<Rules.version(this.match))return false;
    this.match=m;UI.render(m);return true;
  },
  async sync(force=false){
    try{const m=await Net.fetch();if(m)this.accept(m,force)}
    catch(e){console.warn('sync failed (will retry):',e)}
  },
  connect(){
    // games-live.js owns the channel, reconnects, wake-ups and the backstop poll.
    this.live=TetherLive.hub(Net.sb,{
      name:'dab',
      bindings:[{event:'UPDATE',table:'dab_match',filter:'id=eq.1',cb:p=>{
        const row=p.new;
        if(row&&Rules.complete(Rules.normalize(row)))this.accept(row);
        else this.sync();                       // partial payload: fall back to a fetch
      }}],
      onCatchup:()=>this.sync(),
      onStatus:ok=>UI.link(ok),
      pollLiveMs:12000,
    });
    this.live.start();
  },

  async play(type,idx){
    const m=this.match;
    if(!m||m.status!=='playing'||this.busy)return;
    if(m.turn!==this.me){UI.toast(`It's ${this.opp}'s move.`);Fx.buzz([12,40,12]);return}
    if(m[type][idx]){Fx.buzz(15);return}
    this.busy=true;Fx.buzz(12);
    this.accept(Rules.apply(m,type,idx,this.me).match,true);     // optimistic; version bump outranks older fetches
    try{await Net.rpc('dab_make_move',{p_type:type,p_index:idx})}
    catch(e){
      UI.toast('Move failed: '+(e.message||'try again'));
      this.busy=false;await this.sync(true);return;               // roll back to the server's truth
    }
    this.busy=false;
    this.sync();
  },

  async newGame(reset=false){
    try{
      await Net.rpc('dab_new_game',{p_size:UI.sel(),p_reset_series:reset});
      await this.sync(true);
    }catch(e){UI.toast('Failed: '+(e.message||'try again'))}
  },
};

/* ═══════════════════ 9. SHEETS + SETTINGS WIRING ═══════════════════ */
(function wireSheets(){
  // Dots & Boxes' own rows in the shared settings sheet: board size, rules, reset
  const li=(cls,html)=>{const e=document.createElement('li');if(cls)e.className=cls;e.innerHTML=html;return e};
  const sizeRow=li('row','<span id="sizeLabel">Next board</span><div class="seg" role="group" aria-labelledby="sizeLabel"><button type="button" data-size="3" aria-pressed="false">3×3</button><button type="button" data-size="5" aria-pressed="true">5×5</button></div>');
  const how=li('','<details class="how"><summary>How to play</summary><ol><li>Take turns drawing one line between two dots.</li><li>Close the fourth side of a box and it\'s yours. You go again.</li><li>Most boxes wins. Hold a line to preview it: orange means it hands them a box, white means it wins you one. Slide away to cancel.</li></ol></details>');
  const reset=li('row','<button type="button" class="link danger">'+TetherUI.icon('reset')+' Reset score…</button>');
  TetherUI.mount({extras:[sizeRow,how,reset]});
  reset.querySelector('button').addEventListener('click',async()=>{
    TetherUI.settings.close();
    const ok=await TetherUI.confirm({title:'Reset the score?',text:"Both scores go back to 0 and a new game starts. This can't be undone.",ok:'Reset'});
    if(ok)Game.newGame(true);
  });
  $$('.seg [data-size]').forEach(b=>b.addEventListener('click',()=>{UI.setSel(+b.dataset.size);Fx.buzz(8)}));
  UI.setSel(Settings.get('size'));
  $('#rematch').addEventListener('click',async e=>{
    e.currentTarget.disabled=true;await Game.newGame(false);e.currentTarget.disabled=false;
  });
})();

Game.boot();
})();
</script>
