<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<style>
/* Photo Booth only. Tokens, buttons, cards, sheets, icons live in games.css / games-ui.js. */
body[data-game="booth"]{--tint:var(--peach);--tint2:var(--lilac)}
.booth{flex:1 1 auto;min-block-size:0;display:flex;flex-direction:column;gap:.6rem}

/* the stage takes the free height; whatever is on it is the biggest thing that fits */
.viewport{flex:1 1 0;min-block-size:0;container-type:size;display:grid;place-items:center}
.viewport>*{grid-area:1/1}
.idle,.cam,#result{display:none}
.booth[data-state="idle"] .idle{display:grid}
.booth:is([data-state="camera"],[data-state="shooting"]) .cam{display:block}
.booth[data-state="result"] #result{display:block}

.idle{
  inline-size:min(100cqi,100cqb);aspect-ratio:1;place-items:center;align-content:center;gap:.7rem;text-align:center;padding:1.2rem;
  background:var(--card);border:var(--bw) dashed var(--line);border-radius:var(--r-lg);color:var(--text-dim);
}
.idle .big{display:grid;place-items:center;inline-size:5rem;block-size:5rem;border-radius:1.6rem;background:var(--butter);color:var(--plum);border:var(--bw) solid var(--line);box-shadow:0 var(--lift) 0 var(--shadow);rotate:-4deg}
.idle .big .i{inline-size:2.6rem;block-size:2.6rem}
.idle h2{font-size:1.5rem;color:var(--text)}
.idle p{font-size:.92rem;max-inline-size:17rem}

.cam{
  position:relative;inline-size:min(100cqi,100cqb);aspect-ratio:1;overflow:hidden;background:#120c14;
  border:var(--bw) solid var(--line);border-radius:var(--r-lg);box-shadow:0 var(--lift) 0 var(--shadow);
}
.cam video{position:absolute;inset:0;inline-size:100%;block-size:100%;object-fit:cover;filter:var(--live,none)}
.cam[data-facing="user"] video{scale:-1 1}
.cam::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(closest-side,transparent 62%,rgb(20 8 0/.45));}
.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 9rem/1 var(--font-display);color:#fff;-webkit-text-stroke:3px var(--plum);paint-order:stroke fill;text-shadow:0 .4rem 0 var(--plum);z-index:2}
.count.tick{animation:countPop .8s var(--ease-out) both}
@keyframes countPop{0%{opacity:0;scale:1.6}25%{opacity:1;scale:1}85%{opacity:1}100%{opacity:0;scale:.9}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.shots{position:absolute;inset-inline:0;inset-block-end:.6rem;display:flex;gap:.4rem;justify-content:center;z-index:2}
.shots span{inline-size:2.1rem;block-size:2.1rem;border-radius:.55rem;border:2px solid #fff;background:rgb(0 0 0/.35);background-size:cover;background-position:center;box-shadow:0 .1rem 0 rgb(0 0 0/.4)}
.shots span.on{outline:3px solid var(--butter)}

#result{inline-size:auto;block-size:auto;max-inline-size:100cqi;max-block-size:100cqb;border-radius:.5rem;box-shadow:0 .3rem 0 var(--shadow),0 0 0 2px var(--line);animation:resultIn .5s var(--ease-spring) both}
@keyframes resultIn{from{opacity:0;scale:.9;rotate:-2deg}}

.controls{gap:.55rem;padding:.7rem}
.ctl{display:flex;flex-direction:column;gap:.25rem}
.ctl>span{font:600 .8rem var(--font-display);color:var(--text-dim)}
.seg.fill{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg.fill button{min-inline-size:0;padding:.4rem .2rem;font-size:.86rem}
.acts{display:flex;gap:.5rem}
.acts .btn{flex:1;min-inline-size:0;padding-inline:.6rem;font-size:1rem}
.acts .btn.sm{flex:none}
.acts .btn[disabled]{opacity:.5}
.picker-label{display:contents}
.cstat{position:absolute;inset-inline:.6rem;top:.6rem;z-index:4;text-align:center;font:600 .92rem var(--font-display);color:var(--plum);background:var(--butter);border:2px solid var(--line);border-radius:99px;padding:.3rem .8rem;box-shadow:0 .14rem 0 var(--shadow)}
.acts.two{flex-wrap:wrap}.acts .btn.wide{flex:1 1 100%}
@media (max-height:640px){ .idle .big{inline-size:3.6rem;block-size:3.6rem} .idle p{display:none} .count{font-size:6rem} }
</style>
</head>
<body data-game="booth">
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html" aria-label="Back to Tether">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="sr-only">Back to Tether</span>
    </a>
    <div class="brand">
      <span class="ic" aria-hidden="true"><svg class="i"><use href="#i-g-booth"/></svg></span>
      <h1>Photo Booth</h1>
    </div>
    <div style="width:2.75rem"></div>
  </div>

  <main class="booth" id="booth" data-state="idle">
    <div class="viewport">
      <div class="idle" id="idle">
        <span class="big" aria-hidden="true"><svg class="i"><use href="#i-camera"/></svg></span>
        <h2>Say cheese!</h2>

      </div>
      <div class="cam" id="cam" data-facing="user">
        <video id="video" playsinline muted autoplay></video>
        <div class="count" id="count" aria-hidden="true"></div>
        <div class="flash" id="flash"></div>
        <div class="cstat" id="cstat" hidden></div>
        <div class="shots" id="shots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      </div>
      <canvas id="result" role="img" aria-label="Your finished photo collage"></canvas>
    </div>

    <div class="card tight controls">
      <div class="ctl">
        <span id="tplLabel">Layout</span>
        <div class="seg fill" id="segTpl" role="group" aria-labelledby="tplLabel">
          <button type="button" data-tpl="film" aria-pressed="true">Film strip</button>
          <button type="button" data-tpl="polaroid" aria-pressed="false">Polaroids</button>
          <button type="button" data-tpl="booth" aria-pressed="false">Booth</button>

      </div>
      <div class="ctl">
        <span id="lookLabel">Film look</span>
        <div class="seg fill" id="segLook" role="group" aria-labelledby="lookLabel">
          <button type="button" data-look="kodak" aria-pressed="true">Warm</button>
          <button type="button" data-look="faded" aria-pressed="false">Faded</button>
          <button type="button" data-look="mono" aria-pressed="false">Mono</button>
          <button type="button" data-look="sepia" aria-pressed="false">Sepia</button>
        </div>
      </div>
      <div class="acts" id="acts"></div>
    </div>
  </main>
</div>

<input type="file" id="picker" accept="image/*" multiple hidden>
<div class="toast" id="toast" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TICK=new URLSearchParams(location.search).has('fast')?110:1000;   // ?fast=1 shortens the countdown (used for testing)
const SHOTS=4;
const SU='https://ggfxdeuwifmqulyhchtv.supabase.co';
const SK='sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI';

/* ═══════════════ state ═══════════════ */
const prefs={tpl:'film',ctpl:'blend',look:'kodak'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('booth:prefs')||'{}'))}catch{}
const S={mode:'solo',names:['you','me'],stream:null,facing:'user',frames:[],busy:false,cancel:false,sent:false,composeToken:0};
const booth=$('#booth'),video=$('#video'),result=$('#result'),acts=$('#acts');

function setState(st){booth.dataset.state=st;renderActions()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');TetherUI.say(msg);clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ═══════════════ looks: a tiny film emulator ═══════════════ */
// Each look is a recipe: saturation, contrast, colour balance, lifted blacks, grain, vignette, light leak.
const LOOKS={
  kodak:{sat:1.18,contrast:1.10,mul:[1.06,1.00,.90],shadow:[.02,0,-.02],lift:.03,grain:.07,vignette:.42,leak:.30,live:'contrast(1.1) saturate(1.2) sepia(.15)'},
  faded:{sat:.80,contrast:.90,mul:[1.02,1.00,1.00],shadow:[-.01,.03,.05],lift:.11,grain:.06,vignette:.32,leak:.16,live:'contrast(.92) saturate(.8) brightness(1.06) sepia(.1) hue-rotate(-8deg)'},
  mono: {sat:0,  contrast:1.24,mul:[1.02,1.00,.96],shadow:[0,0,0],lift:.05,grain:.10,vignette:.50,leak:0,live:'grayscale(1) contrast(1.2)'},
  sepia:{sat:0,  contrast:1.10,mul:[1.12,.98,.78],shadow:[.03,.01,-.03],lift:.06,grain:.08,vignette:.50,leak:.12,live:'sepia(.9) contrast(1.05)'},
};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=v=>v<0?0:v>1?1:v;

function cover(ctx,src,size){            // centre-crop any image/canvas/bitmap to a square
  const w=src.videoWidth||src.width,h=src.videoHeight||src.height,s=Math.min(w,h);
  ctx.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,size,size);
}
function tone(src,size,lookName,seed){
  const L=LOOKS[lookName],rand=rng(seed*7919+13);
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d',{willReadFrequently:true});
  cover(x,src,size);
  const img=x.getImageData(0,0,size,size),d=img.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
    const y=.2126*r+.7152*g+.0722*b;
    r=y+(r-y)*L.sat;g=y+(g-y)*L.sat;b=y+(b-y)*L.sat;                    // saturation
    r=(r-.5)*L.contrast+.5;g=(g-.5)*L.contrast+.5;b=(b-.5)*L.contrast+.5; // contrast
    r=r*L.mul[0]+L.shadow[0]*(1-y);g=g*L.mul[1]+L.shadow[1]*(1-y);b=b*L.mul[2]+L.shadow[2]*(1-y); // colour balance, tinted shadows
    r=L.lift+(1-L.lift)*r;g=L.lift+(1-L.lift)*g;b=L.lift+(1-L.lift)*b;   // lifted blacks
    const n=(rand()-.5)*L.grain;                                          // film grain
    d[i]=clamp(r+n)*255;d[i+1]=clamp(g+n)*255;d[i+2]=clamp(b+n)*255;
  }
  x.putImageData(img,0,0);
  const v=x.createRadialGradient(size/2,size/2,size*.34,size/2,size/2,size*.78);   // vignette
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(24,8,0,${L.vignette})`);
  x.fillStyle=v;x.fillRect(0,0,size,size);
  if(L.leak>0){                                                          // light leak from a random edge
    const side=Math.floor(rand()*4);                                     // 0 left, 1 right, 2 bottom, 3 top
    const [x0,y0,x1,y1]=[[0,0,size*.5,0],[size,0,size*.5,0],[0,size,0,size*.5],[0,0,0,size*.5]][side];
    const grad=x.createLinearGradient(x0,y0,x1,y1);
    grad.addColorStop(0,`rgba(255,122,48,${L.leak})`);grad.addColorStop(.5,`rgba(255,60,110,${L.leak*.4})`);grad.addColorStop(1,'rgba(255,60,110,0)');
    x.globalCompositeOperation='screen';x.fillStyle=grad;x.fillRect(0,0,size,size);x.globalCompositeOperation='source-over';
  }
  x.fillStyle='rgba(255,250,235,.55)';                                   // dust
  for(let i=0;i<14;i++){const px=rand()*size,py=rand()*size,pr=.6+rand()*1.6;x.beginPath();x.arc(px,py,pr,0,6.283);x.fill()}
  x.strokeStyle='rgba(255,250,235,.18)';x.lineWidth=1;                   // a couple of hairline scratches
  for(let i=0;i<2;i++){const px=rand()*size;x.beginPath();x.moveTo(px,0);x.lineTo(px+(rand()-.5)*12,size);x.stroke()}
  return c;
}

/* ═══════════════ layouts ═══════════════ */
const dateText=()=>new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'2-digit'});
function rr(x,X,Y,W,H,R){x.beginPath();x.roundRect?x.roundRect(X,Y,W,H,R):x.rect(X,Y,W,H)}
const HEART=new Path2D('M0 15C-27-2-15-21 0-8C15-21 27-2 0 15Z');
const STAR=(()=>{const p=new Path2D();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?8:19;p[i?'lineTo':'moveTo'](r*Math.cos(a),r*Math.sin(a))}p.closePath();return p})();

const TEMPLATES={
  // BLEND: one portrait where the two of you fade into each other along a diagonal, with a heart on the seam
  blend:{size:720,count:2,draw(frames){
    const W=1000,H=1250,P=34,CAP=190,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fffaf0';x.fillRect(0,0,W,H);
    const ix=P,iy=P,iw=W-P*2,ih=H-P*2-CAP;
    const layer=img=>{const o=document.createElement('canvas');o.width=iw;o.height=ih;const q=o.getContext('2d'),k=Math.max(iw/img.width,ih/img.height);q.drawImage(img,(iw-img.width*k)/2,(ih-img.height*k)/2,img.width*k,img.height*k);return o};
    x.save();rr(x,ix,iy,iw,ih,18);x.clip();
    x.drawImage(layer(frames[0]),ix,iy);
    const b=layer(frames[1]),q=b.getContext('2d'),cx=iw*.5,cy=ih*.5,dx=.93,dy=.36,len=95;
    const g=q.createLinearGradient(cx-dx*len,cy-dy*len,cx+dx*len,cy+dy*len);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,1)');
    q.globalCompositeOperation='destination-in';q.fillStyle=g;q.fillRect(0,0,iw,ih);
    x.drawImage(b,ix,iy);x.restore();
    x.strokeStyle='#3b2a45';x.lineWidth=5;rr(x,ix,iy,iw,ih,18);x.stroke();
    x.save();x.translate(ix+iw/2,iy+ih/2);x.rotate(.12);x.scale(2.6,2.6);x.fillStyle='#ff9cc0';x.strokeStyle='#3b2a45';x.lineWidth=2.4;x.lineJoin='round';x.fill(HEART);x.stroke(HEART);x.restore();
    x.fillStyle='#3b2a45';x.textAlign='center';x.font='700 78px Caveat,cursive';x.fillText(`${S.names[0]} & ${S.names[1]}`,W/2,H-P-82);
    x.font='600 30px Fredoka,sans-serif';x.fillText(dateText(),W/2,H-P-30);
    return c}},
  // SPLIT: two tilted portraits side by side, a big heart between them
  split:{size:720,count:2,draw(frames){
    const W=1200,H=1060,PW=520,PH=690,Y=64,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fffaf0';x.fillRect(0,0,W,H);x.strokeStyle='#3b2a45';x.lineWidth=8;x.strokeRect(4,4,W-8,H-8);
    [[46,-1.4],[634,1.4]].forEach(([px,deg],i)=>{
      x.save();x.translate(px+PW/2,Y+PH/2);x.rotate(deg*Math.PI/180);x.translate(-PW/2,-PH/2);
      x.shadowColor='rgba(40,20,10,.22)';x.shadowBlur=22;x.shadowOffsetY=10;x.fillStyle='#fff';x.fillRect(-12,-12,PW+24,PH+24);x.shadowColor='transparent';
      x.beginPath();x.rect(0,0,PW,PH);x.clip();const k=PH/frames[i].height;x.drawImage(frames[i],(PW-frames[i].width*k)/2,0,frames[i].width*k,PH);
      x.restore();
    });
    x.save();x.translate(W/2,Y+PH/2);x.rotate(-.1);x.scale(2.8,2.8);x.fillStyle='#ff9cc0';x.strokeStyle='#3b2a45';x.lineWidth=2.4;x.lineJoin='round';x.fill(HEART);x.stroke(HEART);x.restore();
    x.fillStyle='#3b2a45';x.textAlign='center';x.font='700 70px Caveat,cursive';
    x.fillText(S.names[0],46+PW/2,Y+PH+105);x.fillText(S.names[1],634+PW/2,Y+PH+105);
    x.font='600 28px Fredoka,sans-serif';x.fillText(dateText(),W/2,H-34);
    return c}},
  film:{size:460,draw(frames){
    const FW=460,GAP=26,TOP=46,SIDE=80,W=FW+SIDE*2,H=TOP*2+SHOTS*FW+(SHOTS-1)*GAP;
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#17110d';x.fillRect(0,0,W,H);
    x.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<500;i++)x.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);
    x.fillStyle='#efe6d6';                                              // sprocket holes
    for(let y=16;y<H-20;y+=54){rr(x,24,y,28,36,7);x.fill();rr(x,W-24-28,y,28,36,7);x.fill()}
    frames.forEach((f,i)=>{
      const y=TOP+i*(FW+GAP);
      x.save();rr(x,SIDE,y,FW,FW,6);x.clip();x.drawImage(f,SIDE,y,FW,FW);x.restore();
      x.fillStyle='#e8892b';x.font='600 17px Figtree,sans-serif';x.textAlign='left';
      x.fillText(`${i+1}`,W-SIDE+10,y+22);x.fillText(`${i+1}A`,W-SIDE+10,y+FW-8);
      x.save();x.translate(SIDE-14,y+FW-14);x.rotate(-Math.PI/2);x.font='600 15px Figtree,sans-serif';x.fillText('TETHER 400',0,0);x.restore();
      x.beginPath();x.moveTo(SIDE-12,y+FW/2-7);x.lineTo(SIDE-12,y+FW/2+7);x.lineTo(SIDE-2,y+FW/2);x.closePath();x.fill();
    });
    return c}},
  polaroid:{size:440,draw(frames){
    const W=1200,H=1300;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#f1e7d3';x.fillRect(0,0,W,H);
    const r=rng(5);x.fillStyle='rgba(120,90,50,.05)';for(let i=0;i<900;i++)x.fillRect(r()*W,r()*H,2,2);
    const spots=[[78,48,-4],[630,78,3.2],[96,668,2.6],[612,648,-3.4]];   // rows far enough apart that no polaroid covers another's caption
    const caps=[dateText(),'just us','again!','the best'];
    frames.forEach((f,i)=>{
      const [px,py,deg]=spots[i],PW=500,PH=585;
      x.save();x.translate(px+PW/2,py+PH/2);x.rotate(deg*Math.PI/180);x.translate(-PW/2,-PH/2);
      x.shadowColor='rgba(40,20,10,.28)';x.shadowBlur=28;x.shadowOffsetY=12;x.fillStyle='#fffdf7';x.fillRect(0,0,PW,PH);
      x.shadowColor='transparent';x.drawImage(f,30,30,440,440);
      x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=2;x.strokeRect(30,30,440,440);
      x.fillStyle='#3b2a45';x.font='700 50px Caveat,cursive';x.textAlign='center';x.fillText(caps[i],PW/2,PH-52);
      x.restore();
    });
    [[590,660,'#ff9cc0',HEART,1.1],[1140,52,'#8ccfff',STAR,1.2],[58,1245,'#ffe27a',STAR,1.1],[1138,1250,'#ff9cc0',HEART,1.3]].forEach(([sx,sy,col,path,sc])=>{
      x.save();x.translate(sx,sy);x.scale(sc,sc);x.rotate(.2);x.fillStyle=col;x.strokeStyle='#3b2a45';x.lineWidth=3.2;x.lineJoin='round';x.fill(path);x.stroke(path);x.restore();
    });
    return c}},
  booth:{size:440,draw(frames){
    const FW=440,PAD=28,W=FW+PAD*2,FOOT=150,H=PAD+SHOTS*(FW+PAD)+FOOT-PAD;
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fffaf0';x.fillRect(0,0,W,H);
    x.strokeStyle='#3b2a45';x.lineWidth=8;x.strokeRect(4,4,W-8,H-8);
    frames.forEach((f,i)=>{
      const y=PAD+i*(FW+PAD);
      x.drawImage(f,PAD,y,FW,FW);x.strokeStyle='#3b2a45';x.lineWidth=4;x.strokeRect(PAD,y,FW,FW);
    });
    const fy=PAD+SHOTS*(FW+PAD);
    x.fillStyle='#3b2a45';x.textAlign='center';x.font='700 34px Fredoka,sans-serif';x.fillText('TETHER PHOTO BOOTH',W/2,fy+34);
    x.font='600 24px Fredoka,sans-serif';x.fillText(dateText(),W/2,fy+72);
    x.save();x.translate(W/2,fy+104);x.fillStyle='#ff9cc0';x.strokeStyle='#3b2a45';x.lineWidth=3;x.lineJoin='round';x.scale(.9,.9);x.fill(HEART);x.stroke(HEART);x.restore();
    return c}},
};

/* ═══════════════ compose: tone every frame in the chosen look, lay them out, show the result ═══════════════ */
async function compose(){
  const token=++S.composeToken;
  try{await Promise.all(['700 40px Caveat','600 30px Fredoka','600 16px Figtree'].map(f=>document.fonts.load(f)))}catch(e){/* fall back to system fonts */}
  const T=TEMPLATES[curTpl()]||TEMPLATES.film;
  const toned=[];
  const need=T.count||SHOTS;
  for(let i=0;i<need;i++){
    toned.push(tone(S.frames[i%S.frames.length],T.size,prefs.look,i+1));
    if(i%2===1) await sleep(0);                                            // let the UI breathe between frames
    if(token!==S.composeToken) return;                                    // the user changed look/layout meanwhile
  }
  const out=T.draw(toned);
  result.width=out.width;result.height=out.height;
  result.getContext('2d').drawImage(out,0,0);
}

/* ═══════════════ camera ═══════════════ */
async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('This browser has no camera access. Pick photos instead.');return}
  try{
    stopCamera();
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.facing,width:{ideal:1280},height:{ideal:960}},audio:false});
    video.srcObject=S.stream;
    await video.play().catch(()=>{});
    $('#cam').dataset.facing=S.facing;
    applyLive();setState('camera');
  }catch(e){
    const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    toast(denied?'Camera blocked. Allow it in your browser, or pick photos.':'No camera found. Pick photos instead.');
    setState('idle');
  }
}
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}video.srcObject=null}
function applyLive(){$('#cam').style.setProperty('--live',LOOKS[prefs.look].live)}
function grab(){
  const w=video.videoWidth,h=video.videoHeight,s=Math.min(w,h),size=Math.min(s,1080);
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  if(S.facing==='user'){x.translate(size,0);x.scale(-1,1)}                  // selfie view is mirrored, so the photo matches what you saw
  x.drawImage(video,(w-s)/2,(h-s)/2,s,s,0,0,size,size);
  return c;
}

async function shoot(){
  if(S.busy) return;
  S.busy=true;S.cancel=false;S.frames=[];S.sent=false;
  setState('shooting');
  const dots=[...document.querySelectorAll('#shots span')];
  dots.forEach(d=>{d.style.backgroundImage='';d.classList.remove('on')});
  const count=$('#count'),flash=$('#flash');
  for(let i=0;i<SHOTS&&!S.cancel;i++){
    dots[i].classList.add('on');
    for(let n=3;n>=1&&!S.cancel;n--){
      count.textContent=n;count.classList.remove('tick');void count.offsetWidth;count.classList.add('tick');
      TetherUI.sfx.play('count');TetherUI.haptic(10);
      await sleep(TICK);
    }
    if(S.cancel)break;
    count.textContent='';
    flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
    TetherUI.sfx.play('shutter');TetherUI.haptic([30,40,30]);
    const f=grab();S.frames.push(f);
    dots[i].classList.remove('on');dots[i].style.backgroundImage=`url(${f.toDataURL('image/jpeg',.4)})`;
    await sleep(TICK*.7);
  }
  S.busy=false;
  if(S.cancel||S.frames.length<SHOTS){stopCamera();setState('idle');return}
  stopCamera();
  setState('result');
  await compose();
  TetherUI.sfx.play('claim');
}

/* ═══════════════ from the photo library ═══════════════ */
async function fromFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/')).slice(0,SHOTS);
  if(!list.length) return;
  try{
    const frames=[];
    for(const f of list){
      const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
      const size=Math.min(1080,Math.min(bmp.width,bmp.height));
      const c=document.createElement('canvas');c.width=c.height=size;cover(c.getContext('2d'),bmp,size);frames.push(c);
      if(bmp.close) bmp.close();
    }
    S.frames=frames;S.sent=false;
    stopCamera();setState('result');await compose();
    TetherUI.sfx.play('claim');
    if(list.length<SHOTS) toast(`Used your ${list.length} photo${list.length>1?'s':''} to fill all ${SHOTS} spots`);
  }catch(e){console.error(e);toast('Could not read that photo. Try another.')}
}

/* ═══════════════ output: save, share, send to chat ═══════════════ */
const toBlob=()=>new Promise(res=>result.toBlob(res,'image/jpeg',.92));
async function save(){
  const blob=await toBlob();
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tether-photobooth-${Date.now()}.jpg`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  TetherUI.sfx.play('send');toast('Saved to your device');
}
async function share(){
  const blob=await toBlob();const file=new File([blob],'photobooth.jpg',{type:'image/jpeg'});
  try{await navigator.share({files:[file],title:'Photo Booth'})}catch(e){if(e&&e.name!=='AbortError')toast('Sharing is not available here')}
}
/* Sending behaves exactly like the chat does: sign in the same way (so the booth shares the chat's
   session on this device), upload to the images bucket with the same chat_<time>.<ext> naming,
   and post the message as the signed-in person. */
let _sb=null;
async function chatClient(){
  if(_sb) return _sb;
  const sb=supabase.createClient(SU,SK);
  let{data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
  const me=await sb.from('sessions').select('user_name').eq('auth_uid',session.user.id).limit(1);
  if(me.error)throw me.error;
  if(!me.data||!me.data[0]){const e=new Error('open the chat once on this phone first');e.step='identify';throw e}
  sb.__me=me.data[0].user_name;
  _sb=sb;return sb;
}
async function send(btn){
  // Opened from the home screen: give the photo to the chat and let the CHAT send it. It then goes
  // through exactly the same upload and permissions as a photo picked from your gallery, shows up
  // with its upload ring, and offers a retry if the network drops.
  if(TetherUI.embedded){
    btn.disabled=true;
    try{
      const blob=await toBlob();
      const file=new File([blob],'photobooth.jpg',{type:'image/jpeg'});
      parent.postMessage({type:'tether:send-image',file},location.origin);
      S.sent=true;TetherUI.sfx.play('win');TetherUI.haptic([20,50,20]);renderActions();
    }catch(e){console.error(e);toast('Could not hand the photo to the chat');btn.disabled=false}
    return;
  }
  // Opened on its own (not inside the home screen): send directly, the same way the chat does.
  btn.disabled=true;const label=btn.innerHTML;btn.innerHTML=TetherUI.icon('send')+' Sending';
  let step='sign in';
  try{
    const sb=await chatClient();
    const blob=await toBlob();
    step='upload';
    const path=`chat_${Date.now()}.jpg`;
    const up=await sb.storage.from('images').upload(path,blob,{contentType:'image/jpeg'});
    if(up.error) throw up.error;
    const url=sb.storage.from('images').getPublicUrl(path).data.publicUrl;
    step='post to chat';
    const ins=await sb.from('messages').insert({sender:sb.__me,content:null,image_url:url,reply_to:null,seen:false,reactions:{}}).select().single();
    if(ins.error) throw ins.error;
    S.sent=true;TetherUI.sfx.play('win');TetherUI.haptic([20,50,20]);toast('Sent to the chat');
    renderActions();
  }catch(e){
    console.error('photo booth send failed at',step,e);
    toast(`Could not send (${e.step||step}): ${e.message||'try again'}`);
    btn.disabled=false;btn.innerHTML=label;
  }
}

/* ═══════════════ controls ═══════════════ */
function renderActions(){
  const st=booth.dataset.state,ic=n=>TetherUI.icon(n),couple=S.mode==='couple';
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([''],'x.jpg',{type:'image/jpeg'})]}));
  acts.classList.toggle('two',st==='idle');
  acts.innerHTML=
    st==='idle'?`<button class="btn" data-act="camera">${ic('camera')} Start camera</button><button class="btn ghost" data-act="pick">${ic('image')} My photos</button><button class="btn go wide" data-act="couple">${ic('users')} Couple photo (2 phones)</button>`:
    st==='camera'?(couple?`<button class="btn sm" data-act="flip" aria-label="Switch camera">${ic('swap')}</button><button class="btn go" data-act="ready"${C.ready?' disabled':''}>${ic(C.ready?'check':'heart')} ${C.ready?'Ready':"I'm ready"}</button><button class="btn sm ghost" data-act="stop" aria-label="Leave">${ic('close')}</button>`:
      `<button class="btn sm" data-act="flip" aria-label="Switch camera">${ic('swap')}</button><button class="btn go" data-act="shoot">${ic('camera')} Take ${SHOTS} photos</button><button class="btn sm ghost" data-act="stop" aria-label="Close camera">${ic('close')}</button>`):
    st==='shooting'?`<button class="btn ghost" data-act="cancel">${ic('close')} Cancel</button>`:
    `<button class="btn ghost" data-act="again">${ic('reset')} Retake</button><button class="btn" data-act="save">${ic('download')} Save</button>${canShare?`<button class="btn sm ghost" data-act="share" aria-label="Share">${ic('share')}</button>`:''}<button class="btn go" data-act="send" aria-label="Send to chat"${S.sent?' disabled':''}>${ic(S.sent?'check':'send')} ${S.sent?'Sent':'Send'}</button>`;
}
acts.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  TetherUI.unlock();
  ({camera:()=>{S.mode='solo';renderLayouts();startCamera()},pick:()=>{S.mode='solo';renderLayouts();$('#picker').click()},couple:coupleStart,ready:coupleReady,
    flip:()=>{S.facing=S.facing==='user'?'environment':'user';startCamera()},
    shoot,cancel:()=>{S.cancel=true},stop:()=>{coupleLeave(true);stopCamera();S.mode='solo';renderLayouts();setState('idle')},
    again:()=>{S.frames=[];coupleLeave(false);S.mode='solo';renderLayouts();setState('idle')},save,share,send:()=>send(b)})[b.dataset.act]();
});
$('#picker').addEventListener('change',e=>{fromFiles(e.target.files);e.target.value=''});

const LAYOUTS={solo:[['film','Film strip'],['polaroid','Polaroids'],['booth','Booth']],couple:[['blend','Blend'],['split','Split'],['film','Strip'],['polaroid','Polaroids']]};
const curTpl=()=>S.mode==='couple'?prefs.ctpl:prefs.tpl;
function renderLayouts(){$('#segTpl').innerHTML=LAYOUTS[S.mode].map(([k,l])=>`<button type="button" data-tpl="${k}" aria-pressed="false">${l}</button>`).join('');syncSegs()}
function syncSegs(){
  document.querySelectorAll('#segTpl button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tpl===curTpl())));
  document.querySelectorAll('#segLook button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.look===prefs.look)));
}
function savePrefs(){try{localStorage.setItem('booth:prefs',JSON.stringify(prefs))}catch(e){}}
$('#segTpl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(S.mode==='couple')prefs.ctpl=b.dataset.tpl;else prefs.tpl=b.dataset.tpl;savePrefs();syncSegs();TetherUI.sfx.play('tap');if(booth.dataset.state==='result')compose()});
$('#segLook').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;prefs.look=b.dataset.look;savePrefs();syncSegs();applyLive();TetherUI.sfx.play('tap');if(booth.dataset.state==='result')compose()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&booth.dataset.state==='camera'){coupleLeave(true);stopCamera();S.mode='solo';renderLayouts();setState('idle')}});   // never keep the camera on in the background
addEventListener('pagehide',stopCamera);

/* ═══════════════ couple mode: two phones, one portrait ═══════════════
   Both of you open "Couple photo". The phones meet in a private realtime room (a Supabase broadcast
   channel: no table, no SQL, no storage), both tap "I'm ready", and the countdown starts on both at
   once. Each of you takes 2 photos on your own phone; the photos travel through the room and both
   phones build the same portrait. The finished picture can then be saved or sent to the chat. */
const C={sb:null,ch:null,gen:0,me:null,other:null,ready:false,partnerReady:false,started:false,mine:[],theirs:[],dots:null};
const ROUNDS=2,SEND_PX=720,cstat=$('#cstat');
const say=t=>{cstat.textContent=t;cstat.hidden=!t};
const shrink=(c,px)=>{const o=document.createElement('canvas');o.width=o.height=px;o.getContext('2d').drawImage(c,0,0,px,px);return o};
const fromUrl=url=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const o=document.createElement('canvas');o.width=o.height=SEND_PX;cover(o.getContext('2d'),im,SEND_PX);res(o)};im.onerror=rej;im.src=url});
const partnerName=()=>C.other||(C.me==='Satyam'?'Snks':'Satyam');

async function coupleStart(){
  const me=localStorage.getItem('us_user');
  if(!me){toast('Open the chat once first so I know who you are');return}
  Object.assign(C,{me,other:null,ready:false,partnerReady:false,started:false,mine:[],theirs:[],dots:null});
  S.mode='couple';S.sent=false;renderLayouts();
  await startCamera();                                   // camera first, so you can see yourself while you wait
  if(booth.dataset.state!=='camera'){S.mode='solo';renderLayouts();return}
  say('Connecting...');
  try{
    C.sb=C.sb||supabase.createClient(SU,SK);
    const gen=++C.gen;
    const ch=C.sb.channel('tether-booth-room',{config:{broadcast:{self:false},presence:{key:me}}});
    ch.on('broadcast',{event:'go'},()=>{if(C.gen===gen&&!C.started){C.started=true;coupleSequence()}});
    ch.on('broadcast',{event:'shot'},p=>{if(C.gen===gen)onShot(p.payload)});
    ch.on('broadcast',{event:'bye'},()=>{if(C.gen===gen&&!C.started)onPresence()});
    ch.on('presence',{event:'sync'},()=>{if(C.gen===gen)onPresence()});
    C.ch=ch;
    await new Promise((res,rej)=>{
      const t=setTimeout(()=>rej(new Error('timed out')),10000);
      ch.subscribe(async st=>{
        if(C.gen!==gen) return;                          // a channel we already replaced or left
        if(st==='SUBSCRIBED'){clearTimeout(t);await ch.track({user:me,ready:false});res()}
        else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(t);rej(new Error('connection failed'))}
      });
    });
    onPresence();
  }catch(e){console.error(e);toast('Could not connect: '+e.message);coupleLeave(false);stopCamera();S.mode='solo';renderLayouts();setState('idle')}
}
function onPresence(){
  if(!C.ch||C.started||booth.dataset.state!=='camera') return;
  const st=C.ch.presenceState(),others=Object.keys(st).filter(k=>k!==C.me);
  C.other=others[0]||null;
  C.partnerReady=!!(C.other&&st[C.other]&&st[C.other][0]&&st[C.other][0].ready);
  say(!C.other?`Waiting for ${partnerName()} to open Couple photo...`:C.ready?(C.partnerReady?'Starting...':`Waiting for ${C.other} to get ready...`):C.partnerReady?`${C.other} is ready!`:`${C.other} is here. Get ready!`);
  renderActions();
  if(C.ready&&C.partnerReady&&C.other&&[C.me,C.other].sort()[0]===C.me) hostGo();   // the first name alphabetically starts it, so exactly one phone does
}
async function coupleReady(){
  if(!C.ch||C.ready) return;
  C.ready=true;TetherUI.sfx.play('tap');
  await C.ch.track({user:C.me,ready:true});onPresence();
}
async function hostGo(){
  if(C.started) return;
  C.started=true;
  C.ch.send({type:'broadcast',event:'go',payload:{}});
  await sleep(180);                                      // about the time the message takes to reach the other phone
  coupleSequence();
}
async function coupleSequence(){
  S.cancel=false;setState('shooting');say('');
  const dots=C.dots=[...document.querySelectorAll('#shots span')];
  dots.forEach(d=>{d.style.backgroundImage='';d.classList.remove('on')});
  const count=$('#count'),flash=$('#flash');
  for(let r=0;r<ROUNDS&&!S.cancel;r++){
    dots[r*2].classList.add('on');
    for(let n=3;n>=1&&!S.cancel;n--){
      count.textContent=n;count.classList.remove('tick');void count.offsetWidth;count.classList.add('tick');
      TetherUI.sfx.play('count');TetherUI.haptic(10);
      await sleep(TICK);
    }
    if(S.cancel) break;
    count.textContent='';flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
    TetherUI.sfx.play('shutter');TetherUI.haptic([30,40,30]);
    const f=shrink(grab(),SEND_PX);C.mine[r]=f;
    dots[r*2].classList.remove('on');dots[r*2].style.backgroundImage=`url(${f.toDataURL('image/jpeg',.4)})`;
    C.ch.send({type:'broadcast',event:'shot',payload:{round:r,data:f.toDataURL('image/jpeg',.68)}});
    await sleep(TICK*.7);
  }
  if(S.cancel){coupleLeave(true);stopCamera();S.mode='solo';renderLayouts();setState('idle');return}
  stopCamera();say('Developing...');
  const t0=Date.now();
  while(C.theirs.filter(Boolean).length<ROUNDS&&Date.now()-t0<15000&&!S.cancel) await sleep(120);
  say('');
  if(C.theirs.filter(Boolean).length<ROUNDS){toast(`${partnerName()}'s photos did not arrive. Try again.`);coupleLeave(true);S.mode='solo';renderLayouts();setState('idle');return}
  S.names=[C.me,C.other].sort();
  S.frames=[];                                           // strip order: round 1 (both of you), round 2 (both of you); the same on both phones
  for(let r=0;r<ROUNDS;r++) for(const nm of S.names) S.frames.push(nm===C.me?C.mine[r]:C.theirs[r]);
  coupleLeave(false);
  setState('result');await compose();TetherUI.sfx.play('claim');
}
async function onShot(p){
  try{
    C.theirs[p.round]=await fromUrl(p.data);
    if(C.dots&&C.dots[p.round*2+1]) C.dots[p.round*2+1].style.backgroundImage=`url(${C.theirs[p.round].toDataURL('image/jpeg',.4)})`;
  }catch(e){console.error('could not read the other phone\'s photo',e)}
}
function coupleLeave(tell){
  C.gen++;C.started=false;C.ready=false;C.partnerReady=false;say('');
  if(C.ch){const ch=C.ch;C.ch=null;try{if(tell)ch.send({type:'broadcast',event:'bye',payload:{}})}catch(e){}try{C.sb.removeChannel(ch)}catch(e){}}
}

renderLayouts();setState('idle');
TetherUI.onExit(()=>{try{coupleLeave(true)}catch(e){}stopCamera();});   // Exit: tell the partner we left, free the room connection and switch the camera off
TetherUI.mount({extras:[
  `<details class="how"><summary>How it works</summary><ol><li>Pick a layout and a film look.</li><li>Start the camera. It counts down and takes ${SHOTS} photos, or choose photos you already have.</li><li>Change the layout or look any time on the result, then save it or send it to the chat.</li><li>Couple photo: you both open it on your own phones, tap I'm ready, and each take 2 photos. The app merges them into one portrait.</li></ol></details>`
]});
})();
</script>
</body>
</html>
