<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#fff4e6" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#241a2d" media="(prefers-color-scheme: dark)"/>
<title>Photo Booth</title>
<!-- tether:page declaration. The home screen builds its menu from these lines (see tether-pages.js). -->
<meta name="tether:page" content="tool"/>
<meta name="tether:title" content="Photo Booth"/>
<meta name="tether:icon" content="g-booth"/>
<meta name="tether:blurb" content="Film looks, live lenses &amp; collages"/>
<meta name="tether:order" content="10"/>
<meta name="tether:action" content="Open"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Figtree:wght@400..800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games.css">
<script src="games-ui.js"></script>
<script src="booth-lens.js"></script>
<style>
/* Photo Booth only. Tokens, buttons, cards, sheets, icons live in games.css / games-ui.js. */
body[data-game="booth"]{--tint:var(--peach);--tint2:var(--lilac)}
.booth{flex:1 1 auto;min-block-size:0;display:flex;flex-direction:column;gap:.6rem}

/* the stage takes the free height; whatever is on it is the biggest thing that fits */
.viewport{flex:1 1 0;min-block-size:0;container-type:size;display:grid;place-items:center}
.viewport>*{grid-area:1/1}
.idle,.cam,#result{display:none}
.booth[data-state="idle"] .idle{display:grid}
.booth:is([data-state="camera"],[data-state="shooting"]) .cam{display:block}
.booth[data-state="result"] #result{display:block}

.idle{
  inline-size:min(100cqi,100cqb);aspect-ratio:1;place-items:center;align-content:center;gap:.7rem;text-align:center;padding:1.2rem;
  background:var(--card);border:var(--bw) dashed var(--line);border-radius:var(--r-lg);color:var(--text-dim);
}
.idle .big{display:grid;place-items:center;inline-size:5rem;block-size:5rem;border-radius:1.6rem;background:var(--butter);color:var(--plum);border:var(--bw) solid var(--line);box-shadow:0 var(--lift) 0 var(--shadow);rotate:-4deg}
.idle .big .i{inline-size:2.6rem;block-size:2.6rem}
.idle h2{font-size:1.5rem;color:var(--text)}
.idle p{font-size:.92rem;max-inline-size:17rem}

.cam{
  position:relative;inline-size:min(100cqi,100cqb);aspect-ratio:1;overflow:hidden;background:#120c14;
  border:var(--bw) solid var(--line);border-radius:var(--r-lg);box-shadow:0 var(--lift) 0 var(--shadow);
}
.cam video{position:absolute;inset:0;inline-size:100%;block-size:100%;object-fit:cover;filter:var(--live,none)}
.cam[data-facing="user"] video{scale:-1 1}
.cam::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(closest-side,transparent 62%,rgb(20 8 0/.45));}
.count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 9rem/1 var(--font-display);color:#fff;-webkit-text-stroke:3px var(--plum);paint-order:stroke fill;text-shadow:0 .4rem 0 var(--plum);z-index:2}
.count.tick{animation:countPop .8s var(--ease-out) both}
@keyframes countPop{0%{opacity:0;scale:1.6}25%{opacity:1;scale:1}85%{opacity:1}100%{opacity:0;scale:.9}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.shots{position:absolute;inset-inline:0;inset-block-end:.6rem;display:flex;gap:.4rem;justify-content:center;z-index:2}
.shots span{inline-size:2.1rem;block-size:2.1rem;border-radius:.55rem;border:2px solid #fff;background:rgb(0 0 0/.35);background-size:cover;background-position:center;box-shadow:0 .1rem 0 rgb(0 0 0/.4)}
.shots span.on{outline:3px solid var(--butter)}

#result{inline-size:auto;block-size:auto;max-inline-size:100cqi;max-block-size:100cqb;border-radius:.5rem;box-shadow:0 .3rem 0 var(--shadow),0 0 0 2px var(--line);animation:resultIn .5s var(--ease-spring) both}
@keyframes resultIn{from{opacity:0;scale:.9;rotate:-2deg}}

.controls{gap:.55rem;padding:.7rem}
.ctl{display:flex;flex-direction:column;gap:.25rem}
.ctl>span{font:600 .8rem var(--font-display);color:var(--text-dim)}
.seg.fill{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg.fill button{min-inline-size:0;padding:.4rem .2rem;font-size:.86rem}
.acts{display:flex;gap:.5rem}
.acts .btn{flex:1;min-inline-size:0;padding-inline:.6rem;font-size:1rem}
.acts .btn.sm{flex:none}
.acts .btn[disabled]{opacity:.5}
.picker-label{display:contents}
.cstat{position:absolute;inset-inline:.6rem;top:.6rem;z-index:4;text-align:center;font:600 .92rem var(--font-display);color:var(--plum);background:var(--butter);border:2px solid var(--line);border-radius:99px;padding:.3rem .8rem;box-shadow:0 .14rem 0 var(--shadow)}
.acts.two{flex-wrap:wrap}.acts .btn.wide{flex:1 1 100%}
@media (max-height:640px){ .idle .big{inline-size:3.6rem;block-size:3.6rem} .idle p{display:none} .count{font-size:6rem} }

/* ═══════ lenses, looks, animations ═══════ */
.cam canvas{position:absolute;inset:0;inline-size:100%;block-size:100%;display:block}
.cam canvas[hidden]{display:none}
.cam #lens{filter:var(--live,none)}
.cam[data-facing="user"] #lens{scale:-1 1}
.cam #fx{pointer-events:none}
.cam.raw::after{display:none}                                  /* No filter: not even the soft vignette */
.badge{position:absolute;inset-inline-start:.6rem;top:.6rem;z-index:3;padding:.2rem .7rem;font:600 .78rem var(--font-display);color:var(--plum);background:var(--mint);border:2px solid var(--line);border-radius:99px;box-shadow:0 .12rem 0 var(--shadow)}
.cstat:not([hidden])~.badge{top:3.1rem}
.badge[hidden]{display:none}

/* the tray: three tabs, one row of tiles */
.tabs{margin-block-end:.1rem}
.tabs button[aria-disabled=true]{opacity:1;color:var(--text-dim);font-style:italic;cursor:not-allowed}   /* lenses cannot be added after the photos are taken: shown, but clearly unavailable */
.tray{position:relative;min-block-size:5.1rem}
.pane[hidden]{display:none!important}
.pane:not([hidden]){animation:paneIn .22s var(--ease-out)}
@keyframes paneIn{from{opacity:0;translate:0 .35rem}}
.tiles{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x proximity;padding:.2rem .15rem .35rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;scroll-snap-align:center;inline-size:3.9rem;display:grid;justify-items:center;gap:.25rem;padding:0;background:none;border:0;color:var(--text);font:600 .68rem/1.1 var(--font-display);cursor:pointer;touch-action:manipulation}
.tile .th{display:block;inline-size:3.5rem;block-size:3.5rem;border-radius:1rem;border:2px solid var(--line);background:var(--card);box-shadow:0 .15rem 0 var(--shadow);overflow:hidden}
.tile .th>i{display:block;inline-size:100%;block-size:100%;background:var(--snap,none) center/cover}
.tile .lb{max-inline-size:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile[aria-pressed=true] .th{outline:3px solid var(--text);outline-offset:2px}
.tile[aria-pressed=true] .lb{font-weight:700}
.tile.pop .th{animation:tilePop .42s var(--ease-spring)}
@keyframes tilePop{0%{scale:.82}60%{scale:1.1}100%{scale:1}}
.tiles.off .tile[data-lens],.tiles.off .tile[data-fx]{opacity:.5}
.tiles-note{font:600 .72rem var(--font-display);color:var(--text-dim);padding:0 .15rem}

/* countdown: the number pops and a ring rings out */
.count{container-type:normal}
.count.tick::after{content:'';grid-area:1/1;inline-size:min(60%,15rem);aspect-ratio:1;border:.5rem solid #fff;border-radius:50%;opacity:0;animation:ringOut .8s var(--ease-out) both;filter:drop-shadow(0 0 .4rem rgb(0 0 0/.3))}
@keyframes ringOut{0%{scale:.45;opacity:.95}100%{scale:1.45;opacity:0}}
.count[data-hint]::before{content:attr(data-hint);grid-area:1/1;align-self:end;margin-block-end:18%;font:700 1.7rem var(--font-display);color:#fff;-webkit-text-stroke:2px var(--plum);paint-order:stroke fill;animation:hintIn .5s var(--ease-spring) both}
@keyframes hintIn{from{opacity:0;translate:0 .8rem;scale:.7}}
/* shutter: the frame dips like a camera body, and the photo flies to its slot */
.cam.snap{animation:snapDip .38s ease-out}
@keyframes snapDip{0%{scale:1}30%{scale:.972}100%{scale:1}}
.fly{position:absolute;z-index:4;pointer-events:none;border:3px solid #fff;border-radius:.7rem;background-size:cover;background-position:center;box-shadow:0 .5rem 1.2rem rgb(0 0 0/.35)}
/* result: the photo "develops" and slides out of the slot */
#result.dev{animation:develop 1.1s ease-out both,slideOut .7s var(--ease-spring) both}
@keyframes develop{0%{filter:brightness(.35) sepia(1) blur(7px) saturate(.4)}60%{filter:brightness(.9) sepia(.4) blur(1.5px)}100%{filter:none}}
@keyframes slideOut{from{opacity:.4;translate:0 2.2rem;scale:.92}}
/* idle: decorations drift around the camera */
.idle{position:relative;overflow:hidden}
.idle>*:not(.float){position:relative;z-index:1}
.float{position:absolute;z-index:0;inline-size:1.1rem;block-size:1.1rem;opacity:0;pointer-events:none}
.float svg{inline-size:100%;block-size:100%;fill:currentColor;stroke:var(--line);stroke-width:2.2;stroke-linejoin:round;overflow:visible}
.float.f1{left:12%;bottom:12%;color:var(--pink);animation:floaty 6.5s ease-in-out infinite}
.float.f2{right:14%;bottom:20%;color:var(--sky);inline-size:.9rem;block-size:.9rem;animation:floaty 7.5s ease-in-out 1.6s infinite}
.float.f3{left:22%;bottom:34%;color:var(--butter);inline-size:.8rem;block-size:.8rem;animation:floaty 8s ease-in-out 3s infinite}
.float.f4{right:24%;bottom:8%;color:var(--mint);inline-size:1.2rem;block-size:1.2rem;animation:floaty 9s ease-in-out .8s infinite}
@keyframes floaty{0%{opacity:0;translate:0 0;rotate:0deg}15%{opacity:.9}85%{opacity:.9}100%{opacity:0;translate:.6rem -9rem;rotate:24deg}}
.idle .big{animation:bobble 3.2s ease-in-out infinite}
@keyframes bobble{50%{translate:0 -.3rem;rotate:-3deg}}
.acts.many .btn:not(.go) .lbl{white-space:nowrap}
@media (max-width:480px){
  .acts.many .lbl{display:none}
  .acts.many .btn:not(.go):not(.sm){flex:none;inline-size:2.9rem;padding-inline:0;display:inline-grid;place-items:center}
}
#segTpl{display:flex;overflow-x:auto;gap:.35rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
#segTpl::-webkit-scrollbar{display:none}
#segTpl button{flex:1 0 auto;white-space:nowrap;padding-inline:.9rem;scroll-snap-align:center}
.booth:is([data-state=shooting],[data-state=result]) .controls .tabs{pointer-events:none}
.booth[data-state=shooting] .controls .tray{opacity:.5;pointer-events:none}
@media (max-width:340px){.tile{inline-size:3.5rem}.tile .th{inline-size:3.2rem;block-size:3.2rem}}
@media (max-height:640px){.tray{min-block-size:4.6rem}.tile .th{inline-size:3rem;block-size:3rem}.tile{inline-size:3.3rem}}
@media (prefers-reduced-motion:reduce){
  .float,.idle .big,.count.tick::after,#result.dev,.cam.snap,.tile.pop .th,.pane:not([hidden]){animation:none!important}
  .float{display:none}
}
</style>
</head>
<body data-game="booth">
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html" aria-label="Back to Tether">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="sr-only">Back to Tether</span>
    </a>
    <div class="brand">
      <span class="ic" aria-hidden="true"><svg class="i"><use href="#i-g-booth"/></svg></span>
      <h1>Photo Booth</h1>
    </div>
    <div style="width:2.75rem"></div>
  </div>

  <main class="booth" id="booth" data-state="idle">
    <div class="viewport">
      <div class="idle" id="idle">
        <span class="float f1" aria-hidden="true"><svg viewBox="-30 -24 60 44"><path d="M0 15C-27-2-15-21 0-8C15-21 27-2 0 15Z"/></svg></span>
        <span class="float f2" aria-hidden="true"><svg viewBox="-22 -22 44 44"><path d="M0-19L5.6-6.6 19-5.9 8.8 3.4 11.8 17 0 10 -11.8 17 -8.8 3.4 -19-5.9 -5.6-6.6Z"/></svg></span>
        <span class="float f3" aria-hidden="true"><svg viewBox="-22 -22 44 44"><path d="M0-19L5.6-6.6 19-5.9 8.8 3.4 11.8 17 0 10 -11.8 17 -8.8 3.4 -19-5.9 -5.6-6.6Z"/></svg></span>
        <span class="float f4" aria-hidden="true"><svg viewBox="-30 -24 60 44"><path d="M0 15C-27-2-15-21 0-8C15-21 27-2 0 15Z"/></svg></span>
        <span class="big" aria-hidden="true"><svg class="i"><use href="#i-camera"/></svg></span>
        <h2>Say cheese!</h2>
        <p>Pick a layout, a look and a lens, then take four photos or use ones you already have.</p>
      </div>
      <div class="cam" id="cam" data-facing="user">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="lens" hidden></canvas>
        <canvas id="fx" hidden></canvas>
        <div class="count" id="count" aria-hidden="true"></div>
        <div class="flash" id="flash"></div>
        <div class="cstat" id="cstat" hidden></div>
        <div class="badge" id="badge" hidden>No filter · photos stay untouched</div>
        <div class="shots" id="shots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      </div>
      <canvas id="result" role="img" aria-label="Your finished photo collage"></canvas>
    </div>

    <div class="card tight controls">
      <div class="seg fill tabs" id="tabs" role="tablist" aria-label="Customise">
        <button type="button" role="tab" data-tab="layout" aria-pressed="true">Layout</button>
        <button type="button" role="tab" data-tab="look" aria-pressed="false">Look</button>
        <button type="button" role="tab" data-tab="lens" aria-pressed="false">Lens</button>
      </div>
      <div class="tray" id="tray">
        <div class="seg fill pane" id="segTpl" data-pane="layout" role="group" aria-label="Layout"></div>
        <div class="tiles pane" id="segLook" data-pane="look" role="group" aria-label="Film look" hidden></div>
        <div class="tiles pane" id="segLens" data-pane="lens" role="group" aria-label="Lens" hidden></div>
      </div>
      <div class="acts" id="acts"></div>
    </div>
  </main>
</div>

<input type="file" id="picker" accept="image/*" multiple hidden>
<div class="toast" id="toast" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const TICK=new URLSearchParams(location.search).has('fast')?110:1000;   // ?fast=1 shortens the countdown (used for testing)
const SHOTS=4;
const SU='https://ggfxdeuwifmqulyhchtv.supabase.co';
const SK='sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI';

/* ═══════════════ state ═══════════════ */
const prefs={tpl:'film',ctpl:'blend',look:'kodak',lastLook:'kodak',lens:'none',fx:'none',tab:'layout'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('booth:prefs')||'{}'))}catch{}
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const S={mode:'solo',names:['you','me'],stream:null,facing:'user',frames:[],raws:[],busy:false,cancel:false,sent:false,composeToken:0};
const booth=$('#booth'),video=$('#video'),result=$('#result'),acts=$('#acts');

function setState(st){booth.dataset.state=st;renderActions();if(window.__fxSync)window.__fxSync()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');TetherUI.say(msg);clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ═══════════════ looks: a tiny film emulator ═══════════════ */
// Each look is a recipe: saturation, contrast, colour balance, lifted blacks, grain, vignette, light leak.
const LOOKS={
  none:  {none:true,live:'none'},                                              // No filter: nothing is applied, anywhere
  kodak: {sat:1.18,contrast:1.10,mul:[1.06,1.00,.90],shadow:[.02,0,-.02],lift:.03,grain:.07,vignette:.42,leak:.30,live:'contrast(1.1) saturate(1.2) sepia(.15)'},
  faded: {sat:.80,contrast:.90,mul:[1.02,1.00,1.00],shadow:[-.01,.03,.05],lift:.11,grain:.06,vignette:.32,leak:.16,live:'contrast(.92) saturate(.8) brightness(1.06) sepia(.1) hue-rotate(-8deg)'},
  mono:  {sat:0,  contrast:1.24,mul:[1.02,1.00,.96],shadow:[0,0,0],lift:.05,grain:.10,vignette:.50,leak:0,live:'grayscale(1) contrast(1.2)'},
  sepia: {sat:0,  contrast:1.10,mul:[1.12,.98,.78],shadow:[.03,.01,-.03],lift:.06,grain:.08,vignette:.50,leak:.12,live:'sepia(.9) contrast(1.05)'},
  vivid: {sat:1.45,contrast:1.15,mul:[1.02,1.02,1.02],shadow:[0,0,0],lift:.01,grain:.02,vignette:.16,leak:0,live:'saturate(1.5) contrast(1.12)'},
  cool:  {sat:1.05,contrast:1.08,mul:[.92,1.00,1.10],shadow:[-.02,0,.05],hi:[0,.02,.05],lift:.03,grain:.05,vignette:.30,leak:0,live:'contrast(1.08) saturate(1.05) hue-rotate(10deg) brightness(1.02)'},
  noir:  {sat:0,  contrast:1.45,mul:[1,1,1.02],shadow:[0,0,.01],lift:0,grain:.14,vignette:.62,leak:0,live:'grayscale(1) contrast(1.4) brightness(.95)'},
  rose:  {sat:1.10,contrast:1.05,mul:[1.08,.96,1.02],shadow:[.03,-.01,.02],lift:.05,grain:.05,vignette:.30,leak:.22,bloom:.12,live:'saturate(1.15) sepia(.12) hue-rotate(-25deg) brightness(1.04)'},
  golden:{sat:1.25,contrast:1.08,mul:[1.12,1.02,.82],shadow:[.03,.01,-.03],hi:[.06,.03,0],lift:.03,grain:.06,vignette:.38,leak:.35,bloom:.10,live:'sepia(.35) saturate(1.35) contrast(1.05) brightness(1.04)'},
  cyber: {sat:1.35,contrast:1.20,mul:[1,1,1],shadow:[-.04,.03,.09],hi:[.10,-.02,.08],lift:.02,grain:.05,vignette:.35,leak:0,live:'contrast(1.2) saturate(1.4) hue-rotate(-12deg)'},
  dream: {sat:1.05,contrast:.92,mul:[1.04,1,1.04],shadow:[.02,.01,.03],lift:.08,grain:.03,vignette:.20,leak:.15,bloom:.35,live:'brightness(1.1) contrast(.9) saturate(1.1)'},
  lomo:  {sat:1.40,contrast:1.30,mul:[1.05,1,.95],shadow:[0,0,0],lift:0,grain:.10,vignette:.75,leak:.20,live:'contrast(1.3) saturate(1.4)'},
  mint:  {sat:.95,contrast:1.00,mul:[.96,1.04,1.02],shadow:[-.01,.03,.02],lift:.06,grain:.04,vignette:.25,leak:0,bloom:.08,live:'hue-rotate(15deg) saturate(.95) brightness(1.05)'},
  sunset:{sat:1.30,contrast:1.10,mul:[1.14,.96,.86],shadow:[.05,-.01,.05],hi:[.05,.02,-.02],lift:.04,grain:.05,vignette:.40,leak:.38,live:'sepia(.25) saturate(1.5) hue-rotate(-12deg) contrast(1.08)'},
  instant:{sat:.90,contrast:.95,mul:[1.04,1.02,.94],shadow:[0,.03,.03],lift:.09,grain:.08,vignette:.35,leak:.20,live:'contrast(.95) saturate(.9) sepia(.12) brightness(1.04)'},
};
const LOOK_LIST=[['none','No filter'],['kodak','Warm'],['faded','Faded'],['mono','Mono'],['sepia','Sepia'],['vivid','Vivid'],['cool','Cool'],['noir','Noir'],['rose','Rose'],['golden','Golden'],['cyber','Cyber'],['dream','Dream'],['lomo','Lomo'],['mint','Mint'],['sunset','Sunset'],['instant','Instant']];
(()=>{                                                              // never trust saved values: an old or hand-edited one must not break the booth
  const BL=window.BoothLens;
  if(!(prefs.look in LOOKS))prefs.look='kodak';
  if(!(prefs.lastLook in LOOKS)||prefs.lastLook==='none')prefs.lastLook='kodak';
  if(!BL||!BL.LENSES.some(l=>l.key===prefs.lens))prefs.lens='none';
  if(!BL||!BL.OVERLAYS.some(o=>o.key===prefs.fx))prefs.fx='none';
  if(!['layout','look','lens'].includes(prefs.tab))prefs.tab='layout';
})();
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=v=>v<0?0:v>1?1:v;

function cover(ctx,src,size){            // centre-crop any image/canvas/bitmap to a square
  const w=src.videoWidth||src.width,h=src.videoHeight||src.height,s=Math.min(w,h);
  ctx.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,size,size);
}
function tone(src,size,lookName,seed){
  const L=LOOKS[lookName]||LOOKS.kodak,rand=rng(seed*7919+13);
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d',{willReadFrequently:true});
  cover(x,src,size);
  if(L.none) return c;                                                  // No filter: just the photo, cropped square. No colour, grain, vignette, leak or dust.
  const hi=L.hi||[0,0,0];
  const img=x.getImageData(0,0,size,size),d=img.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
    const y=.2126*r+.7152*g+.0722*b;
    r=y+(r-y)*L.sat;g=y+(g-y)*L.sat;b=y+(b-y)*L.sat;                    // saturation
    r=(r-.5)*L.contrast+.5;g=(g-.5)*L.contrast+.5;b=(b-.5)*L.contrast+.5; // contrast
    r=r*L.mul[0]+L.shadow[0]*(1-y)+hi[0]*y;g=g*L.mul[1]+L.shadow[1]*(1-y)+hi[1]*y;b=b*L.mul[2]+L.shadow[2]*(1-y)+hi[2]*y; // colour balance, tinted shadows and highlights
    r=L.lift+(1-L.lift)*r;g=L.lift+(1-L.lift)*g;b=L.lift+(1-L.lift)*b;   // lifted blacks
    const n=(rand()-.5)*L.grain;                                          // film grain
    d[i]=clamp(r+n)*255;d[i+1]=clamp(g+n)*255;d[i+2]=clamp(b+n)*255;

  x.putImageData(img,0,0);

    const m=Math.max(24,size>>3),t=document.createElement('canvas');t.width=t.height=m;const tx=t.getContext('2d');tx.imageSmoothingQuality='high';tx.drawImage(c,0,0,m,m);
    x.save();x.globalCompositeOperation='screen';x.globalAlpha=L.bloom;x.imageSmoothingEnabled=true;x.drawImage(t,0,0,size,size);x.restore();
  }
  const v=x.createRadialGradient(size/2,size/2,size*.34,size/2,size/2,size*.78);   // vignette
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(24,8,0,${L.vignette})`);
  x.fillStyle=v;x.fillRect(0,0,size,size);
  if(L.leak>0){                                                          // light leak from a random edge
    const side=Math.floor(rand()*4);                                     // 0 left, 1 right, 2 bottom, 3 top
    const [x0,y0,x1,y1]=[[0,0,size*.5,0],[size,0,size*.5,0],[0,size,0,size*.5],[0,0,0,size*.5]][side];
    const grad=x.createLinearGradient(x0,y0,x1,y1);
    grad.addColorStop(0,`rgba(255,122,48,${L.leak})`);grad.addColorStop(.5,`rgba(255,60,110,${L.leak*.4})`);grad.addColorStop(1,'rgba(255,60,110,0)');
    x.globalCompositeOperation='screen';x.fillStyle=grad;x.fillRect(0,0,size,size);x.globalCompositeOperation='source-over';
  }
  x.fillStyle='rgba(255,250,235,.55)';                                   // dust
  for(let i=0;i<14;i++){const px=rand()*size,py=rand()*size,pr=.6+rand()*1.6;x.beginPath();x.arc(px,py,pr,0,6.283);x.fill()}
  x.strokeStyle='rgba(255,250,235,.18)';x.lineWidth=1;                   // a couple of hairline scratches
  for(let i=0;i<2;i++){const px=rand()*size;x.beginPath();x.moveTo(px,0);x.lineTo(px+(rand()-.5)*12,size);x.stroke()}
  return c;
}

const dateText=()=>new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'2-digit'});
function rr(x,X,Y,W,H,R){x.beginPath();x.roundRect?x.roundRect(X,Y,W,H,R):x.rect(X,Y,W,H)}

const TEMPLATES={
  // BLEND: one portrait where the two of you fade into each other along a diagonal, with a heart on the seam
  blend:{size:720,count:2,draw(frames){

    x.strokeStyle='#3b2a45';x.lineWidth=5;rr(x,ix,iy,iw,ih,18);x.stroke();
    x.save();x.translate(ix+iw/2,iy+ih/2);x.rotate(.12);x.scale(2.6,2.6);x.fillStyle='#ff9cc0';x.strokeStyle='#3b2a45';x.lineWidth=2.4;x.lineJoin='round';x.fill(HEART);x.stroke(HEART);x.restore();
    x.fillStyle='#3b2a45';x.textAlign='center';x.font='700 78px Caveat,cursive';x.fillText(`${S.names[0]} & ${S.names[1]}`,W/2,H-P-82);
    x.font='600 30px Fredoka,sans-serif';x.fillText(dateText(),W/2,H-P-30);
    return c}},
  // SPLIT: two tilted portraits side by side, a big heart between them
  split:{size:720,count:2,draw(frames){
    const W=1200,H=1060,PW=520,PH=690,Y=64,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    x.fillStyle='#fffaf0';x.fillRect(0,0,W,H);x.strokeStyle='#3b2a45';x.lineWidth=8;x.strokeRect(4,4,W-8,H-8);
    [[46,-1.4],[634,1.4]].forEach(([px,deg],i)=>{
      x.save();x.translate(px+PW/2,Y+PH/2);x.rotate(deg*Math.PI/180);x.translate(-PW/2,-PH/2);
      x.shadowColor='rgba(40,20,10,.22)';x.shadowBlur=22;x.shadowOffsetY=10;x.fillStyle='#fff';x.fillRect(-12,-12,PW+24,PH+24);x.shadowColor='transparent';
      x.beginPath();x.rect(0,0,PW,PH);x.clip();const k=PH/frames[i].height;x.drawImage(frames[i],(PW-frames[i].width*k)/2,0,frames[i].width*k,PH);

    x.save();x.translate(W/2,Y+PH/2);x.rotate(-.1);x.scale(2.8,2.8);x.fillStyle='#ff9cc0';x.strokeStyle='#3b2a45';x.lineWidth=2.4;x.lineJoin='round';x.fill(HEART);x.stroke(HEART);x.restore();
    x.fillStyle='#3b2a45';x.textAlign='center';x.font='700 70px Caveat,cursive';
    x.fillText(S.names[0],46+PW/2,Y+PH+105);x.fillText(S.names[1],634+PW/2,Y+PH+105);
    x.font='600 28px Fredoka,sans-serif';x.fillText(dateText(),W/2,H-34);

  film:{size:460,draw(frames){
    const FW=460,GAP=26,TOP=46,SIDE=80,W=FW+SIDE*2,H=TOP*2+SHOTS*FW+(SHOTS-1)*GAP;

    x.fillStyle='#efe6d6';                                              // sprocket holes

      x.save();x.translate(SIDE-14,y+FW-14);x.rotate(-Math.PI/2);x.font='600 15px Figtree,sans-serif';x.fillText('TETHER 400',0,0);x.restore();
      x.beginPath();x.moveTo(SIDE-12,y+FW/2-7);x.lineTo(SIDE-12,y+FW/2+7);x.lineTo(SIDE-2,y+FW/2);x.closePath();x.fill();

  polaroid:{size:440,draw(frames){
    const W=1200,H=1300;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');

    const spots=[[78,48,-4],[630,78,3.2],[96,668,2.6],[612,648,-3.4]];   // rows far enough apart that no polaroid covers another's caption

    frames.forEach((f,i)=>{

      x.save();x.translate(px+PW/2,py+PH/2);x.rotate(deg*Math.PI/180);x.translate(-PW/2,-PH/2);
      x.shadowColor='rgba(40,20,10,.28)';x.shadowBlur=28;x.shadowOffsetY=12;x.fillStyle='#fffdf7';x.fillRect(0,0,PW,PH);

      x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=2;x.strokeRect(30,30,440,440);

    });

  // PLAIN: the photos side by side in a 2x2 grid. No border, no caption, no stickers.
  plain:{size:720,draw(frames){
    const T=720,c=document.createElement('canvas');c.width=c.height=T*2;const x=c.getContext('2d');
    frames.forEach((f,i)=>x.drawImage(f,(i%2)*T,Math.floor(i/2)*T,T,T));
    return c}},
  booth:{size:440,draw(frames){
    const FW=440,PAD=28,W=FW+PAD*2,FOOT=150,H=PAD+SHOTS*(FW+PAD)+FOOT-PAD;

    return c}},
};

/* ═══════════════ compose: tone every frame in the chosen look, lay them out, show the result ═══════════════ */
async function compose(){
  const token=++S.composeToken;
  try{await Promise.all(['700 40px Caveat','600 30px Fredoka','600 16px Figtree'].map(f=>document.fonts.load(f)))}catch(e){/* fall back to system fonts */}
  const T=TEMPLATES[curTpl()]||TEMPLATES.film;
  const toned=[];
  const need=T.count||SHOTS;
  for(let i=0;i<need;i++){
    toned.push(tone(S.frames[i%S.frames.length],T.size,prefs.look,i+1));
    if(i%2===1) await sleep(0);                                            // let the UI breathe between frames
    if(token!==S.composeToken) return;                                    // the user changed look/layout meanwhile
  }
  const out=T.draw(toned);
  result.width=out.width;result.height=out.height;
  result.getContext('2d').drawImage(out,0,0);
}

/* ═══════════════ lenses, overlays and the tray ═══════════════ */
const BL=window.BoothLens;
const camEl=$('#cam'),lensCv=$('#lens'),fxCv=$('#fx'),badge=$('#badge'),tray=$('#tray');
const LV={eng:null,tried:false,snap:null,snapCv:null,thumb:null,thumbCv:null,ov:null,ovKind:'none',raf:0,last:0,t:0,snapT:0,ovThumbs:{},warned:'',cap:540,ema:0,n:0};
const isRaw=()=>prefs.look==='none';                        // "No filter": no look, no lens, no overlay, nothing
const effLens=()=>isRaw()?'none':prefs.lens;
const effFx=()=>isRaw()?'none':prefs.fx;
const camActive=()=>!!S.stream&&(booth.dataset.state==='camera'||booth.dataset.state==='shooting');
function hasGL(){if(!LV.tried){LV.tried=true;LV.eng=BL?BL.createEngine(lensCv):null}return !!LV.eng&&!LV.eng.lost}
function snapEngine(size){                                    // a second renderer at the photo's full size, so lens photos are not limited to the preview size
  if(!BL||!hasGL())return null;
  if(!LV.snap){LV.snapCv=document.createElement('canvas');LV.snap=BL.createEngine(LV.snapCv)}
  if(!LV.snap)return null;
  if(LV.snapCv.width!==size)LV.snapCv.width=LV.snapCv.height=size;
  return LV.snap;
}
function sizeFx(){
  const r=camEl.getBoundingClientRect();if(r.width<2)return;
  const px=Math.min(LV.cap,Math.round(r.width*Math.min(2,devicePixelRatio||1)));
  [lensCv,fxCv].forEach(c=>{if(c.width!==px)c.width=c.height=px});
}
if(window.ResizeObserver)new ResizeObserver(()=>{if(camActive())sizeFx()}).observe(camEl);

function frame(dt){
  const lens=effLens();
  if(lens!=='none'&&!lensCv.hidden&&video.readyState>=2&&hasGL())LV.eng.render(video,lens,LV.t);
  if(LV.ov&&!fxCv.hidden){LV.ov.step(dt);const x=fxCv.getContext('2d');x.clearRect(0,0,fxCv.width,fxCv.height);LV.ov.draw(x,fxCv.width)}
}
function startLoop(){
  if(LV.raf)return;LV.last=performance.now();
  const tick=ts=>{
    LV.raf=requestAnimationFrame(tick);const dt=Math.min(.1,(ts-LV.last)/1000);LV.last=ts;LV.t+=dt;frame(dt);
    // adaptive quality: if the preview is choppy, quietly draw it smaller (photos are always captured at full size)
    LV.ema=LV.ema?LV.ema*.9+dt*.1:dt;
    if(++LV.n>40&&LV.ema>.05&&LV.cap>360){LV.cap=Math.max(360,Math.round(LV.cap*.8));LV.n=0;LV.ema=0;sizeFx()}
  };
  LV.raf=requestAnimationFrame(tick);
}
function stopLoop(){
  if(LV.raf){cancelAnimationFrame(LV.raf);LV.raf=0}
  if(fxCv.width)fxCv.getContext('2d').clearRect(0,0,fxCv.width,fxCv.height);
}
/* Make the camera view match the chosen look, lens and overlay (and run the render loop only when something needs it). */
function syncFx(){
  const active=camActive(),lens=effLens(),fx=effFx(),eng=active&&lens!=='none'&&hasGL();
  camEl.classList.toggle('raw',isRaw());
  badge.hidden=!(active&&isRaw());
  lensCv.hidden=!eng;fxCv.hidden=!(active&&fx!=='none');
  if(fx!==LV.ovKind){LV.ovKind=fx;LV.ov=fx==='none'||!BL?null:BL.overlay(fx);if(LV.ov)LV.ov.warm(3)}   // start with the effect already in full swing, not an empty screen
  if(active&&lens!=='none'&&!eng&&LV.warned!==lens){LV.warned=lens;toast('Lenses need WebGL, which this browser does not have')}
  if(active&&(eng||(fx!=='none'&&LV.ov))){sizeFx();startLoop();if(eng)frame(0)}else stopLoop();
}

/* thumbnails: a little picture of YOU in every look and lens */
const SAMPLE=BL?BL.sampleScene(88):null;
const snapCv=document.createElement('canvas');snapCv.width=snapCv.height=88;
function thumbEngine(){
  if(!BL||!hasGL())return null;
  if(!LV.thumb){LV.thumbCv=document.createElement('canvas');LV.thumbCv.width=LV.thumbCv.height=88;LV.thumb=BL.createEngine(LV.thumbCv)}
  return LV.thumb;
}
function refreshThumbs(){
  if(!tray.getClientRects().length)return;
  const x=snapCv.getContext('2d'),live=S.stream&&video.readyState>=2,src=live?video:S.frames[0];
  if(src){x.save();if(live&&S.facing==='user'){x.translate(88,0);x.scale(-1,1)}cover(x,src,88);x.restore()}
  else if(SAMPLE)x.drawImage(SAMPLE,0,0);
  tray.style.setProperty('--snap',`url(${snapCv.toDataURL('image/jpeg',.7)})`);
  if(prefs.tab!=='lens')return;
  const te=thumbEngine();
  tray.querySelectorAll('#segLens canvas.th').forEach((cv,i)=>{
    const c2=cv.getContext('2d'),kind=cv.dataset.kind,key=cv.dataset.key;
    if(kind==='lens'&&key!=='none'&&te&&te.render(snapCv,key,LV.t+1.1+i*.37))c2.drawImage(LV.thumbCv,0,0,cv.width,cv.height);
    else c2.drawImage(snapCv,0,0,cv.width,cv.height);
    if(kind==='fx'&&BL){const ov=LV.ovThumbs[key]||(LV.ovThumbs[key]=(()=>{const o=BL.overlay(key);o.warm(2);return o})());ov.step(.12);ov.draw(c2,cv.width)}
  });
}
function buildTray(){
  $('#segLook').innerHTML=LOOK_LIST.map(([k,l])=>`<button type="button" class="tile" data-look="${k}" aria-pressed="false" aria-label="${l}"><span class="th"><i style="filter:${LOOKS[k].live}"></i></span><span class="lb">${l}</span></button>`).join('');
  const gl=!!BL&&hasGL();
  const tile=(attr,key,label,aria)=>`<button type="button" class="tile" data-${attr}="${key}" aria-pressed="false" aria-label="${aria}"><canvas class="th" width="88" height="88" data-kind="${attr}" data-key="${key}"></canvas><span class="lb">${label}</span></button>`;
  const lenses=BL?BL.LENSES.filter(l=>l.key==='none'||gl):[];
  $('#segLens').innerHTML=lenses.map(l=>tile('lens',l.key,l.label,l.key==='none'?'No lens':l.label+' lens')).join('')+(BL?BL.OVERLAYS.map(o=>tile('fx',o.key,o.label,o.label+' overlay')).join(''):'');
}
function updateTabs(){
  const lensOK=booth.dataset.state!=='result';                // a lens is part of taking the photo, so it cannot be added afterwards
  document.querySelectorAll('#tabs button[data-tab=lens]').forEach(b=>b.setAttribute('aria-disabled',String(!lensOK)));
  if(!lensOK&&prefs.tab==='lens')setTab('look',true);
}
function setTab(t,silent){
  prefs.tab=t;if(!silent)savePrefs();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));
  document.querySelectorAll('#tray .pane').forEach(p=>{p.hidden=p.dataset.pane!==t});
  refreshThumbs();
  const sel=tray.querySelector('.pane:not([hidden]) [aria-pressed=true]');
  if(sel&&sel.scrollIntoView)sel.scrollIntoView({inline:'center',block:'nearest',behavior:reduced()?'auto':'smooth'});
}
function syncUi(){
  syncFx();updateTabs();
  clearInterval(LV.snapT);LV.snapT=0;
  refreshThumbs();
  if(camActive())LV.snapT=setInterval(refreshThumbs,900);   // the thumbnails show you live while the camera is on
}
window.__fxSync=syncUi;

/* ───────── animations ───────── */
function shutter(){
  const flash=$('#flash');flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
  camEl.classList.remove('snap');void camEl.offsetWidth;camEl.classList.add('snap');
  if(LV.ov&&!reduced())LV.ov.burst();                         // confetti and hearts burst when the photo is taken
  TetherUI.sfx.play('shutter');TetherUI.haptic([30,40,30]);
}
function flyTo(dot,url){                                      // the photo you just took flies down into its slot
  if(reduced()||!dot.animate){dot.style.backgroundImage=`url(${url})`;return}
  const cam=camEl.getBoundingClientRect(),d=dot.getBoundingClientRect(),size=cam.width*.5;
  const img=document.createElement('div');img.className='fly';
  img.style.cssText=`inline-size:${size}px;block-size:${size}px;left:${cam.width/2-size/2}px;top:${cam.height/2-size/2}px;background-image:url(${url})`;
  camEl.appendChild(img);
  const dx=d.left+d.width/2-(cam.left+cam.width/2),dy=d.top+d.height/2-(cam.top+cam.height/2),k=d.width/size;
  const a=img.animate([{transform:'translate(0,0) scale(1) rotate(-2deg)'},{transform:`translate(${dx}px,${dy}px) scale(${k}) rotate(0deg)`}],{duration:480,easing:'cubic-bezier(.5,0,.2,1)',fill:'forwards'});
  a.onfinish=()=>{img.remove();dot.style.backgroundImage=`url(${url})`;dot.animate([{scale:1.4},{scale:1}],{duration:280,easing:'ease-out'})};
}
function develop(){                                           // the finished photo develops and slides out of the slot, with a little confetti
  if(reduced())return;
  result.classList.remove('dev');void result.offsetWidth;result.classList.add('dev');setTimeout(()=>result.classList.remove('dev'),1300);
  const w=document.createElement('div');w.className='confetti-wrap';document.body.appendChild(w);
  const cols=['#ff9cc0','#8ccfff','#ffe27a','#a6ebc9','#cdbbff','#ffc7a1'];
  for(let i=0;i<30;i++){const p=document.createElement('div');p.className='confetti-piece';const z=5+Math.random()*6;
    Object.assign(p.style,{width:z+'px',height:z*.4+'px',left:Math.random()*100+'vw',background:cols[i%6],animationDuration:(1.6+Math.random()*1.2)+'s',animationDelay:Math.random()*.3+'s'});w.appendChild(p)}
  setTimeout(()=>w.remove(),3200);
}
function popTile(el){if(!el||reduced())return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

/* ═══════════════ camera ═══════════════ */
async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('This browser has no camera access. Pick photos instead.');return}
  try{
    stopCamera();
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:S.facing,width:{ideal:1280},height:{ideal:960}},audio:false});
    video.srcObject=S.stream;
    await video.play().catch(()=>{});
    $('#cam').dataset.facing=S.facing;
    applyLive();setState('camera');
  }catch(e){
    const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
    toast(denied?'Camera blocked. Allow it in your browser, or pick photos.':'No camera found. Pick photos instead.');
    setState('idle');
  }
}
function stopCamera(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}video.srcObject=null;if(window.__fxSync)window.__fxSync()}
function applyLive(){$('#cam').style.setProperty('--live',isRaw()?'none':LOOKS[prefs.look].live)}
/* One photo, as you saw it: the centre square of the camera picture, with the lens (rendered at full resolution) and the
   overlay baked in. In No filter mode there is no lens and no overlay, so this is the plain camera picture. */
function grab(){
  const w=video.videoWidth,h=video.videoHeight,s=Math.min(w,h),size=Math.min(s,1080);
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const lens=effLens(),eng=lens!=='none'?snapEngine(size):null;
  x.save();
  if(S.facing==='user'){x.translate(size,0);x.scale(-1,1)}                  // selfie view is mirrored, so the photo matches what you saw
  if(eng&&eng.render(video,lens,LV.t)) x.drawImage(eng.canvas,0,0,size,size);
  else x.drawImage(video,(w-s)/2,(h-s)/2,s,s,0,0,size,size);
  x.restore();
  if(effFx()!=='none'&&LV.ov) LV.ov.draw(x,size);                          // overlays are drawn upright, exactly as they appeared
  return c;
}
/* The untouched camera frame: full size, not cropped, not mirrored, no lens, no overlay. */
function grabRaw(){
  const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);return c;
}
async function saveOriginals(){
  if(!S.raws.length){toast('No originals to save');return}
  const files=await Promise.all(S.raws.map(async(r,i)=>r instanceof File?r:new File([await new Promise(res=>r.toBlob(res,'image/jpeg',.95))],`tether-original-${i+1}.jpg`,{type:'image/jpeg'})));
  if(navigator.canShare&&navigator.canShare({files})){                      // phones: one tap puts them all in Photos
    try{await navigator.share({files,title:'Original photos'});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);await sleep(250)}
  TetherUI.sfx.play('send');toast(`Saved ${files.length} original photo${files.length>1?'s':''}`);
}

async function shoot(){
  if(S.busy) return;
  S.busy=true;S.cancel=false;S.frames=[];S.raws=[];S.sent=false;
  setState('shooting');
  const dots=[...document.querySelectorAll('#shots span')];
  dots.forEach(d=>{d.style.backgroundImage='';d.classList.remove('on')});
  const count=$('#count'),flash=$('#flash');
  for(let i=0;i<SHOTS&&!S.cancel;i++){
    dots[i].classList.add('on');
    for(let n=3;n>=1&&!S.cancel;n--){
      count.textContent=n;count.dataset.hint=n===1?'Smile!':'';count.classList.remove('tick');void count.offsetWidth;count.classList.add('tick');
      TetherUI.sfx.play('count');TetherUI.haptic(10);
      await sleep(TICK);
    }
    if(S.cancel)break;
    count.textContent='';count.dataset.hint='';
    shutter();
    const f=grab();S.frames.push(f);S.raws.push(grabRaw());
    dots[i].classList.remove('on');flyTo(dots[i],f.toDataURL('image/jpeg',.4));
    await sleep(TICK*.7);
  }
  S.busy=false;
  if(S.cancel||S.frames.length<SHOTS){stopCamera();setState('idle');return}
  stopCamera();
  setState('result');
  await compose();develop();
  TetherUI.sfx.play('claim');
}

/* ═══════════════ from the photo library ═══════════════ */
async function fromFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('image/')).slice(0,SHOTS);
  if(!list.length) return;
  try{
    const frames=[];
    for(const f of list){
      const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
      const size=Math.min(1080,Math.min(bmp.width,bmp.height));
      const c=document.createElement('canvas');c.width=c.height=size;cover(c.getContext('2d'),bmp,size);frames.push(c);
      if(bmp.close) bmp.close();
    }
    S.frames=frames;S.raws=list.slice();S.sent=false;
    stopCamera();setState('result');await compose();develop();
    TetherUI.sfx.play('claim');
    if(list.length<SHOTS) toast(`Used your ${list.length} photo${list.length>1?'s':''} to fill all ${SHOTS} spots`);
  }catch(e){console.error(e);toast('Could not read that photo. Try another.')}
}

/* ═══════════════ output: save, share, send to chat ═══════════════ */
const toBlob=()=>new Promise(res=>result.toBlob(res,'image/jpeg',.92));
async function save(){
  const blob=await toBlob();
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tether-photobooth-${Date.now()}.jpg`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  TetherUI.sfx.play('send');toast('Saved to your device');
}
async function share(){
  const blob=await toBlob();const file=new File([blob],'photobooth.jpg',{type:'image/jpeg'});
  try{await navigator.share({files:[file],title:'Photo Booth'})}catch(e){if(e&&e.name!=='AbortError')toast('Sharing is not available here')}
}
/* Sending behaves exactly like the chat does: sign in the same way (so the booth shares the chat's
   session on this device), upload to the images bucket with the same chat_<time>.<ext> naming,
   and post the message as the signed-in person. */
let _sb=null;
async function chatClient(){
  if(_sb) return _sb;
  const sb=supabase.createClient(SU,SK);
  let{data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}
  const me=await sb.from('sessions').select('user_name').eq('auth_uid',session.user.id).limit(1);
  if(me.error)throw me.error;
  if(!me.data||!me.data[0]){const e=new Error('open the chat once on this phone first');e.step='identify';throw e}
  sb.__me=me.data[0].user_name;
  _sb=sb;return sb;
}
async function send(btn){
  // Opened from the home screen: give the photo to the chat and let the CHAT send it. It then goes
  // through exactly the same upload and permissions as a photo picked from your gallery, shows up
  // with its upload ring, and offers a retry if the network drops.
  if(TetherUI.embedded){
    btn.disabled=true;
    try{
      const blob=await toBlob();
      const file=new File([blob],'photobooth.jpg',{type:'image/jpeg'});
      parent.postMessage({type:'tether:send-image',file},location.origin);
      S.sent=true;TetherUI.sfx.play('win');TetherUI.haptic([20,50,20]);renderActions();
    }catch(e){console.error(e);toast('Could not hand the photo to the chat');btn.disabled=false}
    return;
  }
  // Opened on its own (not inside the home screen): send directly, the same way the chat does.
  btn.disabled=true;const label=btn.innerHTML;btn.innerHTML=TetherUI.icon('send')+' Sending';
  let step='sign in';
  try{
    const sb=await chatClient();
    const blob=await toBlob();
    step='upload';
    const path=`chat_${Date.now()}.jpg`;
    const up=await sb.storage.from('images').upload(path,blob,{contentType:'image/jpeg'});
    if(up.error) throw up.error;
    const url=sb.storage.from('images').getPublicUrl(path).data.publicUrl;
    step='post to chat';
    const ins=await sb.from('messages').insert({sender:sb.__me,content:null,image_url:url,reply_to:null,seen:false,reactions:{}}).select().single();
    if(ins.error) throw ins.error;
    S.sent=true;TetherUI.sfx.play('win');TetherUI.haptic([20,50,20]);toast('Sent to the chat');
    renderActions();
  }catch(e){
    console.error('photo booth send failed at',step,e);
    toast(`Could not send (${e.step||step}): ${e.message||'try again'}`);
    btn.disabled=false;btn.innerHTML=label;
  }
}

/* ═══════════════ controls ═══════════════ */
function renderActions(){
  const st=booth.dataset.state,ic=n=>TetherUI.icon(n),couple=S.mode==='couple';
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[new File([''],'x.jpg',{type:'image/jpeg'})]}));
  const many=st==='result'&&(canShare||!!(S.raws&&S.raws.length));   // 4-5 buttons: on a narrow phone Retake and Save shrink to icons so nothing is squeezed
  acts.classList.toggle('two',st==='idle');acts.classList.toggle('many',many);
  acts.innerHTML=
    st==='idle'?`<button class="btn" data-act="camera">${ic('camera')} Start camera</button><button class="btn ghost" data-act="pick">${ic('image')} My photos</button><button class="btn go wide" data-act="couple">${ic('users')} Couple photo (2 phones)</button>`:
    st==='camera'?(couple?`<button class="btn sm" data-act="flip" aria-label="Switch camera">${ic('swap')}</button><button class="btn go" data-act="ready"${C.ready?' disabled':''}>${ic(C.ready?'check':'heart')} ${C.ready?'Ready':"I'm ready"}</button><button class="btn sm ghost" data-act="stop" aria-label="Leave">${ic('close')}</button>`:
      `<button class="btn sm" data-act="flip" aria-label="Switch camera">${ic('swap')}</button><button class="btn go" data-act="shoot">${ic('camera')} Take ${SHOTS} photos</button><button class="btn sm ghost" data-act="stop" aria-label="Close camera">${ic('close')}</button>`):
    st==='shooting'?`<button class="btn ghost" data-act="cancel">${ic('close')} Cancel</button>`:
    `<button class="btn ghost" data-act="again" aria-label="Retake" title="Retake">${ic('reset')}<span class="lbl"> Retake</span></button><button class="btn" data-act="save" aria-label="Save" title="Save">${ic('download')}<span class="lbl"> Save</span></button>${canShare?`<button class="btn sm ghost" data-act="share" aria-label="Share">${ic('share')}</button>`:''}${S.raws&&S.raws.length?`<button class="btn sm ghost" data-act="orig" aria-label="Save the original, untouched photos">${ic('image')}</button>`:''}<button class="btn go" data-act="send" aria-label="Send to chat"${S.sent?' disabled':''}>${ic(S.sent?'check':'send')} ${S.sent?'Sent':'Send'}</button>`;
}
acts.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  TetherUI.unlock();
  ({camera:()=>{S.mode='solo';renderLayouts();startCamera()},pick:()=>{S.mode='solo';renderLayouts();$('#picker').click()},couple:coupleStart,ready:coupleReady,
    flip:()=>{S.facing=S.facing==='user'?'environment':'user';startCamera()},
    shoot,cancel:()=>{S.cancel=true},stop:()=>{coupleLeave(true);stopCamera();S.mode='solo';renderLayouts();setState('idle')},
    again:()=>{S.frames=[];S.raws=[];coupleLeave(false);S.mode='solo';renderLayouts();setState('idle')},save,share,orig:saveOriginals,send:()=>send(b)})[b.dataset.act]();
});
$('#picker').addEventListener('change',e=>{fromFiles(e.target.files);e.target.value=''});

const LAYOUTS={solo:[['film','Film strip'],['polaroid','Polaroids'],['booth','Booth'],['plain','Plain']],couple:[['blend','Blend'],['split','Split'],['film','Strip'],['polaroid','Polaroids'],['plain','Plain']]};
const curTpl=()=>S.mode==='couple'?prefs.ctpl:prefs.tpl;
function renderLayouts(){$('#segTpl').innerHTML=LAYOUTS[S.mode].map(([k,l])=>`<button type="button" data-tpl="${k}" aria-pressed="false">${l}</button>`).join('');syncSegs()}
function syncSegs(){
  document.querySelectorAll('#segTpl button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tpl===curTpl())));
  document.querySelectorAll('#segLook .tile').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.look===prefs.look)));
  document.querySelectorAll('#segLens .tile').forEach(b=>{
    const on=b.dataset.fx!==undefined?prefs.fx===b.dataset.fx:b.dataset.lens==='none'?prefs.lens==='none'&&prefs.fx==='none':prefs.lens===b.dataset.lens;
    b.setAttribute('aria-pressed',String(on));
  });
  $('#segLens').classList.toggle('off',isRaw());
}
function savePrefs(){try{localStorage.setItem('booth:prefs',JSON.stringify(prefs))}catch(e){}}
$('#segTpl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(S.mode==='couple')prefs.ctpl=b.dataset.tpl;else prefs.tpl=b.dataset.tpl;savePrefs();syncSegs();TetherUI.sfx.play('tap');if(booth.dataset.state==='result')compose()});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b||b.getAttribute('aria-disabled')==='true')return;setTab(b.dataset.tab);TetherUI.sfx.play('tap')});
function setLook(k){
  prefs.look=k;if(k!=='none')prefs.lastLook=k;savePrefs();syncSegs();applyLive();syncFx();
  if(k==='none')toast('No filter: your photos stay untouched');
  if(booth.dataset.state==='result')compose();
}
$('#segLook').addEventListener('click',e=>{const b=e.target.closest('button[data-look]');if(!b)return;setLook(b.dataset.look);popTile(b);TetherUI.sfx.play('tap')});
$('#segLens').addEventListener('click',e=>{
  const b=e.target.closest('button[data-lens],button[data-fx]');if(!b)return;
  const wasRaw=isRaw();
  if(b.dataset.lens!==undefined){prefs.lens=b.dataset.lens;if(b.dataset.lens==='none')prefs.fx='none'}   // "None" clears the lens and the overlay
  else prefs.fx=prefs.fx===b.dataset.fx?'none':b.dataset.fx;                                              // overlays toggle, and combine with a lens
  if(wasRaw&&(prefs.lens!=='none'||prefs.fx!=='none')){prefs.look=prefs.lastLook||'kodak';applyLive();toast('Filter is back on so the lens can show')}
  savePrefs();syncSegs();syncFx();popTile(b);TetherUI.sfx.play('tap');
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&booth.dataset.state==='camera'){coupleLeave(true);stopCamera();S.mode='solo';renderLayouts();setState('idle')}});   // never keep the camera on in the background
addEventListener('pagehide',stopCamera);

/* ═══════════════ couple mode: two phones, one portrait ═══════════════
   Both of you open "Couple photo". The phones meet in a private realtime room (a Supabase broadcast
   channel: no table, no SQL, no storage), both tap "I'm ready", and the countdown starts on both at
   once. Each of you takes 2 photos on your own phone; the photos travel through the room and both
   phones build the same portrait. The finished picture can then be saved or sent to the chat. */
const C={sb:null,ch:null,gen:0,me:null,other:null,ready:false,partnerReady:false,started:false,mine:[],theirs:[],dots:null};
const ROUNDS=2,SEND_PX=720,cstat=$('#cstat');
const say=t=>{cstat.textContent=t;cstat.hidden=!t};
const shrink=(c,px)=>{const o=document.createElement('canvas');o.width=o.height=px;o.getContext('2d').drawImage(c,0,0,px,px);return o};
const fromUrl=url=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const o=document.createElement('canvas');o.width=o.height=SEND_PX;cover(o.getContext('2d'),im,SEND_PX);res(o)};im.onerror=rej;im.src=url});
const partnerName=()=>C.other||(C.me==='Satyam'?'Snks':'Satyam');

async function coupleStart(){
  const me=localStorage.getItem('us_user');
  if(!me){toast('Open the chat once first so I know who you are');return}
  Object.assign(C,{me,other:null,ready:false,partnerReady:false,started:false,mine:[],theirs:[],rawMine:[],dots:null});
  S.mode='couple';S.sent=false;renderLayouts();
  await startCamera();                                   // camera first, so you can see yourself while you wait
  if(booth.dataset.state!=='camera'){S.mode='solo';renderLayouts();return}
  say('Connecting...');
  try{
    C.sb=C.sb||supabase.createClient(SU,SK);
    const gen=++C.gen;
    const ch=C.sb.channel('tether-booth-room',{config:{broadcast:{self:false},presence:{key:me}}});
    ch.on('broadcast',{event:'go'},()=>{if(C.gen===gen&&!C.started){C.started=true;coupleSequence()}});
    ch.on('broadcast',{event:'shot'},p=>{if(C.gen===gen)onShot(p.payload)});
    ch.on('broadcast',{event:'bye'},()=>{if(C.gen===gen&&!C.started)onPresence()});
    ch.on('presence',{event:'sync'},()=>{if(C.gen===gen)onPresence()});
    C.ch=ch;
    await new Promise((res,rej)=>{
      const t=setTimeout(()=>rej(new Error('timed out')),10000);
      ch.subscribe(async st=>{
        if(C.gen!==gen) return;                          // a channel we already replaced or left
        if(st==='SUBSCRIBED'){clearTimeout(t);await ch.track({user:me,ready:false});res()}
        else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(t);rej(new Error('connection failed'))}
      });
    });
    onPresence();
  }catch(e){console.error(e);toast('Could not connect: '+e.message);coupleLeave(false);stopCamera();S.mode='solo';renderLayouts();setState('idle')}
}
function onPresence(){
  if(!C.ch||C.started||booth.dataset.state!=='camera') return;
  const st=C.ch.presenceState(),others=Object.keys(st).filter(k=>k!==C.me);
  C.other=others[0]||null;
  C.partnerReady=!!(C.other&&st[C.other]&&st[C.other][0]&&st[C.other][0].ready);
  say(!C.other?`Waiting for ${partnerName()} to open Couple photo...`:C.ready?(C.partnerReady?'Starting...':`Waiting for ${C.other} to get ready...`):C.partnerReady?`${C.other} is ready!`:`${C.other} is here. Get ready!`);
  renderActions();
  if(C.ready&&C.partnerReady&&C.other&&[C.me,C.other].sort()[0]===C.me) hostGo();   // the first name alphabetically starts it, so exactly one phone does
}
async function coupleReady(){
  if(!C.ch||C.ready) return;
  C.ready=true;TetherUI.sfx.play('tap');
  await C.ch.track({user:C.me,ready:true});onPresence();
}
async function hostGo(){
  if(C.started) return;
  C.started=true;
  C.ch.send({type:'broadcast',event:'go',payload:{}});
  await sleep(180);                                      // about the time the message takes to reach the other phone
  coupleSequence();
}
async function coupleSequence(){
  S.cancel=false;setState('shooting');say('');
  const dots=C.dots=[...document.querySelectorAll('#shots span')];
  dots.forEach(d=>{d.style.backgroundImage='';d.classList.remove('on')});
  const count=$('#count'),flash=$('#flash');
  for(let r=0;r<ROUNDS&&!S.cancel;r++){
    dots[r*2].classList.add('on');
    for(let n=3;n>=1&&!S.cancel;n--){
      count.textContent=n;count.dataset.hint=n===1?'Smile!':'';count.classList.remove('tick');void count.offsetWidth;count.classList.add('tick');
      TetherUI.sfx.play('count');TetherUI.haptic(10);
      await sleep(TICK);
    }
    if(S.cancel) break;
    count.textContent='';count.dataset.hint='';shutter();
    const f=shrink(grab(),SEND_PX);C.mine[r]=f;C.rawMine[r]=grabRaw();
    dots[r*2].classList.remove('on');flyTo(dots[r*2],f.toDataURL('image/jpeg',.4));
    C.ch.send({type:'broadcast',event:'shot',payload:{round:r,data:f.toDataURL('image/jpeg',.68)}});
    await sleep(TICK*.7);
  }
  if(S.cancel){coupleLeave(true);stopCamera();S.mode='solo';renderLayouts();setState('idle');return}
  stopCamera();say('Developing...');
  const t0=Date.now();
  while(C.theirs.filter(Boolean).length<ROUNDS&&Date.now()-t0<15000&&!S.cancel) await sleep(120);
  say('');
  if(C.theirs.filter(Boolean).length<ROUNDS){toast(`${partnerName()}'s photos did not arrive. Try again.`);coupleLeave(true);S.mode='solo';renderLayouts();setState('idle');return}
  S.names=[C.me,C.other].sort();
  S.frames=[];                                           // strip order: round 1 (both of you), round 2 (both of you); the same on both phones
  for(let r=0;r<ROUNDS;r++) for(const nm of S.names) S.frames.push(nm===C.me?C.mine[r]:C.theirs[r]);
  S.raws=C.rawMine.filter(Boolean);                       // your own two untouched photos
  coupleLeave(false);
  setState('result');await compose();develop();TetherUI.sfx.play('claim');
}
async function onShot(p){
  try{
    C.theirs[p.round]=await fromUrl(p.data);
    if(C.dots&&C.dots[p.round*2+1]) C.dots[p.round*2+1].style.backgroundImage=`url(${C.theirs[p.round].toDataURL('image/jpeg',.4)})`;
  }catch(e){console.error('could not read the other phone\'s photo',e)}
}
function coupleLeave(tell){
  C.gen++;C.started=false;C.ready=false;C.partnerReady=false;say('');
  if(C.ch){const ch=C.ch;C.ch=null;try{if(tell)ch.send({type:'broadcast',event:'bye',payload:{}})}catch(e){}try{C.sb.removeChannel(ch)}catch(e){}}
}

renderLayouts();buildTray();syncSegs();setTab(prefs.tab,true);applyLive();setState('idle');
TetherUI.onExit(()=>{try{coupleLeave(true)}catch(e){}stopCamera();});   // Exit: tell the partner we left, free the room connection and switch the camera off
TetherUI.mount({extras:[
  `<details class="how"><summary>How it works</summary><ol><li>Pick a layout, a film look (or No filter for untouched photos) and a lens.</li><li>Start the camera. It counts down and takes ${SHOTS} photos, or choose photos you already have.</li><li>Change the layout or look any time on the result, then save it or send it to the chat.</li><li>Couple photo: you both open it on your own phones, tap I'm ready, and each take 2 photos. The app merges them into one portrait.</li></ol></details>`
]});
if(new URLSearchParams(location.search).has('fast'))window.__booth={S,prefs,compose,LV,LOOKS,grab,grabRaw,tone,setLook,setTab};   // for automated tests only
})();
</script>
