<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>WildGuess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0d0b12; --bg1:#161320; --bg2:#1f1a2c;
  --surface:rgba(255,255,255,0.045); --surface2:rgba(255,255,255,0.07); --surface3:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.09); --border-hi:rgba(233,48,214,0.4);
  --text:#f3ede4; --text2:#a79cb8; --text3:#6f6480;
  --accent:#e930d6; --accent-soft:#f78ded; --accent-dim:#9c1690; --silver:#9d97ac; --silver-soft:#c7c2d3; --good:#7ed6a5; --bad:#e2707a;
  --grad:linear-gradient(135deg,var(--accent) 0%,var(--accent-soft) 100%);
  --grad-soft:linear-gradient(135deg,rgba(233,48,214,0.14),rgba(157,151,172,0.14));
  --shadow-lg:0 32px 70px -18px rgba(0,0,0,0.55),0 10px 26px -10px rgba(0,0,0,0.5);
  --shadow-sm:0 10px 22px -10px rgba(0,0,0,0.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation}
body{
  background:
    radial-gradient(circle at 15% 5%,rgba(233,48,214,0.1),transparent 45%),
    radial-gradient(circle at 90% 15%,rgba(157,151,172,0.09),transparent 45%),
    radial-gradient(circle at 30% 95%,rgba(233,48,214,0.06),transparent 45%),
    linear-gradient(165deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--text);font-family:'Manrope',sans-serif;font-weight:500;
  min-height:100vh;min-height:-webkit-fill-available;
  display:flex;flex-direction:column;align-items:center;
  padding:20px;overflow-x:hidden;position:relative;
}
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(75px);opacity:0.32;z-index:0;pointer-events:none;
}
body::before{width:260px;height:260px;background:var(--accent);top:-80px;left:-80px}
body::after{width:290px;height:290px;background:var(--silver);bottom:-95px;right:-80px;opacity:0.1}

h1,h2,.disp{font-family:'Fraunces',serif}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;margin:auto 0;padding:10px 0 20px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.backlink{
  font-size:12.5px;font-weight:600;color:var(--text2);text-decoration:none;
  display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);
  padding:7px 14px 7px 10px;border-radius:100px;
  box-shadow:var(--shadow-sm);transition:transform 0.15s cubic-bezier(.34,1.56,.64,1),border-color .2s;
}
.backlink svg{width:13px;height:13px;stroke:var(--text2)}
.backlink:active{transform:scale(0.94);border-color:var(--border-hi)}
.brand{display:flex;align-items:center;gap:8px;justify-content:center}
.brand .ic{width:22px;height:22px;color:var(--accent);filter:drop-shadow(0 2px 8px rgba(233,48,214,0.4))}
.brand h1{font-size:19px;font-weight:600;letter-spacing:0.2px;color:var(--text)}

.screen{display:none;flex-direction:column;gap:12px}
.screen.on{display:flex}
.card{animation:cardIn 0.42s cubic-bezier(.16,1,.3,1) both}
.card:nth-child(1){animation-delay:0.02s}
.card:nth-child(2){animation-delay:0.08s}
.card:nth-child(3){animation-delay:0.14s}
.card:nth-child(4){animation-delay:0.2s}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(0.97)}to{opacity:1;transform:none}}

.card{
  position:relative;
  background:var(--surface);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  border:1px solid var(--border);border-radius:20px;
  padding:18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--shadow-lg);
  isolation:isolate;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);
}
.card.tight{padding:14px;gap:10px;border-radius:18px}
label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.7px;font-weight:700}
input[type=text]{
  width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:16px;font-family:'Manrope',sans-serif;font-weight:600;
  outline:none;transition:border-color 0.18s,transform 0.15s,box-shadow 0.18s;
}
input[type=text]::placeholder{color:var(--text3);font-weight:500}
input[type=text]:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(233,48,214,0.12)}
input[type=text]:active{transform:scale(0.99)}
input[type=text]:disabled{opacity:0.5}

.btn{
  position:relative;overflow:hidden;
  border:none;border-radius:14px;padding:15px 18px;font-size:14.5px;font-weight:700;letter-spacing:0.2px;
  font-family:'Manrope',sans-serif;cursor:pointer;color:#1b1420;background:var(--grad);background-size:200% auto;
  transition:transform 0.18s cubic-bezier(.34,1.56,.64,1),opacity 0.15s,box-shadow 0.15s,background-position 0.4s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 12px 26px -8px rgba(233,48,214,0.4);
}
.btn svg{width:15px;height:15px;stroke:#1b1420}
.btn::after{
  content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.55),transparent);
  transform:skewX(-20deg);
}
.btn:active{transform:scale(0.95);background-position:100% 50%}
.btn:active::after{animation:shine .55s ease}
@keyframes shine{from{left:-60%}to{left:130%}}
.btn:disabled{opacity:0.4;pointer-events:none;box-shadow:none}
.btn.sm{padding:0;width:46px;height:46px;border-radius:50%;flex-shrink:0;box-shadow:0 10px 22px -6px rgba(233,48,214,0.4)}
.btn.sm svg{width:16px;height:16px}

.status-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text2)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--text)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(126,214,165,0.2);animation:dotBreathe 2s ease-in-out infinite}
.pill.warn .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(233,48,214,0.22)}
@keyframes dotBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.hidden-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--accent-soft);background:rgba(233,48,214,0.1);border:1px solid rgba(233,48,214,0.25);padding:5px 12px;border-radius:100px;animation:pulseGlow 2.4s ease-in-out infinite}
.hidden-badge svg{width:11px;height:11px}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(233,48,214,0.16)}50%{box-shadow:0 0 0 6px rgba(233,48,214,0)}}

.whoami{
  align-self:center;display:inline-flex;align-items:center;gap:7px;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:12.5px;
  padding:7px 16px 7px 7px;border-radius:100px;box-shadow:var(--shadow-sm);
}
.whoami .avatar{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#1b1420;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Fraunces',serif}
.whoami-inline{font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.whoami-inline .avatar-sm{
  width:24px;height:24px;border-radius:50%;background:var(--grad);color:#1b1420;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Fraunces',serif;
  box-shadow:0 4px 10px -2px rgba(233,48,214,0.4);
}
.whoami-inline b{color:var(--text)}

.hint{font-size:12px;color:var(--text2);text-align:center;line-height:1.5;padding:0 6px}
.animal-tag{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;
  padding:7px 14px;font-size:12.5px;color:var(--text);font-weight:600;align-self:center;box-shadow:var(--shadow-sm);
}

/* ── live guess counter scoreboard ── */
.gc-title{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.7px;font-weight:700;text-align:center}
.gc-row{display:flex;align-items:center;justify-content:center;gap:18px}
.gc-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.gc-badge{
  width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--border);box-shadow:var(--shadow-sm);position:relative;
}
.gc-badge.satyam{background:linear-gradient(160deg,rgba(233,48,214,0.14),rgba(233,48,214,0.03))}
.gc-badge.snks{background:linear-gradient(160deg,rgba(157,151,172,0.16),rgba(157,151,172,0.03))}
.gc-num{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--text);line-height:1}
.gc-num.bump{animation:gcBump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes gcBump{0%{transform:scale(1)}40%{transform:scale(1.4);color:var(--accent)}100%{transform:scale(1)}}
.gc-name{font-size:10.5px;font-weight:600;color:var(--text2)}
.gc-vs{font-family:'Fraunces',serif;font-size:12px;font-weight:600;color:var(--text3);font-style:italic}

/* ═══════════ question / answer log — chat transcript style ═══════════ */
.q-ask-row{display:flex;gap:8px;align-items:center}
.q-ask-row input{flex:1}
#qHistory{
  display:flex;flex-direction:column;gap:8px;max-height:190px;overflow-y:auto;
  padding:4px 2px 2px;scroll-behavior:smooth;
}
.q-row{display:flex;animation:qSlideIn 0.32s cubic-bezier(.16,1,.3,1) both}
.q-row.mine{justify-content:flex-end}
.q-row.theirs{justify-content:flex-start}
@keyframes qSlideIn{from{opacity:0;transform:translateY(10px) scale(0.96)}to{opacity:1;transform:none}}
.q-bubble{
  max-width:82%;border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow-sm);border:1px solid var(--border);
}
.q-row.mine .q-bubble{background:linear-gradient(160deg,rgba(233,48,214,0.14),rgba(233,48,214,0.05));border-bottom-right-radius:5px}
.q-row.theirs .q-bubble{background:linear-gradient(160deg,rgba(157,151,172,0.14),rgba(157,151,172,0.05));border-bottom-left-radius:5px}
.q-asker{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;opacity:0.7}
.q-row.mine .q-asker{color:var(--accent-soft)}
.q-row.theirs .q-asker{color:var(--silver-soft)}
.q-text{font-size:13px;color:var(--text);line-height:1.35;font-weight:600}

/* sliding yes/no segmented control */
.q-toggle{
  display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:3px;position:relative;
}
.q-toggle .q-slide{
  position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:100px;
  background:var(--surface3);transition:transform 0.22s cubic-bezier(.34,1.4,.64,1);
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.q-toggle button{
  position:relative;z-index:1;flex:1;border:none;background:transparent;padding:8px 6px;
  font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;cursor:pointer;color:var(--text2);
  transition:color 0.18s,transform 0.12s;
}
.q-toggle button:active{transform:scale(0.9)}
.q-answer{
  align-self:flex-start;font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;
  padding:5px 13px;border-radius:100px;display:inline-flex;align-items:center;gap:4px;
  animation:answerPop 0.3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes answerPop{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
.q-answer.yes{background:rgba(126,214,165,0.16);color:var(--good)}
.q-answer.no{background:rgba(226,112,122,0.16);color:var(--bad)}
.q-pending{font-size:11px;color:var(--text3);font-style:italic;display:flex;align-items:center;gap:5px}
.q-pending .wait-dot{width:4px;height:4px;border-radius:50%;background:var(--text3);animation:dotBreathe 1.2s ease-in-out infinite}
.q-empty{font-size:12.5px;color:var(--text3);text-align:center;padding:18px 8px}

.reveal-pair{display:flex;align-items:stretch}
.reveal-card{flex:1;padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:center;border-radius:14px}
.reveal-card.winner{background:var(--grad-soft)}
.reveal-card.winner .reveal-animal{color:var(--accent-soft)}
.reveal-divider{width:1px;background:linear-gradient(180deg,transparent,var(--border),transparent);margin:4px 0}
.reveal-animal{font-size:19px;font-weight:600;font-family:'Fraunces',serif;color:var(--text)}
.reveal-name{font-size:11.5px;color:var(--text2);font-weight:600}

.trophy{width:58px;height:58px;margin:0 auto;color:var(--accent);filter:drop-shadow(0 4px 16px rgba(233,48,214,0.4));animation:trophyPop 0.65s cubic-bezier(.2,1.6,.4,1)}
@keyframes trophyPop{0%{transform:scale(0) rotate(-16deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.final-name{font-family:'Fraunces',serif;font-size:23px;font-weight:600;text-align:center;color:var(--text);font-style:italic}

/* confetti burst on the win screen */
.confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.confetti-piece{
  position:absolute;top:-10px;border-radius:2px;opacity:0.9;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  to{transform:translateY(110vh) rotate(540deg);opacity:0}
}

.err{color:var(--bad);font-size:12.5px;text-align:center;min-height:16px;font-weight:600}
.dots{display:flex;gap:5px;justify-content:center}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotpulse 1.2s ease infinite}
.dots span:nth-child(2){animation-delay:0.15s}
.dots span:nth-child(3){animation-delay:0.3s}
@keyframes dotpulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.15)}}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(24px) scale(0.92);
  background:#1b1626;border:1px solid var(--border-hi);padding:12px 22px;border-radius:100px;
  font-size:13px;font-weight:600;color:var(--text);opacity:0;
  transition:opacity 0.25s cubic-bezier(.34,1.4,.64,1),transform 0.25s cubic-bezier(.34,1.4,.64,1);
  pointer-events:none;z-index:50;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Tether
    </a>
    <div class="brand">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-1 .5-1.5 1.2-1.5 2.2M12 17h.01"/></svg>
      <h1>WildGuess</h1>
    </div>
    <div style="width:64px"></div>
  </div>

  <!-- LOADING / ERROR -->
  <div class="screen on" id="s-loading">
    <div class="card" style="text-align:center">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="hint" id="loadingMsg">Getting things ready...</div>
    </div>
  </div>

  <!-- CHOOSING -->
  <div class="screen" id="s-choosing">
    <div class="whoami" id="whoamiChip"><span class="avatar" id="whoamiAvatar">?</span> You're playing as ...</div>
    <div class="card">
      <div class="hidden-badge" style="align-self:center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Hidden from them
      </div>
      <label>Pick your secret animal or bird</label>
      <input type="text" id="animalInput" placeholder="e.g. Peacock" maxlength="30"/>
      <button class="btn" id="lockBtn" onclick="lockAnimal()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Lock it in
      </button>
      <div class="hint" id="choosingHint"></div>
    </div>
  </div>

  <!-- PLAYING -->
  <div class="screen" id="s-playing">
    <div class="card tight">
      <div class="status-row">
        <span class="whoami-inline"><span class="avatar-sm" id="whoamiAvatar2">?</span> Playing as <b id="whoamiName2"></b></span>
        <span id="connStatus" class="pill"><span class="dot"></span> Connected</span>
      </div>
      <div class="status-row" style="margin-top:-4px">
        <span class="animal-tag">Yours: <span id="myAnimalTag">—</span></span>
      </div>
      <div class="gc-title">Guesses so far</div>
      <div class="gc-row">
        <div class="gc-col">
          <div class="gc-badge satyam"><span class="gc-num" id="gcSatyam">0</span></div>
          <div class="gc-name">Satyam</div>
        </div>
        <div class="gc-vs">vs</div>
        <div class="gc-col">
          <div class="gc-badge snks"><span class="gc-num" id="gcSnks">0</span></div>
          <div class="gc-name">Snks</div>
        </div>
      </div>
    </div>

    <div class="card tight">
      <div class="q-ask-row">
        <input type="text" id="qInput" placeholder="Ask a yes/no question..." maxlength="100" onkeydown="if(event.key==='Enter')askQuestion()"/>
        <button class="btn sm" onclick="askQuestion()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      </div>
      <div id="qHistory"></div>
    </div>

    <div class="card tight">
      <div class="q-ask-row">
        <input type="text" id="guessInput" placeholder="Guess the animal..." maxlength="30" onkeydown="if(event.key==='Enter')submitGuess()"/>
        <button class="btn sm" onclick="submitGuess()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      </div>
      <div class="err" id="guessErr"></div>
    </div>
  </div>

  <!-- OVER -->
  <div class="screen" id="s-over">
    <div class="card" style="text-align:center">
      <svg class="trophy" id="overTrophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/></svg>
      <div class="final-name" id="finalWinnerName"></div>
      <div class="card" style="background:var(--surface2);box-shadow:none;padding:12px 4px">
        <div class="reveal-pair">
          <div class="reveal-card" id="revealMe">
            <div class="reveal-animal" id="revealMeAnimal">—</div>
            <div class="reveal-name">You</div>
          </div>
          <div class="reveal-divider"></div>
          <div class="reveal-card" id="revealThem">
            <div class="reveal-animal" id="revealThemAnimal">—</div>
            <div class="reveal-name" id="revealThemName">Them</div>
          </div>
        </div>
      </div>
      <div class="hint" id="finalGuessStats"></div>
      <button class="btn" onclick="startNewMatch()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        Play Again
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SU='https://ggfxdeuwifmqulyhchtv.supabase.co';
const SK='sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI';
let sb, MY_UID=null, MY_NAME=null, OPP_NAME=null;
let match=null, mySecret=null, oppSecret=null;
let guessCounts={Satyam:0,Snks:0};
let questions=[];
let matchCh=null, secretsCh=null, countsCh=null, questionsCh=null;
let _lastRoutedStatus=null; // used to only reset inputs on a GENUINE screen transition, never mid-typing

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('on'),2400);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function showLoadingError(msg){
  document.getElementById('loadingMsg').innerHTML=msg;
  document.querySelector('#s-loading .dots').style.display='none';
  showScreen('s-loading');
}
function escHtmlWG(s){
  const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;
}
// Every server call gets a hard timeout so a dropped connection can never
// leave a button/input stuck disabled forever — this is what fixes the
// "frozen, had to reopen the app" symptom.
function withTimeout(promise,ms=12000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out — check your connection')),ms))
  ]);
}
function vibrate(pattern){
  if(navigator.vibrate){ try{navigator.vibrate(pattern);}catch(e){} }
}

// ── BOOT ──
async function boot(){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){MY_UID=session.user.id;}
    else{
      const{data,error}=await sb.auth.signInAnonymously();
      if(error) throw error;
      MY_UID=data.user.id;
    }

    const{data:sessRows,error:sessErr}=await sb.from('sessions').select('user_name').eq('auth_uid',MY_UID).limit(1);
    if(sessErr) throw sessErr;
    const sess=sessRows&&sessRows[0];
    if(!sess){
      showLoadingError("Open and log into Tether chat on this device first,<br/>then come back here.");
      return;
    }
    MY_NAME=sess.user_name;
    OPP_NAME=MY_NAME==='Satyam'?'Snks':'Satyam';
    document.getElementById('whoamiAvatar').textContent=MY_NAME[0];
    document.getElementById('whoamiAvatar2').textContent=MY_NAME[0];
    document.getElementById('whoamiChip').lastChild.textContent=` You're playing as ${MY_NAME}`;
    document.getElementById('whoamiName2').textContent=MY_NAME;
    document.getElementById('revealThemName').textContent=OPP_NAME;

    // Throwing variant for the first load only, so a real failure surfaces
    // an actual error instead of leaving "Getting things ready" up forever.
    await resyncOrThrow();
    subscribeAll();

    // Reliability net: even if realtime silently drops (very common on mobile
    // when the app backgrounds), this guarantees we're never out of sync with
    // the server for more than a few seconds. Skipped entirely while the tab
    // is hidden — nobody's looking at a backgrounded game, so there's no
    // reason to keep spending API calls on it; the visibilitychange listener
    // below already forces an instant resync the moment it's opened again.
    setInterval(()=>{ if(!document.hidden) resync(); },15000);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){ resync(); subscribeAll(); }
    });
    window.addEventListener('online',()=>{ resync(); subscribeAll(); });
    window.addEventListener('pageshow',()=>{ resync(); subscribeAll(); });
  }catch(e){
    console.error(e);
    showLoadingError('Something went wrong: '+(e.message||'unknown error'));
  }
}

(function init(){
  sb=supabase.createClient(SU,SK);
  boot();
})();

// ── REALTIME (best-effort, instant when it works; resync() above covers the gaps) ──
function subscribeAll(){
  if(matchCh){try{sb.removeChannel(matchCh);}catch(e){}}
  if(secretsCh){try{sb.removeChannel(secretsCh);}catch(e){}}
  if(countsCh){try{sb.removeChannel(countsCh);}catch(e){}}
  if(questionsCh){try{sb.removeChannel(questionsCh);}catch(e){}}

  matchCh=sb.channel('wg-match-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'wg_match',filter:'id=eq.1'},()=>resync())
    .subscribe(status=>{
      const el=document.getElementById('connStatus');
      if(!el)return;
      if(status==='SUBSCRIBED') el.innerHTML=`<span class="dot"></span> Connected`;
      else{ el.className='pill warn'; el.innerHTML=`<span class="dot"></span> Reconnecting...`; }
    });

  secretsCh=sb.channel('wg-secrets-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'wg_secrets'},()=>resync())
    .subscribe();

  countsCh=sb.channel('wg-counts-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'wg_guess_counts'},p=>{
      const row=p.new;
      if(!row)return;
      guessCounts[row.player_name]=row.count;
      renderGuessCounts(row.player_name);
    })
    .subscribe();

  questionsCh=sb.channel('wg-questions-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'wg_questions'},()=>loadQuestions())
    .subscribe();
}

// ── Central resync: the single source of truth pulled fresh from the server.
//    Called on boot, on every realtime match ping, every 4s regardless, and
//    whenever the app comes back to the foreground. ──
async function resyncOrThrow(){
  const{data:m,error:mErr}=await sb.from('wg_match').select('*').eq('id',1).maybeSingle();
  if(mErr) throw mErr;
  if(!m)return;
  match=m;
  await loadMySecret();
  if(match.status==='over') await loadOppSecretIfRevealed();
  else oppSecret=null;
  await loadGuessCounts();
  if(match.status==='playing') await loadQuestions();
  routeScreen();
}

async function resync(){
  try{
    await resyncOrThrow();
  }catch(e){
    console.warn('resync failed (will retry):',e);
  }
}

async function loadMySecret(){
  const{data}=await sb.from('wg_secrets').select('*').eq('player_name',MY_NAME).maybeSingle();
  mySecret=data;
}
async function loadOppSecretIfRevealed(){
  const{data}=await sb.from('wg_secrets').select('*').eq('player_name',OPP_NAME).maybeSingle();
  if(data&&data.revealed) oppSecret=data;
}
async function loadGuessCounts(){
  const{data}=await sb.from('wg_guess_counts').select('*');
  if(data) data.forEach(r=>guessCounts[r.player_name]=r.count);
  renderGuessCounts();
}
function renderGuessCounts(bumpedName){
  const sEl=document.getElementById('gcSatyam');
  const nEl=document.getElementById('gcSnks');
  if(sEl) sEl.textContent=guessCounts.Satyam||0;
  if(nEl) nEl.textContent=guessCounts.Snks||0;
  if(bumpedName){
    const el=bumpedName==='Satyam'?sEl:nEl;
    if(el){
      el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
      setTimeout(()=>el.classList.remove('bump'),500);
    }
  }
}

// ── QUESTIONS ──
async function loadQuestions(){
  const{data,error}=await sb.from('wg_questions').select('*').order('created_at',{ascending:true});
  if(!error) questions=data||[];
  renderQuestions();
}
function renderQuestions(){
  const el=document.getElementById('qHistory');
  if(!el)return;
  if(!questions.length){
    el.replaceChildren();
    el.innerHTML='<div class="q-empty">No questions asked yet — start guessing</div>';
    return;
  }
  const emptyEl=el.querySelector('.q-empty');
  if(emptyEl) emptyEl.remove();

  const existingRows=new Map();
  el.querySelectorAll('.q-row').forEach(r=>existingRows.set(r.dataset.qid,r));

  let appendedNew=false;
  questions.forEach(q=>{
    const stateKey=q.answer||'pending';
    const existing=existingRows.get(String(q.id));
    if(existing){
      existingRows.delete(String(q.id));
      if(existing.dataset.state===stateKey) return; // unchanged — leave its DOM completely alone, no re-animation
      existing.replaceWith(buildQuestionRow(q,stateKey)); // only this row's state actually changed
      return;
    }
    el.appendChild(buildQuestionRow(q,stateKey)); // brand new question
    appendedNew=true;
  });

  // Anything left in existingRows belonged to a question that no longer exists (e.g. new match reset)
  existingRows.forEach(r=>r.remove());

  if(appendedNew) el.scrollTop=el.scrollHeight;
}

function buildQuestionRow(q,stateKey){
  const isMine=q.asked_by===MY_NAME;
  const row=document.createElement('div');
  row.className='q-row '+(isMine?'mine':'theirs');
  row.dataset.qid=String(q.id);
  row.dataset.state=stateKey;

  const bubble=document.createElement('div');
  bubble.className='q-bubble';

  const askerDiv=document.createElement('div');
  askerDiv.className='q-asker';
  askerDiv.textContent=isMine?'You asked':`${q.asked_by} asked`;
  bubble.appendChild(askerDiv);

  const textDiv=document.createElement('div');
  textDiv.className='q-text';
  textDiv.textContent=q.question;
  bubble.appendChild(textDiv);

  if(q.answer){
    const badge=document.createElement('div');
    badge.className='q-answer '+q.answer;
    badge.textContent=q.answer==='yes'?'Yes':'No';
    bubble.appendChild(badge);
  }else if(!isMine){
    // Sliding yes/no segmented control — tap either side, the pill glides to match
    const toggle=document.createElement('div');
    toggle.className='q-toggle';
    const slide=document.createElement('div');
    slide.className='q-slide';
    slide.style.transform='translateX(0)';
    const yesBtn=document.createElement('button');
    yesBtn.textContent='Yes';
    yesBtn.onclick=()=>{slide.style.transform='translateX(0)';slide.style.background='rgba(46,213,115,0.28)';answerQuestion(q.id,'yes');};
    const noBtn=document.createElement('button');
    noBtn.textContent='No';
    noBtn.onclick=()=>{slide.style.transform='translateX(100%)';slide.style.background='rgba(255,95,95,0.28)';answerQuestion(q.id,'no');};
    toggle.append(slide,yesBtn,noBtn);
    bubble.appendChild(toggle);
  }else{
    const pending=document.createElement('div');
    pending.className='q-pending';
    pending.innerHTML='<span class="wait-dot"></span> Waiting for their answer...';
    bubble.appendChild(pending);
  }
  row.appendChild(bubble);
  return row;
}
async function askQuestion(){
  const input=document.getElementById('qInput');
  const val=input.value.trim();
  if(!val)return;
  input.value='';
  vibrate(12);
  try{
    const{error}=await withTimeout(sb.rpc('wg_ask_question',{p_question:val}));
    if(error) throw error;
    await loadQuestions();
  }catch(e){
    console.error('ask question failed:',e);
    toast('Could not send — try again');
    input.value=val; // give it back so nothing is lost
  }
}
async function answerQuestion(id,answer){
  const q=questions.find(x=>x.id===id);
  if(q){q.answer=answer;q.answered_at=new Date().toISOString();renderQuestions();} // optimistic
  try{
    const{error}=await withTimeout(sb.rpc('wg_answer_question',{p_id:id,p_answer:answer}));
    if(error) throw error;
  }catch(e){
    console.error('answer question failed:',e);
    toast('Could not send answer — try again');
    await loadQuestions(); // undo optimistic update by resyncing from server
  }
}

// ── SCREEN ROUTING ──
function routeScreen(){
  if(!match)return;
  const enteringChoosing = match.status==='choosing' && _lastRoutedStatus!=='choosing';

  if(match.status==='choosing'){
    const animalInput=document.getElementById('animalInput');
    if(mySecret&&mySecret.locked){
      document.getElementById('choosingHint').textContent="Locked in — waiting for them to lock in too...";
      document.getElementById('lockBtn').disabled=true;
      animalInput.disabled=true;
    }else{
      document.getElementById('choosingHint').textContent='';
      document.getElementById('lockBtn').disabled=false;
      animalInput.disabled=false;
      // CRITICAL: only clear the field on a genuine fresh entry into this screen,
      // never on a routine resync — this was the bug causing "can't type", where
      // periodic re-renders were wiping out whatever was mid-typed.
      if(enteringChoosing) animalInput.value='';
    }
    showScreen('s-choosing');
  }else if(match.status==='playing'){
    renderPlaying();
    renderGuessCounts();
    renderQuestions();
    showScreen('s-playing');
  }else if(match.status==='over'){
    renderOver();
    showScreen('s-over');
  }
  _lastRoutedStatus=match.status;
}

function renderPlaying(){
  if(!match||match.status!=='playing')return;
  document.getElementById('myAnimalTag').textContent=mySecret?.animal||'—';
}

const TROPHY_ICON='<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/>';
const LOSS_ICON='<circle cx="12" cy="12" r="9"/><path d="M9 15l6-6M9 9l6 6"/>';

function renderOver(){
  const iWon=match.winner_name===MY_NAME;
  document.getElementById('overTrophy').innerHTML=iWon?TROPHY_ICON:LOSS_ICON;
  document.getElementById('finalWinnerName').textContent=iWon?'You guessed it!':`${OPP_NAME} got it!`;
  document.getElementById('revealMeAnimal').textContent=mySecret?.animal||'—';
  document.getElementById('revealThemAnimal').textContent=oppSecret?.animal||'—';
  document.getElementById('finalGuessStats').textContent=
    `You: ${guessCounts[MY_NAME]||0} guesses  ·  ${OPP_NAME}: ${guessCounts[OPP_NAME]||0} guesses`;
  if(iWon&&!_confettiShownFor.has(match.updated_at)){
    _confettiShownFor.add(match.updated_at);
    burstConfetti();
    vibrate([25,60,25,60,60]);
  }
}
const _confettiShownFor=new Set();
function burstConfetti(){
  const wrap=document.createElement('div');
  wrap.className='confetti-wrap';
  document.body.appendChild(wrap);
  const colors=['#e930d6','#f78ded','#9d97ac','#c7c2d3','#9c1690'];
  const count=42;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=5+Math.random()*7;
    p.style.width=size+'px';
    p.style.height=size*0.4+'px';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(1.8+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*0.4)+'s';
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(),3600);
}

// ── ACTIONS ──
async function lockAnimal(){
  const val=document.getElementById('animalInput').value.trim();
  if(!val){toast('Type an animal or bird first');return;}
  const lockBtn=document.getElementById('lockBtn');
  lockBtn.disabled=true;
  try{
    const{error}=await withTimeout(sb.rpc('wg_lock_animal',{p_animal:val}));
    if(error) throw error;
    await loadMySecret();
    document.getElementById('animalInput').disabled=true;
    document.getElementById('choosingHint').textContent="Locked in — waiting for them to lock in too...";
  }catch(e){
    toast('Failed: '+(e.message||'try again'));
    lockBtn.disabled=false; // never leave it stuck disabled on failure
  }
}

async function submitGuess(){
  const input=document.getElementById('guessInput');
  const val=input.value.trim();
  if(!val)return;
  document.getElementById('guessErr').textContent='';
  vibrate(12);
  guessCounts[MY_NAME]=(guessCounts[MY_NAME]||0)+1; // optimistic bump
  renderGuessCounts(MY_NAME);
  try{
    const{data,error}=await withTimeout(sb.rpc('wg_submit_guess',{p_guess:val}));
    if(error) throw error;
    input.value='';
    if(data.won){
      toast('Correct! You got it!');
    }else if(data.correct){
      toast(`Correct, but ${OPP_NAME} guessed first!`);
    }else{
      document.getElementById('guessErr').textContent='Not quite — keep asking';
    }
  }catch(e){
    console.error('submitGuess error:',e);
    guessCounts[MY_NAME]=Math.max(0,(guessCounts[MY_NAME]||1)-1); // undo optimistic bump
    renderGuessCounts(MY_NAME);
    document.getElementById('guessErr').textContent='Error: '+(e.message||'unknown');
  }
}

async function startNewMatch(){
  const btn=document.querySelector('#s-over .btn');
  if(btn) btn.disabled=true;
  try{
    const{error}=await withTimeout(sb.rpc('wg_new_match'));
    if(error) throw error;
    mySecret=null;
    oppSecret=null;
    guessCounts={Satyam:0,Snks:0};
    questions=[];
    document.getElementById('guessInput').value='';
    document.getElementById('guessErr').textContent='';
    await resync(); // pulls the fresh reset state and routes to the choosing screen
  }catch(e){
    toast('Failed: '+(e.message||'try again'));
  }
  if(btn) btn.disabled=false;
}
</script>
</body>
