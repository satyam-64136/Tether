<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>WildGuess 🦊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3f1; --bg2:#e9dfff; --bg3:#dff3ff;
  --card:rgba(255,255,255,0.72); --card2:rgba(255,255,255,0.92);
  --text:#463655; --text2:#8577a0; --text3:#ab9fc4;
  --pink:#ff6fa8; --violet:#9b7fff; --good:#3fcf6e;
  --grad:linear-gradient(135deg,#ff9dc4,#b79cff);
  --border:rgba(255,255,255,0.9);
  --bad:#ff6b6b;
  --shadow:0 18px 45px rgba(155,127,255,0.22);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation}
body{
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed;
  color:var(--text);font-family:'Quicksand',sans-serif;font-weight:500;
  min-height:100vh;min-height:-webkit-fill-available;
  display:flex;flex-direction:column;align-items:center;
  padding:20px;overflow-x:hidden;position:relative;
}
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(50px);opacity:0.55;z-index:0;pointer-events:none;
}
body::before{width:220px;height:220px;background:var(--pink);top:-60px;left:-60px;animation:floatA 9s ease-in-out infinite}
body::after{width:260px;height:260px;background:var(--violet);bottom:-80px;right:-60px;animation:floatB 11s ease-in-out infinite}
@keyframes floatA{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,30px)}}
@keyframes floatB{0%,100%{transform:translate(0,0)}50%{transform:translate(-25px,-20px)}}

h1,h2,.disp{font-family:'Fredoka',sans-serif}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;margin:auto 0;padding:10px 0 20px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.backlink{
  font-size:12.5px;font-weight:700;color:var(--text2);text-decoration:none;
  display:flex;align-items:center;gap:4px;background:var(--card2);padding:7px 13px;border-radius:100px;
}
.brand{display:flex;align-items:center;gap:8px;justify-content:center}
.brand .ic{font-size:26px;filter:drop-shadow(0 4px 10px rgba(255,111,168,0.4))}
.brand h1{font-size:21px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.screen{display:none;flex-direction:column;gap:16px;animation:fadeUp 0.4s cubic-bezier(.2,1,.3,1)}
.screen.on{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(0.98)}to{opacity:1;transform:none}}

.card{
  background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1.5px solid var(--border);border-radius:22px;
  padding:18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--shadow);
}
.card.tight{padding:14px;gap:9px;border-radius:20px}
label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
input[type=text]{
  width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid rgba(155,127,255,0.25);
  background:var(--card2);color:var(--text);font-size:16px;font-family:'Quicksand',sans-serif;font-weight:600;
  outline:none;transition:border-color 0.15s,transform 0.15s;
}
input[type=text]::placeholder{color:var(--text3);font-weight:500}
input[type=text]:focus{border-color:var(--pink)}
input[type=text]:active{transform:scale(0.99)}
input[type=text]:disabled{opacity:0.55}

.btn{
  border:none;border-radius:16px;padding:15px 18px;font-size:15px;font-weight:700;
  font-family:'Fredoka',sans-serif;cursor:pointer;color:#fff;background:var(--grad);
  transition:transform 0.15s cubic-bezier(.34,1.56,.64,1),opacity 0.15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 8px 20px rgba(255,111,168,0.35);
}
.btn:active{transform:scale(0.94)}
.btn:disabled{opacity:0.45;pointer-events:none;box-shadow:none}
.btn.sm{padding:12px 16px;font-size:14px;flex-shrink:0}

.status-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text2)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border-radius:100px;padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--text)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}
.pill.warn .dot{background:#ffb84d}
.hidden-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--pink);background:rgba(255,111,168,0.12);padding:5px 10px;border-radius:100px}

.whoami{
  align-self:center;display:inline-flex;align-items:center;gap:6px;
  background:var(--grad);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;
  padding:6px 14px;border-radius:100px;box-shadow:0 6px 16px rgba(255,111,168,0.3);
}
.whoami-inline{font-size:12px;font-weight:700;color:var(--text2)}
.whoami-inline b{color:var(--pink)}

.hint{font-size:12px;color:var(--text2);text-align:center;line-height:1.5;padding:0 6px}
.animal-tag{
  display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:100px;
  padding:7px 14px;font-size:12.5px;color:var(--text);font-weight:700;align-self:center;
}

/* ── live guess counter scoreboard ── */
.gc-title{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;text-align:center}
.gc-row{display:flex;align-items:stretch}
.gc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 8px}
.gc-num{font-family:'Fredoka',sans-serif;font-size:26px;font-weight:700;color:var(--text);line-height:1;transition:transform 0.15s cubic-bezier(.34,1.56,.64,1)}
.gc-num.bump{transform:scale(1.25)}
.gc-name{font-size:11px;font-weight:700;color:var(--text2)}
.gc-divider{width:1.5px;background:rgba(155,127,255,0.25);margin:2px 0}

/* ── question / answer log ── */
.q-ask-row{display:flex;gap:8px}
.q-ask-row input{flex:1}
#qHistory{
  display:flex;flex-direction:column;gap:6px;max-height:150px;overflow-y:auto;
  padding:2px 2px 2px;
}
.q-item{
  background:var(--card2);border-radius:12px;padding:8px 10px;
  display:flex;flex-direction:column;gap:6px;
}
.q-text{font-size:12.5px;color:var(--text);line-height:1.35}
.q-text b{color:var(--pink)}
.q-toggle{display:flex;gap:8px}
.q-toggle button{
  flex:1;border:none;border-radius:10px;padding:9px;font-family:'Fredoka',sans-serif;font-weight:600;
  font-size:12.5px;cursor:pointer;transition:transform 0.12s;
}
.q-toggle button:active{transform:scale(0.92)}
.q-toggle .q-yes{background:rgba(63,207,110,0.18);color:#2a9e52}
.q-toggle .q-no{background:rgba(255,107,107,0.18);color:#d64545}
.q-answer{
  align-self:flex-start;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12.5px;
  padding:5px 12px;border-radius:100px;
}
.q-answer.yes{background:rgba(63,207,110,0.18);color:#2a9e52}
.q-answer.no{background:rgba(255,107,107,0.18);color:#d64545}
.q-pending{font-size:11.5px;color:var(--text3);font-style:italic}
.q-empty{font-size:12.5px;color:var(--text3);text-align:center;padding:14px 8px}

.reveal-pair{display:flex;align-items:stretch}
.reveal-card{flex:1;padding:16px 10px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:center}
.reveal-card.winner .reveal-animal{color:var(--pink)}
.reveal-divider{width:1.5px;background:rgba(155,127,255,0.25);margin:4px 0}
.reveal-animal{font-size:19px;font-weight:700;font-family:'Fredoka',sans-serif;color:var(--text)}
.reveal-name{font-size:11.5px;color:var(--text2);font-weight:700}

.trophy{font-size:56px;text-align:center;animation:trophyPop 0.6s cubic-bezier(.34,1.56,.64,1)}
@keyframes trophyPop{from{transform:scale(0)}to{transform:scale(1)}}
.final-name{font-family:'Fredoka',sans-serif;font-size:24px;font-weight:700;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.err{color:var(--bad);font-size:12.5px;text-align:center;min-height:16px;font-weight:600}
.dots{display:flex;gap:5px;justify-content:center}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:dotpulse 1.2s ease infinite}
.dots span:nth-child(2){animation-delay:0.15s}
.dots span:nth-child(3){animation-delay:0.3s}
@keyframes dotpulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.15)}}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card2);border:1.5px solid rgba(155,127,255,0.2);padding:12px 20px;border-radius:100px;
  font-size:13px;font-weight:600;opacity:0;transition:opacity 0.2s,transform 0.2s;pointer-events:none;z-index:50;
  box-shadow:var(--shadow);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html">← Tether</a>
    <div class="brand"><span class="ic">🦊</span><h1>WildGuess</h1></div>
    <div style="width:64px"></div>
  </div>

  <!-- LOADING / ERROR -->
  <div class="screen on" id="s-loading">
    <div class="card" style="text-align:center">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="hint" id="loadingMsg">Getting things ready...</div>
    </div>
  </div>

  <!-- CHOOSING -->
  <div class="screen" id="s-choosing">
    <div class="whoami" id="whoamiChip">🦊 You're playing as ...</div>
    <div class="card">
      <div class="hidden-badge" style="align-self:center">🔒 Secret from them</div>
      <label>Pick your secret animal or bird</label>
      <input type="text" id="animalInput" placeholder="e.g. Peacock 🦚" maxlength="30"/>
      <button class="btn" id="lockBtn" onclick="lockAnimal()">🔐 Lock it in</button>
      <div class="hint" id="choosingHint"></div>
    </div>
  </div>

  <!-- PLAYING -->
  <div class="screen" id="s-playing">
    <div class="card tight">
      <div class="status-row">
        <span class="whoami-inline">🦊 <b id="whoamiName2"></b></span>
        <span id="connStatus" class="pill"><span class="dot"></span> Connected</span>
      </div>
      <div class="status-row" style="margin-top:-4px">
        <span class="animal-tag">🐾 Yours: <span id="myAnimalTag">—</span></span>
      </div>
      <div class="gc-row">
        <div class="gc-col">
          <div class="gc-num" id="gcSatyam">0</div>
          <div class="gc-name">Satyam</div>
        </div>
        <div class="gc-divider"></div>
        <div class="gc-col">
          <div class="gc-num" id="gcSnks">0</div>
          <div class="gc-name">Snks</div>
        </div>
      </div>
      <div class="gc-title" style="margin-top:-6px">🎯 guesses so far</div>
    </div>

    <div class="card tight">
      <div class="q-ask-row">
        <input type="text" id="qInput" placeholder="Ask a yes/no question..." maxlength="100" onkeydown="if(event.key==='Enter')askQuestion()"/>
        <button class="btn sm" onclick="askQuestion()">Ask</button>
      </div>
      <div id="qHistory"></div>
    </div>

    <div class="card tight">
      <div class="q-ask-row">
        <input type="text" id="guessInput" placeholder="Guess the animal..." maxlength="30" onkeydown="if(event.key==='Enter')submitGuess()"/>
        <button class="btn sm" onclick="submitGuess()">🎯 Guess</button>
      </div>
      <div class="err" id="guessErr"></div>
    </div>
  </div>

  <!-- OVER -->
  <div class="screen" id="s-over">
    <div class="card" style="text-align:center">
      <div class="trophy" id="overTrophy">🏆</div>
      <div class="final-name" id="finalWinnerName"></div>
      <div class="card" style="background:var(--card2);box-shadow:none;padding:12px 4px">
        <div class="reveal-pair">
          <div class="reveal-card" id="revealMe">
            <div class="reveal-animal" id="revealMeAnimal">—</div>
            <div class="reveal-name">You</div>
          </div>
          <div class="reveal-divider"></div>
          <div class="reveal-card" id="revealThem">
            <div class="reveal-animal" id="revealThemAnimal">—</div>
            <div class="reveal-name" id="revealThemName">Them</div>
          </div>
        </div>
      </div>
      <div class="hint" id="finalGuessStats"></div>
      <button class="btn" onclick="startNewMatch()">🔄 Play Again</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SU='https://ggfxdeuwifmqulyhchtv.supabase.co';
const SK='sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI';
let sb, MY_UID=null, MY_NAME=null, OPP_NAME=null;
let match=null, mySecret=null, oppSecret=null;
let guessCounts={Satyam:0,Snks:0};
let questions=[];
let matchCh=null, secretsCh=null, countsCh=null, questionsCh=null;
let _lastRoutedStatus=null; // used to only reset inputs on a GENUINE screen transition, never mid-typing

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('on'),2400);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function showLoadingError(msg){
  document.getElementById('loadingMsg').innerHTML=msg;
  document.querySelector('#s-loading .dots').style.display='none';
  showScreen('s-loading');
}
function escHtmlWG(s){
  const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;
}
// Every server call gets a hard timeout so a dropped connection can never
// leave a button/input stuck disabled forever — this is what fixes the
// "frozen, had to reopen the app" symptom.
function withTimeout(promise,ms=12000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out — check your connection')),ms))
  ]);
}

// ── BOOT ──
async function boot(){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){MY_UID=session.user.id;}
    else{
      const{data,error}=await sb.auth.signInAnonymously();
      if(error) throw error;
      MY_UID=data.user.id;
    }

    const{data:sess,error:sessErr}=await sb.from('sessions').select('user_name').eq('auth_uid',MY_UID).maybeSingle();
    if(sessErr) throw sessErr;
    if(!sess){
      showLoadingError("Open and log into Tether chat on this device first 💬<br/>then come back here.");
      return;
    }
    MY_NAME=sess.user_name;
    OPP_NAME=MY_NAME==='Satyam'?'Snks':'Satyam';
    document.getElementById('whoamiChip').textContent=`🦊 You're playing as ${MY_NAME}`;
    document.getElementById('whoamiName2').textContent=MY_NAME;
    document.getElementById('revealThemName').textContent=OPP_NAME;

    await resync();
    subscribeAll();

    // Reliability net: even if realtime silently drops (very common on mobile
    // when the app backgrounds), this guarantees we're never out of sync with
    // the server for more than a few seconds.
    setInterval(resync,4000);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){ resync(); subscribeAll(); }
    });
    window.addEventListener('online',()=>{ resync(); subscribeAll(); });
    window.addEventListener('pageshow',()=>{ resync(); subscribeAll(); });
  }catch(e){
    console.error(e);
    showLoadingError('Something went wrong: '+(e.message||'unknown error'));
  }
}

(function init(){
  sb=supabase.createClient(SU,SK);
  boot();
})();

// ── REALTIME (best-effort, instant when it works; resync() above covers the gaps) ──
function subscribeAll(){
  if(matchCh){try{sb.removeChannel(matchCh);}catch(e){}}
  if(secretsCh){try{sb.removeChannel(secretsCh);}catch(e){}}
  if(countsCh){try{sb.removeChannel(countsCh);}catch(e){}}
  if(questionsCh){try{sb.removeChannel(questionsCh);}catch(e){}}

  matchCh=sb.channel('wg-match-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'wg_match',filter:'id=eq.1'},()=>resync())
    .subscribe(status=>{
      const el=document.getElementById('connStatus');
      if(!el)return;
      if(status==='SUBSCRIBED') el.innerHTML=`<span class="dot"></span> Connected`;
      else{ el.className='pill warn'; el.innerHTML=`<span class="dot"></span> Reconnecting...`; }
    });

  secretsCh=sb.channel('wg-secrets-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'wg_secrets'},()=>resync())
    .subscribe();

  countsCh=sb.channel('wg-counts-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'wg_guess_counts'},p=>{
      const row=p.new;
      if(!row)return;
      guessCounts[row.player_name]=row.count;
      renderGuessCounts(row.player_name);
    })
    .subscribe();

  questionsCh=sb.channel('wg-questions-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'wg_questions'},()=>loadQuestions())
    .subscribe();
}

// ── Central resync: the single source of truth pulled fresh from the server.
//    Called on boot, on every realtime match ping, every 4s regardless, and
//    whenever the app comes back to the foreground. ──
async function resync(){
  try{
    const{data:m,error:mErr}=await sb.from('wg_match').select('*').eq('id',1).maybeSingle();
    if(mErr) throw mErr;
    if(!m)return;
    match=m;
    await loadMySecret();
    if(match.status==='over') await loadOppSecretIfRevealed();
    else oppSecret=null;
    await loadGuessCounts();
    if(match.status==='playing') await loadQuestions();
    routeScreen();
  }catch(e){
    console.warn('resync failed (will retry):',e);
  }
}

async function loadMySecret(){
  const{data}=await sb.from('wg_secrets').select('*').eq('player_name',MY_NAME).maybeSingle();
  mySecret=data;
}
async function loadOppSecretIfRevealed(){
  const{data}=await sb.from('wg_secrets').select('*').eq('player_name',OPP_NAME).maybeSingle();
  if(data&&data.revealed) oppSecret=data;
}
async function loadGuessCounts(){
  const{data}=await sb.from('wg_guess_counts').select('*');
  if(data) data.forEach(r=>guessCounts[r.player_name]=r.count);
  renderGuessCounts();
}
function renderGuessCounts(bumpedName){
  const sEl=document.getElementById('gcSatyam');
  const nEl=document.getElementById('gcSnks');
  if(sEl) sEl.textContent=guessCounts.Satyam||0;
  if(nEl) nEl.textContent=guessCounts.Snks||0;
  if(bumpedName){
    const el=bumpedName==='Satyam'?sEl:nEl;
    if(el){
      el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
      setTimeout(()=>el.classList.remove('bump'),200);
    }
  }
}

// ── QUESTIONS ──
async function loadQuestions(){
  const{data,error}=await sb.from('wg_questions').select('*').order('created_at',{ascending:true});
  if(!error) questions=data||[];
  renderQuestions();
}
function renderQuestions(){
  const el=document.getElementById('qHistory');
  if(!el)return;
  if(!questions.length){
    el.innerHTML='<div class="q-empty">No questions asked yet — start guessing! 🕵️</div>';
    return;
  }
  el.replaceChildren();
  questions.forEach(q=>{
    const item=document.createElement('div');
    item.className='q-item';
    const isMine=q.asked_by===MY_NAME;
    const textDiv=document.createElement('div');
    textDiv.className='q-text';
    textDiv.innerHTML=`<b>${escHtmlWG(q.asked_by)} asked:</b> ${escHtmlWG(q.question)}`;
    item.appendChild(textDiv);
    if(q.answer){
      const badge=document.createElement('div');
      badge.className='q-answer '+q.answer;
      badge.textContent=q.answer==='yes'?'✅ Yes':'❌ No';
      item.appendChild(badge);
    }else if(!isMine){
      const toggle=document.createElement('div');
      toggle.className='q-toggle';
      const yesBtn=document.createElement('button');
      yesBtn.className='q-yes';yesBtn.textContent='✅ Yes';
      yesBtn.onclick=()=>answerQuestion(q.id,'yes');
      const noBtn=document.createElement('button');
      noBtn.className='q-no';noBtn.textContent='❌ No';
      noBtn.onclick=()=>answerQuestion(q.id,'no');
      toggle.append(yesBtn,noBtn);
      item.appendChild(toggle);
    }else{
      const pending=document.createElement('div');
      pending.className='q-pending';pending.textContent='⏳ Waiting for their answer...';
      item.appendChild(pending);
    }
    el.appendChild(item);
  });
  el.scrollTop=el.scrollHeight;
}
async function askQuestion(){
  const input=document.getElementById('qInput');
  const val=input.value.trim();
  if(!val)return;
  input.value='';
  try{
    const{error}=await withTimeout(sb.rpc('wg_ask_question',{p_question:val}));
    if(error) throw error;
    await loadQuestions();
  }catch(e){
    console.error('ask question failed:',e);
    toast('Could not send — try again');
    input.value=val; // give it back so nothing is lost
  }
}
async function answerQuestion(id,answer){
  const q=questions.find(x=>x.id===id);
  if(q){q.answer=answer;q.answered_at=new Date().toISOString();renderQuestions();} // optimistic
  try{
    const{error}=await withTimeout(sb.rpc('wg_answer_question',{p_id:id,p_answer:answer}));
    if(error) throw error;
  }catch(e){
    console.error('answer question failed:',e);
    toast('Could not send answer — try again');
    await loadQuestions(); // undo optimistic update by resyncing from server
  }
}

// ── SCREEN ROUTING ──
function routeScreen(){
  if(!match)return;
  const enteringChoosing = match.status==='choosing' && _lastRoutedStatus!=='choosing';

  if(match.status==='choosing'){
    const animalInput=document.getElementById('animalInput');
    if(mySecret&&mySecret.locked){
      document.getElementById('choosingHint').textContent="Locked in — waiting for them to lock in too... 👀";
      document.getElementById('lockBtn').disabled=true;
      animalInput.disabled=true;
    }else{
      document.getElementById('choosingHint').textContent='';
      document.getElementById('lockBtn').disabled=false;
      animalInput.disabled=false;
      // CRITICAL: only clear the field on a genuine fresh entry into this screen,
      // never on a routine resync — this was the bug causing "can't type", where
      // periodic re-renders were wiping out whatever was mid-typed.
      if(enteringChoosing) animalInput.value='';
    }
    showScreen('s-choosing');
  }else if(match.status==='playing'){
    renderPlaying();
    renderGuessCounts();
    renderQuestions();
    showScreen('s-playing');
  }else if(match.status==='over'){
    renderOver();
    showScreen('s-over');
  }
  _lastRoutedStatus=match.status;
}

function renderPlaying(){
  if(!match||match.status!=='playing')return;
  document.getElementById('myAnimalTag').textContent=mySecret?.animal||'—';
}

function renderOver(){
  const iWon=match.winner_name===MY_NAME;
  document.getElementById('overTrophy').textContent=iWon?'🏆':'🦊';
  document.getElementById('finalWinnerName').textContent=iWon?'You guessed it! 🎉':`${OPP_NAME} got it! 🎉`;
  document.getElementById('revealMeAnimal').textContent=mySecret?.animal||'—';
  document.getElementById('revealThemAnimal').textContent=oppSecret?.animal||'—';
  document.getElementById('finalGuessStats').textContent=
    `You: ${guessCounts[MY_NAME]||0} guesses  ·  ${OPP_NAME}: ${guessCounts[OPP_NAME]||0} guesses`;
}

// ── ACTIONS ──
async function lockAnimal(){
  const val=document.getElementById('animalInput').value.trim();
  if(!val){toast('Type an animal or bird first 🐣');return;}
  const lockBtn=document.getElementById('lockBtn');
  lockBtn.disabled=true;
  try{
    const{error}=await withTimeout(sb.rpc('wg_lock_animal',{p_animal:val}));
    if(error) throw error;
    await loadMySecret();
    document.getElementById('animalInput').disabled=true;
    document.getElementById('choosingHint').textContent="Locked in — waiting for them to lock in too... 👀";
  }catch(e){
    toast('Failed: '+(e.message||'try again'));
    lockBtn.disabled=false; // never leave it stuck disabled on failure
  }
}

async function submitGuess(){
  const input=document.getElementById('guessInput');
  const val=input.value.trim();
  if(!val)return;
  document.getElementById('guessErr').textContent='';
  guessCounts[MY_NAME]=(guessCounts[MY_NAME]||0)+1; // optimistic bump
  renderGuessCounts(MY_NAME);
  try{
    const{data,error}=await withTimeout(sb.rpc('wg_submit_guess',{p_guess:val}));
    if(error) throw error;
    input.value='';
    if(data.won){
      toast('🎉 Correct! You got it!');
    }else if(data.correct){
      toast(`Correct, but ${OPP_NAME} guessed first!`);
    }else{
      document.getElementById('guessErr').textContent='Not quite — keep asking! 🤔';
    }
  }catch(e){
    console.error('submitGuess error:',e);
    guessCounts[MY_NAME]=Math.max(0,(guessCounts[MY_NAME]||1)-1); // undo optimistic bump
    renderGuessCounts(MY_NAME);
    document.getElementById('guessErr').textContent='Error: '+(e.message||'unknown');
  }
}

async function startNewMatch(){
  const btn=document.querySelector('#s-over .btn');
  if(btn) btn.disabled=true;
  try{
    const{error}=await withTimeout(sb.rpc('wg_new_match'));
    if(error) throw error;
    mySecret=null;
    oppSecret=null;
    guessCounts={Satyam:0,Snks:0};
    questions=[];
    document.getElementById('guessInput').value='';
    document.getElementById('guessErr').textContent='';
    await resync(); // pulls the fresh reset state and routes to the choosing screen
  }catch(e){
    toast('Failed: '+(e.message||'try again'));
  }
  if(btn) btn.disabled=false;
}
</script>
