<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#fff4e6" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#241a2d" media="(prefers-color-scheme: dark)"/>

<style>
/* Tic Tac Toe only. Everything shared lives in games.css. */
#s-game{gap:.55rem}
.sym-badge{display:inline-grid;place-items:center;flex:none;inline-size:1.3rem;block-size:1.3rem;border:2px solid var(--line);border-radius:.45rem;background:var(--card);color:var(--plum);font:700 .74rem var(--font-display)}
#satyamSymBadge{background:var(--satyam)} #snksSymBadge{background:var(--snks)}

.score-card{gap:.5rem;padding:.7rem}
.score-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem}
.score-col{display:flex;align-items:center;gap:.45rem;min-inline-size:0;padding:.4rem .65rem;color:var(--plum);border:var(--bw) solid var(--line);border-radius:1rem;box-shadow:0 .2rem 0 var(--shadow)}
.score-col:nth-child(1){background:var(--satyam)}
.score-col:nth-child(3){background:var(--snks);flex-direction:row-reverse}
.score-name{flex:1;min-inline-size:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 .9rem var(--font-display)}
.score-col:nth-child(3) .score-name{text-align:end}
.score-num{font:700 2rem/1 var(--font-display);font-variant-numeric:tabular-nums}
.score-num.bump{animation:bump .5s var(--ease-spring)}
.score-divider{font:600 .95rem var(--font-display);color:var(--text-faint)}
.score-divider::before{content:'vs'}

.meta-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.turn-banner{
  display:inline-flex;align-items:center;gap:.5rem;padding:.35rem 1rem;
  font:600 1.1rem var(--font-display);color:var(--text);
  background:var(--card);border:2px solid var(--line);border-radius:99px;box-shadow:0 .2rem 0 var(--shadow);
  transition:background-color .3s;
}
.turn-banner.mine{background:var(--me);color:var(--plum)}
.turn-banner .tb-dot{inline-size:.6rem;block-size:.6rem;border-radius:50%;background:currentColor;animation:breathe 1.4s ease-in-out infinite}
#seriesProgress{margin:0;font-size:.85rem;color:var(--text-dim);white-space:nowrap}
@media (max-width:360px){
  .score-col{padding:.35rem .5rem;gap:.3rem}
  .score-name{font-size:.8rem}
  .score-num{font-size:1.7rem}
  .sym-badge{inline-size:1.1rem;block-size:1.1rem;font-size:.65rem}
}

/* the stage takes whatever height is left; the board card is the biggest square that fits it */
.board-stage{flex:1 1 0;min-block-size:0;display:grid;place-items:center;container-type:size}
#boardCard{inline-size:min(100cqi,100cqb);aspect-ratio:1;padding:.6rem;display:grid}
.board{inline-size:100%;block-size:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:.6rem;position:relative}

/* "your turn" ring: its own element and only opacity/scale animate, so it can never
   interfere with the card's entrance animation (it used to replace it, and the whole
   board slid in again every time the ring switched off) */
#boardCard::after{content:'';position:absolute;inset:-.3rem;border-radius:inherit;border:3px solid var(--me);opacity:0;pointer-events:none;transition:opacity .3s}
#boardCard.my-turn::after{animation:ringPulse 2.2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{opacity:.25;scale:1}50%{opacity:.75;scale:1.012}}

.cell{
  position:relative;display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:var(--card);border:var(--bw) solid var(--line);border-radius:1.1rem;box-shadow:0 .26rem 0 var(--shadow);
  transition:translate .12s var(--ease-out),box-shadow .12s var(--ease-out),background-color .3s;
}
.cell:not(.disabled):hover{background:color-mix(in oklab,var(--tint) 38%,var(--card))}
.cell:not(.disabled):active{translate:0 .26rem;box-shadow:0 0 0 var(--shadow)}
.cell.disabled{cursor:default}
.cell.by-satyam{background:var(--satyam)}
.cell.by-snks{background:var(--snks)}
.cell.win{background:var(--butter);animation:wiggle .6s ease 2}
.cell svg{inline-size:66%;block-size:66%;overflow:visible}
.cell.placed svg{animation:markPop .45s var(--ease-spring)}
.mk-ink{stroke:var(--plum);stroke-width:5.8;fill:none}
.mk-in{stroke:#fff;stroke-width:2.8;fill:none}
.cell.shake{animation:cellShake .35s ease}
.cell.cell-enter{animation:cellEnter .45s var(--ease-spring) both}
@keyframes markPop{from{scale:.55;rotate:-14deg}}
@keyframes cellShake{20%{translate:-5px 0}40%{translate:4px 0}60%{translate:-3px 0}80%{translate:2px 0}}
@keyframes cellEnter{from{opacity:0;scale:.55}}

.win-line{
  position:absolute;top:0;left:0;block-size:.6rem;inline-size:0;opacity:0;z-index:5;pointer-events:none;
  background:var(--plum);border-radius:99px;transform-origin:left center;
  box-shadow:0 0 0 .22rem var(--butter);
  transition:width .5s var(--ease-out),opacity .2s;
}
.win-line.show{opacity:1}
</style>
</head>
<body data-game="ttt">
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="sr-only">Back to Tether</span>
    </a>
    <div class="brand">
      <span class="ic" aria-hidden="true"><svg class="i"><use href="#i-g-ttt"/></svg></span>
      <h1>Tic Tac Toe</h1>
      <span id="connStatus" class="conn" role="status" aria-label="Connected"></span>
    </div>
    <div style="width:64px"></div>
  </div>

  <!-- LOADING / ERROR -->
  <div class="screen on" id="s-loading">
    <div class="card" style="text-align:center">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="hint" id="loadingMsg">Getting things ready...</div>
    </div>
  </div>

  <!-- GAME -->
  <div class="screen" id="s-game">
    <div class="card tight score-card">
      <div class="score-row">
        <div class="score-col">
          <span class="sym-badge" id="satyamSymBadge">X</span>
          <span class="score-name">Satyam</span>
          <span class="score-num" id="scoreSatyam">0</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-col">
          <span class="sym-badge" id="snksSymBadge">O</span>
          <span class="score-name">Snks</span>
          <span class="score-num" id="scoreSnks">0</span>
        </div>
      </div>
      <div class="meta-row">
        <div class="turn-banner" id="turnBanner">—</div>
        <div class="hint" id="seriesProgress"></div>
      </div>
    </div>

    <div class="board-stage">
      <div class="card" id="boardCard">
        <div class="board" id="board"></div>
      </div>
    </div>
    <span class="sr-only"><b id="whoamiName"></b> <span id="mySymBadge"></span></span>
  </div>

  <!-- OVER (single game, series still in progress) -->
  <div class="screen" id="s-over">
    <div class="card" style="text-align:center">
      <svg class="trophy" id="overTrophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/></svg>
      <div class="final-name" id="finalName"></div>
      <div class="hint" id="seriesProgressOver"></div>
      <button class="btn" onclick="newGame()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        Play Again
      </button>
    </div>
  </div>

  <!-- SERIES OVER — reached 15 games, overall champion decided -->
  <div class="screen" id="s-series-over">
    <div class="card" style="text-align:center">
      <svg class="trophy" id="seriesTrophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/></svg>
      <div class="hint" style="font-size:11px;letter-spacing:0.5px;text-transform:uppercase">Series complete</div>
      <div class="final-name" id="seriesFinalName"></div>
      <div class="hint" id="seriesFinalScore"></div>
      <button class="btn" onclick="startNewSeries()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        Start New Series
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="games-live.js"></script>
<script>
let _sfxArmed=false;
const sfx=name=>{ if(_sfxArmed) TetherUI.sfx.play(name); };   // reactions to what happened on the other phone
const sfxNow=name=>TetherUI.sfx.play(name);                     // reactions to something I just did

const SU='https://ggfxdeuwifmqulyhchtv.supabase.co';
const SK='sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI';
let sb, MY_UID=null, MY_NAME=null, OPP_NAME=null;
let match=null;
let matchCh=null;
let _prevScores={Satyam:0,Snks:0};
let _wasPlaying=true; // guards the game-over haptic so it fires once per finished game, not on every poll
let _prevBoardWasEmpty=null; // null until the first real render, so a fresh page load doesn't spuriously replay the entrance animation
let _resultTransitionPending=false; // guards the brief pause before showing results so it can't double-fire from an overlapping render()

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('on'),2400);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function showLoadingError(msg){
  document.getElementById('loadingMsg').innerHTML=msg;
  document.querySelector('#s-loading .dots').style.display='none';
  showScreen('s-loading');
}
function withTimeout(promise,ms=12000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out — check your connection')),ms))
  ]);
}

// ── BOOT ──
async function boot(){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){MY_UID=session.user.id;}
    else{
      const{data,error}=await sb.auth.signInAnonymously();
      if(error) throw error;
      MY_UID=data.user.id;
    }

    const{data:sessRows,error:sessErr}=await sb.from('sessions').select('user_name').eq('auth_uid',MY_UID).limit(1);
    if(sessErr) throw sessErr;
    const sess=sessRows&&sessRows[0];
    if(!sess){
      showLoadingError("Open and log into Tether chat on this device first,<br/>then come back here.");
      return;
    }
    MY_NAME=sess.user_name;document.body.dataset.me=MY_NAME; // drives which colour is "me" in the shared stylesheet
    OPP_NAME=MY_NAME==='Satyam'?'Snks':'Satyam';
    document.getElementById('whoamiName').textContent=MY_NAME;

    buildBoard();
    // Throwing variant for the first load only, so a real failure surfaces
    // an actual error instead of leaving "Getting things ready" up forever.
    await resyncOrThrow();
    _sfxArmed=true;   // from here on, incoming events make sound
    // Live sync lives in one shared, tested helper (games-live.js): one channel,
    // sane reconnects, wake-up handling and a slow backstop poll.
    live=TetherLive.hub(sb,{
      name:'ttt',
      bindings:[{event:'UPDATE',table:'ttt_match',filter:'id=eq.1',cb:()=>resync()}],
      onCatchup:resync, onStatus:setConn, pollLiveMs:8000,
    });
    live.start();
  }catch(e){
    console.error(e);
    showLoadingError('Something went wrong: '+(e.message||'unknown error'));
  }
}
(function init(){
  sb=supabase.createClient(SU,SK);
  boot();
})();

let live=null;   // the shared sync hub (games-live.js)
function setConn(isLive){
  const el=document.getElementById('connStatus');
  if(!el) return;
  el.className=isLive?'conn':'conn warn';
  el.setAttribute('aria-label',isLive?'Connected':'Reconnecting');
}

// Server state is only repainted when it actually changed. Polls, reconnect
// catch-ups and our own echo used to re-render identical data every few
// seconds, which replayed animations and looked like the page refreshing.
let _lastMatchJson='';
let _moveInFlight=false; // while our own move is travelling, a fetch that began before it would repaint the old board over it
async function resyncOrThrow(){
  const{data:m,error}=await sb.from('ttt_match').select('*').eq('id',1).maybeSingle();
  if(error) throw error;
  if(!m||_moveInFlight) return;
  const json=JSON.stringify(m);
  if(json===_lastMatchJson) return;
  _lastMatchJson=json;
  match=m;
  render();
}
const _resyncRun=TetherLive.coalesce(async()=>{
  try{ await resyncOrThrow(); }
  catch(e){ console.warn('resync failed (will retry):',e); }
});
function resync(){ return _resyncRun(); }   // one at a time; a burst of events folds into a single follow-up

// Sticker marks: a plum outline stroke under a white stroke. Both paths are
// drawn on together with the stroke-dasharray/dashoffset trick.
const X_MARK='<svg viewBox="0 0 24 24" stroke-linecap="round"><path class="mark-path mk-ink" d="M5.5 5.5l13 13M18.5 5.5l-13 13"/><path class="mark-path mk-in" d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>';
const O_MARK='<svg viewBox="0 0 24 24"><circle class="mark-path mk-ink" cx="12" cy="12" r="7.2"/><circle class="mark-path mk-in" cx="12" cy="12" r="7.2"/></svg>';
function markHtml(val){ return val==='X'?X_MARK:O_MARK; }
function animateMark(cell){
  cell.querySelectorAll('.mark-path').forEach(path=>{
    let len;
    try{ len=path.getTotalLength(); }catch(e){ return; } // not rendered yet (screen still hidden): nothing to animate
    path.style.strokeDasharray=len+' '+(len+20);
    path.style.strokeDashoffset=(len+10); // start inside the gap so a round cap never flashes a dot before the stroke draws on
    path.getBoundingClientRect(); // force reflow so the transition below actually animates
    path.style.transition='stroke-dashoffset .38s cubic-bezier(.2,1,.3,1)';
    requestAnimationFrame(()=>{ path.style.strokeDashoffset='0'; });
  });
}

function buildBoard(){
  const board=document.getElementById('board');
  board.replaceChildren();
  for(let i=0;i<9;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.i=i;
    cell.onclick=()=>makeMove(i);
    // keyboard + screen-reader access
    cell.tabIndex=0;
    cell.setAttribute('role','button');
    cell.setAttribute('aria-label','Square '+(i+1));
    cell.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); makeMove(i); } };
    board.appendChild(cell);
  }
}

const SERIES_LENGTH=15; // draws don't increment either player's win count, so this counts decisive games only

function render(){
  if(!match)return;

  document.getElementById('mySymBadge').textContent=match.x_player===MY_NAME?'X':'O';
  document.getElementById('mySymBadge').className='sym-badge '+(match.x_player===MY_NAME?'x':'o');
  document.getElementById('satyamSymBadge').textContent=match.x_player==='Satyam'?'X':'O';
  document.getElementById('satyamSymBadge').className='sym-badge '+(match.x_player==='Satyam'?'x':'o');
  document.getElementById('snksSymBadge').textContent=match.x_player==='Snks'?'X':'O';
  document.getElementById('snksSymBadge').className='sym-badge '+(match.x_player==='Snks'?'x':'o');

  const sEl=document.getElementById('scoreSatyam');
  const nEl=document.getElementById('scoreSnks');
  sEl.textContent=match.wins_satyam;
  nEl.textContent=match.wins_snks;
  if(match.wins_satyam!==_prevScores.Satyam) bumpEl(sEl);
  if(match.wins_snks!==_prevScores.Snks) bumpEl(nEl);
  _prevScores={Satyam:match.wins_satyam,Snks:match.wins_snks};

  const gamesDone=match.wins_satyam+match.wins_snks;
  const seriesOver=gamesDone>=SERIES_LENGTH;
  const gameNum=Math.min(gamesDone+1,SERIES_LENGTH);
  document.getElementById('seriesProgress').textContent=`Game ${gameNum} of ${SERIES_LENGTH}`;

  const board=document.getElementById('board');
  const cells=board.children;
  const boardIsEmpty=match.board.every(v=>!v);
  if(boardIsEmpty&&_prevBoardWasEmpty===false) staggerBoardIn();
  _prevBoardWasEmpty=boardIsEmpty;
  const winSet=new Set(match.win_line||[]);
  for(let i=0;i<9;i++){
    const val=match.board[i];
    const cell=cells[i];
    const hadVal=cell.dataset.filled==='1';
    // colour follows the PLAYER, not the symbol, so Satyam is always sky and Snks always pink
    const owner=val?(val==='X'?match.x_player:(match.x_player==='Satyam'?'Snks':'Satyam')):'';
    // Toggle only the STATE classes. Reassigning className used to wipe the board's entrance
    // animation, the invalid-move shake and the mark pop on every sync.
    const want=['x','o','by-satyam','by-snks','win','disabled'].filter(c=>
      (c==='x'||c==='o')?(val&&val.toLowerCase()===c):
      c==='by-satyam'?owner==='Satyam':c==='by-snks'?owner==='Snks':
      c==='win'?winSet.has(i):(match.status!=='playing'||!!val));
    ['x','o','by-satyam','by-snks','win','disabled'].forEach(c=>cell.classList.toggle(c,want.includes(c)));
    if(val){
      // a cell's value never changes once set, so once painted just leave it —
      // this also avoids re-triggering the draw-on animation every resync
      if(!hadVal){
        cell.innerHTML=markHtml(val);
        animateMark(cell);
        cell.classList.add('placed');
        setTimeout(()=>cell.classList.remove('placed'),600);
        if(owner!==MY_NAME) sfx('opp');   // the other player's mark landing
      }
      cell.dataset.filled='1';
    }else{
      cell.textContent='';
      cell.dataset.filled='0';
    }
  }

  const banner=document.getElementById('turnBanner');
  const boardCard=document.getElementById('boardCard');
  if(match.status==='playing'){
    const myTurn=match.turn===MY_NAME;
    banner.innerHTML=(myTurn?'<span class="tb-dot"></span> Your turn':`Waiting for ${OPP_NAME}...`);
    banner.className='turn-banner '+(myTurn?'mine':'theirs');
    boardCard.classList.toggle('my-turn',myTurn);
    hideWinLine();
    _wasPlaying=true;
    showScreen('s-game');
  }else{
    boardCard.classList.remove('my-turn');
    showScreen('s-game'); // keep board visible behind, then show result
    const isFreshResult=_wasPlaying; // only true the first time we see this particular game as finished
    if(match.status!=='draw' && match.win_line&&match.win_line.length) drawWinLine(match.win_line);
    if(isFreshResult){
      // only the FIRST time we see this game as finished — not on every
      // subsequent poll/realtime tick while still parked on the result screen
      sfxNow(match.status==='draw'?'tie':(match.winner_name===MY_NAME?'win':'lose'));
      vibrate(match.status==='draw'?20:(match.winner_name===MY_NAME?[25,60,25,60,60]:[20,40,20]));
    }
    _wasPlaying=false;
    const showResultScreen=()=>{
      if(seriesOver){ renderSeriesOver(); showScreen('s-series-over'); }
      else{ renderOver(); showScreen('s-over'); }
    };
    if(isFreshResult&&!_resultTransitionPending){
      // Give the winning line (and the win/draw haptic) a beat to actually
      // register before jumping straight to the results screen — showing
      // it instantly made a win feel rushed, like the game didn't pause to
      // acknowledge what just happened.
      _resultTransitionPending=true;
      setTimeout(()=>{ _resultTransitionPending=false; showResultScreen(); },650);
    }else if(!_resultTransitionPending){
      showResultScreen(); // an already-seen result (e.g. a later poll while parked on this screen) — show immediately, no artificial delay
    }
  }
}

function vibrate(pattern){ TetherUI.haptic(pattern); }   // honours the Vibration switch in Settings

let _winLineKey='';
function hideWinLine(){
  const line=document.getElementById('winLine');
  if(line) line.classList.remove('show');
  _winLineKey='';
}

// Positions the win line from LAYOUT coordinates (offsetLeft/offsetTop), not
// getBoundingClientRect(). Bounding rects include every transform in play (the
// card sliding in, the winning cells wiggling), which knocked the line off the
// row. The overhang is also applied along the line's own direction; it used to
// be added to x only, which pushed diagonals ~13% too far down and slid vertical
// lines half an overhang to the left.
function placeWinLine(indices,animate){
  const board=document.getElementById('board');
  const first=board.children[indices[0]], last=board.children[indices[2]];
  if(!first||!last) return;
  let line=document.getElementById('winLine');
  if(!line){
    line=document.createElement('div');
    line.id='winLine';
    line.className='win-line';
    board.appendChild(line);
  }
  const ctr=c=>({x:c.offsetLeft+c.offsetWidth/2,y:c.offsetTop+c.offsetHeight/2});
  const a=ctr(first), b=ctr(last);
  const dx=b.x-a.x, dy=b.y-a.y, dist=Math.hypot(dx,dy);
  if(!dist) return; // board is not laid out (hidden screen)
  const ux=dx/dist, uy=dy/dist;
  const over=Math.min(first.offsetWidth*0.3,28);
  const len=dist+over*2;
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  const key=indices.join()+'|'+Math.round(a.x)+'|'+Math.round(a.y)+'|'+Math.round(len);
  if(key===_winLineKey&&line.classList.contains('show')) return; // already drawn exactly here
  _winLineKey=key;
  const h=line.offsetHeight||10;
  line.style.left=(a.x-ux*over)+'px';
  line.style.top=(a.y-uy*over-h/2)+'px';   // rotation pivots on the left-centre, so this point is the true start
  line.style.transform=`rotate(${angle}deg)`;
  if(animate){
    line.style.width='0px';
    line.classList.remove('show');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      line.style.width=len+'px';
      line.classList.add('show');
    }));
  }else{
    line.style.width=len+'px';
    line.classList.add('show');
  }
}
function drawWinLine(indices){ placeWinLine(indices,true); }

// keep the line glued to the row if the board changes size (rotation, resize)
if(window.ResizeObserver){
  new ResizeObserver(()=>{
    if(match&&match.status!=='playing'&&match.status!=='draw'&&match.win_line&&match.win_line.length){
      _winLineKey=''; placeWinLine(match.win_line,false);
    }
  }).observe(document.getElementById('board'));
}

function bumpEl(el){
  el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
  setTimeout(()=>el.classList.remove('bump'),500);
}

// Inner paths swapped per outcome — trophy for a win, a handshake-ish
// clasp for a draw, a plain circle-slash for a loss — same outer <svg>
// element (with its glow/animation styling) reused each time.
const TROPHY_ICON='<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/>';
const DRAW_ICON='<circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/>';
const LOSS_ICON='<circle cx="12" cy="12" r="9"/><path d="M9 15l6-6M9 9l6 6"/>';

function renderOver(){
  const icon=document.getElementById('overTrophy');
  if(match.status==='draw'){
    icon.innerHTML=DRAW_ICON;
    document.getElementById('finalName').textContent="It's a draw";
  }else{
    const iWon=match.winner_name===MY_NAME;
    icon.innerHTML=iWon?TROPHY_ICON:LOSS_ICON;
    document.getElementById('finalName').textContent=iWon?'You win':`${OPP_NAME} wins`;
  }
  document.getElementById('seriesProgressOver').textContent=
    `Series: Satyam ${match.wins_satyam} – Snks ${match.wins_snks}  ·  ${match.wins_satyam+match.wins_snks} of ${SERIES_LENGTH}`;
}

function renderSeriesOver(){
  const satyamWon=match.wins_satyam>match.wins_snks;
  const tied=match.wins_satyam===match.wins_snks;
  const champion=satyamWon?'Satyam':'Snks';
  const icon=document.getElementById('seriesTrophy');
  icon.innerHTML=tied?DRAW_ICON:TROPHY_ICON;
  document.getElementById('seriesFinalName').textContent=
    tied?"It's a tie!":`${champion} wins the series!`;
  document.getElementById('seriesFinalScore').textContent=
    `Final score: Satyam ${match.wins_satyam} – Snks ${match.wins_snks}`;
  if(!tied && !_seriesConfettiShown){
    _seriesConfettiShown=true;
    vibrate([30,80,30,80,30,80,80]);
  }
}
let _seriesConfettiShown=false;

// Forces strict alternation of who plays X (goes first) every game,
// regardless of whatever ttt_new_game() itself assigns server-side. Even a
// genuinely random 50/50 pick can "streak" — the same person getting X
// several games in a row by chance — which feels exactly like favoritism
// even when it isn't. Strict alternation removes that possibility entirely:
// over any even number of games, it's provably 50/50, no streaks possible.
async function forceAlternateXPlayer(prevXPlayer){
  const nextX=prevXPlayer==='Satyam'?'Snks':'Satyam';
  const{error}=await sb.from('ttt_match').update({x_player:nextX}).eq('id',1);
  if(error) console.warn('could not force X-player alternation:',error);
}

// Manual reset, available any time during play (not just once a series
// naturally finishes at 40 games) — for when you just don't want to keep
// grinding through the same series. Confirms first since it's destructive
// and can't be undone; reuses the exact same reset+redeal logic as the
// natural end-of-series flow.
function confirmResetSeries(btn){
  TetherUI.confirm({title:'Reset the score?',text:"The score goes back to 0–0 and a new series starts. This can't be undone.",ok:'Reset'}).then(ok=>{
    if(!ok) return;
    if(btn) btn.disabled=true;
    startNewSeries().finally(()=>{ if(btn) btn.disabled=false; });
  });
}

async function startNewSeries(){
  const btn=document.querySelector('#s-series-over .btn');
  if(btn) btn.disabled=true;
  try{
    const prevXPlayer=match?.x_player;
    // Resets the running score via a dedicated RPC (ttt_start_new_series) —
    // a direct client-side table update on ttt_match was being blocked by
    // RLS and causing failures, so the reset has to go through a
    // security-definer function that's allowed to write it instead.
    const{error:resetErr}=await withTimeout(sb.rpc('ttt_start_new_series'));
    if(resetErr) throw resetErr;
    const{error}=await withTimeout(sb.rpc('ttt_new_game'));
    if(error) throw error;
    if(prevXPlayer) await forceAlternateXPlayer(prevXPlayer);
    _seriesConfettiShown=false;
    await resync();
  }catch(e){
    toast('Failed to start new series: '+(e.message||'try again'));
  }
  if(btn) btn.disabled=false;
}

function shakeCell(i){
  const cells=document.getElementById('board').children;
  const cell=cells[i];
  if(!cell)return;
  cell.classList.remove('shake');void cell.offsetWidth;cell.classList.add('shake');
  setTimeout(()=>cell.classList.remove('shake'),350);
  vibrate(15);
  sfxNow('error');
}

function staggerBoardIn(){
  sfx('start');
  const cells=document.getElementById('board').children;
  for(let i=0;i<9;i++){
    const cell=cells[i];
    cell.classList.remove('cell-enter');
    void cell.offsetWidth; // force reflow so re-adding the class restarts the animation
    cell.style.animationDelay=(i*35)+'ms';
    cell.classList.add('cell-enter');
    setTimeout(()=>{ cell.classList.remove('cell-enter'); cell.style.animationDelay=''; },900); // don't leave a stale delay behind for later animations
  }
}

async function makeMove(i){
  if(!match||match.status!=='playing')return;
  if(match.turn!==MY_NAME){toast("It's not your turn yet");vibrate([12,40,12]);sfxNow('error');return;}
  if(match.board[i]){shakeCell(i);return;}

  // optimistic paint so it feels instant
  vibrate(12);
  const cells=document.getElementById('board').children;
  const mySymbol=match.x_player===MY_NAME?'X':'O';
  const mine=cells[i];
  ['x','o'].forEach(k=>mine.classList.toggle(k,k===mySymbol.toLowerCase()));
  mine.classList.add('by-'+MY_NAME.toLowerCase(),'disabled','placed');
  setTimeout(()=>mine.classList.remove('placed'),600);
  mine.innerHTML=markHtml(mySymbol);
  animateMark(mine);
  sfxNow('place');
  cells[i].dataset.filled='1'; // prevents render() from replaying the draw-on animation a second time once resync() confirms this same move

  _moveInFlight=true;
  try{
    const{error}=await withTimeout(sb.rpc('ttt_make_move',{p_index:i}));
    if(error) throw error;
    _moveInFlight=false;
    await resync();
  }catch(e){
    console.error('move failed:',e);
    toast('Move failed: '+(e.message||'try again'));
    _moveInFlight=false;
    _lastMatchJson=''; // force a repaint so the optimistic mark is rolled back
    await resync();
  }
}

async function newGame(){
  const btn=document.querySelector('#s-over .btn');
  if(btn) btn.disabled=true;
  try{
    const prevXPlayer=match?.x_player;
    const{error}=await withTimeout(sb.rpc('ttt_new_game'));
    if(error) throw error;
    if(prevXPlayer) await forceAlternateXPlayer(prevXPlayer);
    await resync();
  }catch(e){
    toast('Failed: '+(e.message||'try again'));
  }
  if(btn) btn.disabled=false;
}

// ── settings sheet + gear button (shared: games-ui.js) ──
TetherUI.mount({extras:[
  `<details class="how"><summary>How to play</summary><ol><li>Take turns placing your mark in a square.</li><li>Three in a row wins the game.</li><li>Whoever wins the most of the 15 games takes the series.</li></ol></details>`,
  `<button type="button" class="link danger" id="tuiReset">${TetherUI.icon('reset')} Reset score…</button>`
]});
document.getElementById('tuiReset').addEventListener('click',()=>{ TetherUI.settings.close(); confirmResetSeries(null); });
</script>
</body>
</html>
