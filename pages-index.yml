name: Update page index

# Keeps pages.json (the app's menu) in step with the pages in the repo.
# Runs only when an .html file or the script changes, so committing pages.json cannot trigger it again.
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'build-pages-index.js'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node build-pages-index.js
      - name: Commit pages.json if it changed
        run: |
          if [ -n "$(git status --porcelain pages.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pages.json
            git commit -m "Update page index"
            git push
          fi
