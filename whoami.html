<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Who Am I To You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0d0b12; --bg1:#161320; --bg2:#1f1a2c;
  --surface:rgba(255,255,255,0.045); --surface2:rgba(255,255,255,0.07); --surface3:rgba(255,255,255,0.1);
  --border:rgba(255,255,255,0.09); --border-hi:rgba(233,48,214,0.4);
  --text:#f3ede4; --text2:#a79cb8; --text3:#6f6480;
  --accent:#e930d6; --accent-soft:#f78ded; --accent-dim:#9c1690; --silver:#9d97ac; --silver-soft:#c7c2d3; --good:#7ed6a5; --bad:#e2707a;
  --grad:linear-gradient(135deg,var(--accent) 0%,var(--accent-soft) 100%);
  --shadow-lg:0 32px 70px -18px rgba(0,0,0,0.55),0 10px 26px -10px rgba(0,0,0,0.5);
  --shadow-sm:0 10px 22px -10px rgba(0,0,0,0.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;touch-action:manipulation}
body{
  background:
    radial-gradient(circle at 15% 5%,rgba(233,48,214,0.1),transparent 45%),
    radial-gradient(circle at 90% 15%,rgba(157,151,172,0.09),transparent 45%),
    radial-gradient(circle at 30% 95%,rgba(233,48,214,0.06),transparent 45%),
    linear-gradient(165deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 100%);
  background-attachment:fixed;
  color:var(--text);font-family:'Manrope',sans-serif;font-weight:500;
  min-height:100vh;min-height:-webkit-fill-available;
  display:flex;flex-direction:column;align-items:center;
  padding:20px;overflow-x:hidden;position:relative;
}
body::before,body::after{
  content:'';position:fixed;border-radius:50%;filter:blur(75px);opacity:0.32;z-index:0;pointer-events:none;
}
body::before{width:260px;height:260px;background:var(--accent);top:-80px;left:-80px}
body::after{width:290px;height:290px;background:var(--silver);bottom:-95px;right:-80px;opacity:0.1}

h1,h2,.disp{font-family:'Fraunces',serif}
.wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1;margin:auto 0;padding:10px 0 20px}
.topbar{display:flex;align-items:center;justify-content:space-between}
.backlink{
  font-size:12.5px;font-weight:600;color:var(--text2);text-decoration:none;
  display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);
  padding:7px 14px 7px 10px;border-radius:100px;
  box-shadow:var(--shadow-sm);transition:transform 0.15s cubic-bezier(.34,1.56,.64,1),border-color .2s;
}
.backlink svg{width:13px;height:13px;stroke:var(--text2)}
.backlink:active{transform:scale(0.94);border-color:var(--border-hi)}
.brand{display:flex;align-items:center;gap:8px;justify-content:center}
.brand .ic{width:22px;height:22px;color:var(--accent);filter:drop-shadow(0 2px 8px rgba(233,48,214,0.4))}
.brand h1{font-size:18px;font-weight:600;letter-spacing:0.2px;color:var(--text)}

.screen{display:none;flex-direction:column;gap:12px}
.screen.on{display:flex}
.card{animation:cardIn 0.42s cubic-bezier(.16,1,.3,1) both}
.card:nth-child(1){animation-delay:0.02s}
.card:nth-child(2){animation-delay:0.08s}
.card:nth-child(3){animation-delay:0.14s}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(0.97)}to{opacity:1;transform:none}}

.card{
  position:relative;
  background:var(--surface);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  border:1px solid var(--border);border-radius:20px;
  padding:18px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--shadow-lg);
  isolation:isolate;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);
}
.card.tight{padding:14px;gap:10px;border-radius:18px}
input[type=text]{
  width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:16px;font-family:'Manrope',sans-serif;font-weight:600;
  outline:none;transition:border-color 0.18s,transform 0.15s,box-shadow 0.18s;
}
input[type=text]::placeholder{color:var(--text3);font-weight:500}
input[type=text]:focus{border-color:var(--border-hi);box-shadow:0 0 0 3px rgba(233,48,214,0.12)}
input[type=text]:active{transform:scale(0.99)}
input[type=text]:disabled{opacity:0.5}

.btn{
  position:relative;overflow:hidden;
  border:none;border-radius:14px;padding:15px 18px;font-size:14.5px;font-weight:700;letter-spacing:0.2px;
  font-family:'Manrope',sans-serif;cursor:pointer;color:#1b1420;background:var(--grad);background-size:200% auto;
  transition:transform 0.18s cubic-bezier(.34,1.56,.64,1),opacity 0.15s,box-shadow 0.15s,background-position 0.4s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 12px 26px -8px rgba(233,48,214,0.4);
}
.btn svg{width:15px;height:15px;stroke:#1b1420}
.btn::after{
  content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.55),transparent);
  transform:skewX(-20deg);
}
.btn:active{transform:scale(0.95);background-position:100% 50%}
.btn:active::after{animation:shine .55s ease}
@keyframes shine{from{left:-60%}to{left:130%}}
.btn:disabled{opacity:0.4;pointer-events:none;box-shadow:none}
.btn.sm{padding:0;width:46px;height:46px;border-radius:50%;flex-shrink:0;box-shadow:0 10px 22px -6px rgba(233,48,214,0.4)}
.btn.sm svg{width:16px;height:16px}

.status-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text2)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:6px 12px;font-size:11.5px;font-weight:600;color:var(--text)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(126,214,165,0.2);animation:dotBreathe 2s ease-in-out infinite}
.pill.warn .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(233,48,214,0.22)}
@keyframes dotBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.whoami-inline{font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px}
.whoami-inline .avatar-sm{
  width:24px;height:24px;border-radius:50%;background:var(--grad);color:#1b1420;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:'Fraunces',serif;
  box-shadow:0 4px 10px -2px rgba(233,48,214,0.4);
}
.whoami-inline b{color:var(--text)}
.hint{font-size:12px;color:var(--text2);text-align:center;line-height:1.5;padding:0 6px}

/* role banner + secret word reveal (describer only) */
.role-banner{
  align-self:center;display:inline-flex;align-items:center;gap:7px;
  background:var(--grad);color:#1b1420;font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;
  padding:8px 18px;border-radius:100px;box-shadow:0 10px 22px -6px rgba(233,48,214,0.4);
}
.role-banner.guesser{background:var(--surface2);color:var(--text);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.secret-word{
  align-self:center;text-align:center;font-family:'Fraunces',serif;font-weight:600;font-size:27px;
  text-transform:capitalize;color:var(--accent-soft);font-style:italic;padding:4px 0;
  text-shadow:0 0 24px rgba(233,48,214,0.3);
}
.hidden-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--accent-soft);background:rgba(233,48,214,0.1);border:1px solid rgba(233,48,214,0.25);padding:5px 12px;border-radius:100px;align-self:center;animation:pulseGlow 2.4s ease-in-out infinite}
.hidden-badge svg{width:11px;height:11px}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(233,48,214,0.16)}50%{box-shadow:0 0 0 6px rgba(233,48,214,0)}}
.gc-title{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:0.7px;font-weight:700;text-align:center}

/* ═══ shared clue/guess feed — chat transcript style ═══ */
.feed-ask-row{display:flex;gap:8px;align-items:center}
.feed-ask-row input{flex:1}
#feed{
  display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;
  padding:4px 2px 2px;scroll-behavior:smooth;
}
.f-row{display:flex;animation:fSlideIn 0.32s cubic-bezier(.16,1,.3,1) both}
.f-row.mine{justify-content:flex-end}
.f-row.theirs{justify-content:flex-start}
@keyframes fSlideIn{from{opacity:0;transform:translateY(10px) scale(0.96)}to{opacity:1;transform:none}}
.f-bubble{max-width:82%;border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.f-row.mine .f-bubble{background:linear-gradient(160deg,rgba(233,48,214,0.14),rgba(233,48,214,0.05));border-bottom-right-radius:5px}
.f-row.theirs .f-bubble{background:linear-gradient(160deg,rgba(157,151,172,0.14),rgba(157,151,172,0.05));border-bottom-left-radius:5px}
.f-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;opacity:0.7}
.f-row.mine .f-tag{color:var(--accent-soft)}
.f-row.theirs .f-tag{color:var(--silver-soft)}
.f-text{font-size:13px;color:var(--text);line-height:1.35;font-weight:600}
.f-bubble.wrong .f-text{color:var(--bad)}
.f-bubble.right .f-text{color:var(--good)}
.f-empty{font-size:12.5px;color:var(--text3);text-align:center;padding:18px 8px}

.reveal-word{
  font-family:'Fraunces',serif;font-size:25px;font-weight:600;text-align:center;text-transform:capitalize;
  color:var(--accent-soft);font-style:italic;
}
.final-name{font-family:'Fraunces',serif;font-size:19px;font-weight:600;text-align:center;color:var(--text2)}
.trophy{width:52px;height:52px;margin:0 auto;color:var(--accent);filter:drop-shadow(0 4px 16px rgba(233,48,214,0.4));animation:trophyPop 0.65s cubic-bezier(.2,1.6,.4,1)}
@keyframes trophyPop{0%{transform:scale(0) rotate(-16deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}

.confetti-wrap{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.confetti-piece{position:absolute;top:-10px;border-radius:2px;opacity:0.9;animation:confettiFall linear forwards}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}

.err{color:var(--bad);font-size:12.5px;text-align:center;min-height:16px;font-weight:600}
.dots{display:flex;gap:5px;justify-content:center}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:dotpulse 1.2s ease infinite}
.dots span:nth-child(2){animation-delay:0.15s}
.dots span:nth-child(3){animation-delay:0.3s}
@keyframes dotpulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.15)}}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(24px) scale(0.9);
  background:#1b1626;border:1px solid var(--border-hi);padding:12px 22px;border-radius:100px;
  font-size:13px;font-weight:600;color:var(--text);opacity:0;
  transition:opacity 0.25s cubic-bezier(.34,1.4,.64,1),transform 0.25s cubic-bezier(.34,1.4,.64,1);
  pointer-events:none;z-index:50;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Tether
    </a>
    <div class="brand">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <h1>Who Am I To You</h1>
    </div>
    <div style="width:64px"></div>
  </div>

  <!-- LOADING / ERROR -->
  <div class="screen on" id="s-loading">
    <div class="card" style="text-align:center">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="hint" id="loadingMsg">Getting things ready...</div>
    </div>
  </div>

  <!-- PLAYING -->
  <div class="screen" id="s-playing">
    <div class="card tight">
      <div class="status-row">
        <span class="whoami-inline"><span class="avatar-sm" id="avatarSm">?</span> Playing as <b id="myNameLbl"></b></span>
        <span id="connStatus" class="pill"><span class="dot"></span> Connected</span>
      </div>
      <div id="roleBannerWrap" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div>
    </div>

    <div class="card tight">
      <div class="gc-title">Guesses this round</div>
      <div class="hint" id="guessCount" style="font-size:18px;font-weight:700;color:var(--text)">0</div>
      <div id="feed"></div>
    </div>

    <div class="card tight" id="clueCard" style="display:none">
      <div class="feed-ask-row">
        <input type="text" id="clueInput" placeholder="Type a clue... (don't say the word!)" maxlength="140" onkeydown="if(event.key==='Enter')sendClue()"/>
        <button class="btn sm" onclick="sendClue()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      </div>
    </div>

    <div class="card tight" id="guessCard" style="display:none">
      <div class="feed-ask-row">
        <input type="text" id="guessInput" placeholder="Guess the word..." maxlength="40" onkeydown="if(event.key==='Enter')submitGuess()"/>
        <button class="btn sm" onclick="submitGuess()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      </div>
      <div class="err" id="guessErr"></div>
    </div>
  </div>

  <!-- OVER -->
  <div class="screen" id="s-over">
    <div class="card" style="text-align:center">
      <svg class="trophy" id="overTrophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/></svg>
      <div class="final-name" id="finalWinnerName"></div>
      <div class="reveal-word" id="revealWord">—</div>
      <div class="hint" id="finalGuessStats"></div>
      <button class="btn" onclick="startNewRound()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        Next round
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SU='https://ggfxdeuwifmqulyhchtv.supabase.co';
const SK='sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI';
let sb, MY_UID=null, MY_NAME=null, OPP_NAME=null;
let match=null, myWord=null, log=[];
let matchCh=null, logCh=null;
let _lastRoutedStatus=null;

// ── WORD POOL ──────────────────────────────────────────────────────────
// This is the "not a static list" part explained honestly: there's no
// real way to conjure meaningful relationship-flavored words out of thin
// air, so this is a deliberately large, editable pool. What keeps it from
// feeling repetitive is whoami_new_round() on the server, which excludes
// the last ~15 words used before picking — so you'd need well over a
// dozen rounds before anything can repeat. Add your own inside words,
// nicknames, or things only the two of you would recognize any time —
// just add a line below, lowercase, no need to touch the SQL again.
const WORD_POOL=[
  // relationship roles — kept a few as "easy" rounds, trimmed way down from before
  'soulmate','life partner','other half','person','my person','best friend',

  // abstract / poetic concepts — need real description, not a one-word giveaway
  'gravity','anchor','compass','north star','constant','echo','reflection',
  'safe harbor','sanctuary','refuge','cocoon','orbit','magnetism','resonance',
  'wavelength','frequency','gravitational pull','center of gravity','muse',
  'foundation','cornerstone','keystone','backbone','glue','counterweight',
  'translator','witness','sounding board','soft place to land','home base',

  // fire/spark metaphors
  'spark','ember','wildfire','slow burn','chemistry','static electricity',

  // playful modern / tech metaphors — genuinely tricky to clue well
  'wifi password','airplane mode','do not disturb exception','read receipt',
  'typing indicator','blue tick','last seen','low battery anxiety',
  'group chat MVP','main character energy','plot twist','side quest',
  'extra life','cheat code','loading screen','buffering','autocorrect fail',
  'missed call','voicemail','3am thoughts','notification sound',

  // specific relationship-only quirks — funny, needs a real story to describe
  'blanket thief','the aux cord','remote control custody','left side of the bed',
  'the good pillow','charger thief','backseat driver','human alarm clock',
  'emotional support human','hype person','designated snack sharer',
  'built-in translator for moods','vibe check','mood ring',

  // travel / journey metaphors
  'road trip','passenger seat','shotgun','designated driver','GPS voice',
  'pit stop','finish line','starting line','layover','safe landing',
  'turbulence buddy','black box','life raft','map marker','waypoint',

  // game/story metaphors
  'co-op partner','player two','main quest','walkthrough','easter egg',
  'directors cut','deleted scene','bonus content','rough draft','final draft',
  'co-author','ghostwriter',

  // sound / music metaphors
  'favorite song on repeat','white noise','in sync','on the same wavelength',
  'harmony','duet',

  // everyday romance (kept, but a smaller share than before)
  'inside joke','nickname','playlist','voice note','ring','tether',
  'good morning text','good night call','matching outfits','photo album',
  'screenshot','video call','late night talk',

  // emotional/relationship concepts
  'trust','loyalty','patience','support','forgiveness','apology','promise',
  'distance','reunion','comfort','overthinking','jealousy','growth',
  'vulnerability','reassurance','belonging','constant variable','favorite chaos',
  'calm in the storm','eye of the storm',

  // milestones (kept a handful)
  'first date','first kiss','proposal','anniversary','long distance'
];

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('on'),2400);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function showLoadingError(msg){
  document.getElementById('loadingMsg').innerHTML=msg;
  document.querySelector('#s-loading .dots').style.display='none';
  showScreen('s-loading');
}
function withTimeout(promise,ms=12000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out — check your connection')),ms))
  ]);
}
function vibrate(pattern){
  if(navigator.vibrate){ try{navigator.vibrate(pattern);}catch(e){} }
}

// ── BOOT ──
async function boot(){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){MY_UID=session.user.id;}
    else{
      const{data,error}=await sb.auth.signInAnonymously();
      if(error) throw error;
      MY_UID=data.user.id;
    }
    // Defensive: .maybeSingle() only tolerates zero matching rows — if the
    // sessions table ever has more than one row for this auth_uid (a data
    // anomaly, but possible), it throws instead of picking one. limit(1) +
    // taking the first result degrades gracefully either way.
    const{data:sessRows,error:sessErr}=await sb.from('sessions').select('user_name').eq('auth_uid',MY_UID).limit(1);
    if(sessErr) throw sessErr;
    const sess=sessRows&&sessRows[0];
    if(!sess){
      showLoadingError("Open and log into Tether chat on this device first,<br/>then come back here.");
      return;
    }
    MY_NAME=sess.user_name;
    OPP_NAME=MY_NAME==='Satyam'?'Snks':'Satyam';
    document.getElementById('avatarSm').textContent=MY_NAME[0];
    document.getElementById('myNameLbl').textContent=MY_NAME;

    // Use the throwing variant for the FIRST load only — if this fails (e.g.
    // the whoami_resync SQL function isn't set up yet, or a real network
    // error), boot()'s catch below shows an actual error instead of leaving
    // the "Getting things ready" screen up forever with no explanation.
    // The 15s background poll further down uses the quiet resync() instead,
    // since we don't want a transient blip to interrupt an active game.
    await resyncOrThrow();
    subscribeAll();

    setInterval(()=>{ if(!document.hidden) resync(); },15000);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){ resync(); subscribeAll(); }
    });
    window.addEventListener('online',()=>{ resync(); subscribeAll(); });
    window.addEventListener('pageshow',()=>{ resync(); subscribeAll(); });
  }catch(e){
    console.error(e);
    showLoadingError('Something went wrong: '+(e.message||'unknown error'));
  }
}

(function init(){
  sb=supabase.createClient(SU,SK);
  boot();
})();

function subscribeAll(){
  if(matchCh){try{sb.removeChannel(matchCh);}catch(e){}}
  if(logCh){try{sb.removeChannel(logCh);}catch(e){}}

  matchCh=sb.channel('whoami-match-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'whoami_match',filter:'id=eq.1'},()=>resync())
    .subscribe(status=>{
      const el=document.getElementById('connStatus');
      if(!el)return;
      if(status==='SUBSCRIBED') el.innerHTML=`<span class="dot"></span> Connected`;
      else{ el.className='pill warn'; el.innerHTML=`<span class="dot"></span> Reconnecting...`; }
    });

  logCh=sb.channel('whoami-log-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'whoami_log'},()=>resync())
    .subscribe();
}

async function resyncOrThrow(){
  const{data,error}=await withTimeout(sb.rpc('whoami_resync'));
  if(error) throw error;
  match=data.match;
  myWord=data.my_word;
  log=data.log||[];
  renderFeed();
  routeScreen();
}

async function resync(){
  try{
    await resyncOrThrow();
  }catch(e){
    console.warn('resync failed (will retry):',e);
  }
}

function routeScreen(){
  if(!match)return;
  const iAmDescriber=match.describer===MY_NAME;

  if(match.status==='playing'){
    const wrap=document.getElementById('roleBannerWrap');
    wrap.innerHTML='';
    if(iAmDescriber){
      wrap.innerHTML=`
        <div class="role-banner">You're describing this round</div>
        <div class="hidden-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Hidden from ${OPP_NAME}</div>
        <div class="secret-word">${escHtml(myWord||'…')}</div>
        <div class="hint">Describe it without saying the word — think "who/what am I to you" style clues.</div>`;
      document.getElementById('clueCard').style.display='flex';
      document.getElementById('guessCard').style.display='none';
    }else{
      wrap.innerHTML=`
        <div class="role-banner guesser">${OPP_NAME} is describing — you're guessing</div>
        <div class="hint">Read the clues below and guess the word!</div>`;
      document.getElementById('clueCard').style.display='none';
      document.getElementById('guessCard').style.display='flex';
    }
    document.getElementById('guessCount').textContent=match.guess_count||0;
    if(_lastRoutedStatus!=='playing'){
      document.getElementById('clueInput').value='';
      document.getElementById('guessInput').value='';
      document.getElementById('guessErr').textContent='';
    }
    showScreen('s-playing');
  }else{
    renderOver();
    showScreen('s-over');
  }
  _lastRoutedStatus=match.status;
}

function escHtml(s){
  const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;
}

function renderFeed(){
  const el=document.getElementById('feed');
  if(!el)return;
  if(!log.length){
    el.innerHTML='<div class="f-empty">No clues yet — describer, go ahead</div>';
    return;
  }
  el.innerHTML='';
  log.forEach(item=>{
    const isMine=item.sender===MY_NAME;
    const row=document.createElement('div');
    row.className='f-row '+(isMine?'mine':'theirs');
    const bubble=document.createElement('div');
    bubble.className='f-bubble'+(item.kind==='guess'?(item.correct?' right':' wrong'):'');
    const tag=document.createElement('div');
    tag.className='f-tag';
    tag.textContent=(isMine?'You':item.sender)+(item.kind==='guess'?' guessed':' said');
    const text=document.createElement('div');
    text.className='f-text';
    text.textContent=item.kind==='guess'?`"${item.content}"${item.correct?' — correct':' — not quite'}`:item.content;
    bubble.append(tag,text);
    row.appendChild(bubble);
    el.appendChild(row);
  });
  el.scrollTop=el.scrollHeight;
}

const TROPHY_ICON='<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/>';
const LOSS_ICON='<circle cx="12" cy="12" r="9"/><path d="M9 15l6-6M9 9l6 6"/>';

function renderOver(){
  const iWon=match.winner===MY_NAME;
  document.getElementById('overTrophy').innerHTML=iWon?TROPHY_ICON:LOSS_ICON;
  document.getElementById('finalWinnerName').textContent=match.winner
    ? (iWon?'You got it!':`${OPP_NAME} got it!`)
    : 'Round over';
  document.getElementById('revealWord').textContent=match.revealed_word||'—';
  document.getElementById('finalGuessStats').textContent=`Guesses this round: ${match.guess_count||0}`;
  if(iWon&&!_confettiShownFor.has(match.updated_at)){
    _confettiShownFor.add(match.updated_at);
    burstConfetti();
    vibrate([25,60,25,60,60]);
  }
}
const _confettiShownFor=new Set();
function burstConfetti(){
  const wrap=document.createElement('div');
  wrap.className='confetti-wrap';
  document.body.appendChild(wrap);
  const colors=['#e930d6','#f78ded','#9d97ac','#c7c2d3','#9c1690'];
  for(let i=0;i<42;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=5+Math.random()*7;
    p.style.width=size+'px';
    p.style.height=size*0.4+'px';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(1.8+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*0.4)+'s';
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(),3600);
}

// ── ACTIONS ──
async function sendClue(){
  const input=document.getElementById('clueInput');
  const val=input.value.trim();
  if(!val)return;
  input.value='';
  vibrate(12);
  try{
    const{error}=await withTimeout(sb.rpc('whoami_add_clue',{p_text:val}));
    if(error) throw error;
    await resync();
  }catch(e){
    console.error('send clue failed:',e);
    toast('Could not send — try again');
    input.value=val;
  }
}

async function submitGuess(){
  const input=document.getElementById('guessInput');
  const val=input.value.trim();
  if(!val)return;
  document.getElementById('guessErr').textContent='';
  vibrate(12);
  try{
    const{data,error}=await withTimeout(sb.rpc('whoami_submit_guess',{p_guess:val}));
    if(error) throw error;
    input.value='';
    if(data.won){
      toast('Correct!');
    }else{
      document.getElementById('guessErr').textContent='Not quite — keep guessing';
    }
    await resync();
  }catch(e){
    console.error('submitGuess error:',e);
    document.getElementById('guessErr').textContent='Error: '+(e.message||'unknown');
  }
}

async function startNewRound(){
  const btn=document.querySelector('#s-over .btn');
  if(btn) btn.disabled=true;
  try{
    const{error}=await withTimeout(sb.rpc('whoami_new_round',{p_word_pool:WORD_POOL}));
    if(error) throw error;
    myWord=null;
    log=[];
    await resync();
  }catch(e){
    toast('Failed: '+(e.message||'try again'));
  }
  if(btn) btn.disabled=false;
}
</script>
