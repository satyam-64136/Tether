<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#fff4e6" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#241a2d" media="(prefers-color-scheme: dark)"/>
<title>Who Am I To You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games.css">

</head>
<body data-game="who">
<div class="wrap">
  <div class="topbar">
    <a class="backlink" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Tether
    </a>
    <div class="brand">
      <span class="ic" aria-hidden="true">💭</span>
      <h1>Who Am I To You</h1>
    </div>
    <div style="width:64px"></div>
  </div>

  <!-- LOADING / ERROR -->
  <div class="screen on" id="s-loading">
    <div class="card" style="text-align:center">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="hint" id="loadingMsg">Getting things ready...</div>
    </div>
  </div>

  <!-- PLAYING -->
  <div class="screen" id="s-playing">
    <div class="card tight">
      <div class="status-row">
        <span class="whoami-inline"><span class="avatar-sm" id="avatarSm">?</span> Playing as <b id="myNameLbl"></b></span>
        <span id="connStatus" class="pill"><span class="dot"></span> Connected</span>
      </div>
      <div id="roleBannerWrap" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div>
      <div class="hint" id="seriesProgress" style="margin-top:-4px"></div>
    </div>

    <div class="card tight">
      <div class="gc-title">Guesses this round</div>
      <div class="hint" id="guessCount" style="font-size:18px;font-weight:700;color:var(--text)">0</div>
      <div id="feed"></div>
    </div>

    <div class="card tight" id="clueCard" style="display:none">
      <div class="feed-ask-row">
        <input type="text" id="clueInput" placeholder="Type a clue... (don't say the word!)" maxlength="140" onkeydown="if(event.key==='Enter')sendClue()"/>
        <button class="btn sm" onclick="sendClue()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
      </div>
    </div>

    <div class="card tight" id="guessCard" style="display:none">
      <div class="feed-ask-row">
        <input type="text" id="guessInput" placeholder="Guess the word..." maxlength="40" onkeydown="if(event.key==='Enter')submitGuess()"/>
        <button class="btn sm" onclick="submitGuess()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      </div>
      <div class="err" id="guessErr"></div>
    </div>
  </div>

  <!-- OVER (single round, series still in progress) -->
  <div class="screen" id="s-over">
    <div class="card" style="text-align:center">
      <svg class="trophy" id="overTrophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/></svg>
      <div class="final-name" id="finalWinnerName"></div>
      <div class="reveal-word" id="revealWord">—</div>
      <div class="hint" id="finalGuessStats"></div>
      <div class="hint" id="seriesProgressOver"></div>
      <button class="btn" onclick="startNewRound()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        Next round
      </button>
    </div>
  </div>

  <!-- SERIES OVER — 20 rounds each played, overall winner decided by fewest total guesses -->
  <div class="screen" id="s-series-over">
    <div class="card" style="text-align:center">
      <svg class="trophy" id="seriesTrophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/></svg>
      <div class="hint" style="font-size:.9rem">Series complete · fewest guesses wins</div>
      <div class="final-name" id="seriesFinalName"></div>
      <div class="hint" id="seriesFinalScore"></div>
      <button class="btn" onclick="startNewSeries()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        Start New Series
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SU='https://ggfxdeuwifmqulyhchtv.supabase.co';
const SK='sb_publishable_DMMJ2sFnGlFWogBs30qowg_-N0zk3OI';
let sb, MY_UID=null, MY_NAME=null, OPP_NAME=null;
let match=null, myWord=null, log=[];
let matchCh=null, logCh=null;
let _lastRoutedStatus=null;

// ── WORD POOL ──────────────────────────────────────────────────────────
// This is the "not a static list" part explained honestly: there's no
// real way to conjure meaningful relationship-flavored words out of thin
// air, so this is a deliberately large, editable pool. What keeps it from
// feeling repetitive is whoami_new_round() on the server, which excludes
// the last ~15 words used before picking — so you'd need well over a
// dozen rounds before anything can repeat. Add your own inside words,
// nicknames, or things only the two of you would recognize any time —
// just add a line below, lowercase, no need to touch the SQL again.
const WORD_POOL=[
  // relationship roles — kept a few as "easy" rounds, trimmed way down from before
  'soulmate','life partner','other half','person','my person','best friend',

  // abstract / poetic concepts — need real description, not a one-word giveaway
  'gravity','anchor','compass','north star','constant','echo','reflection',
  'safe harbor','sanctuary','refuge','cocoon','orbit','magnetism','resonance',
  'wavelength','frequency','gravitational pull','center of gravity','muse',
  'foundation','cornerstone','keystone','backbone','glue','counterweight',
  'translator','witness','sounding board','soft place to land','home base',

  // fire/spark metaphors
  'spark','ember','wildfire','slow burn','chemistry','static electricity',

  // playful modern / tech metaphors — genuinely tricky to clue well
  'wifi password','airplane mode','do not disturb exception','read receipt',
  'typing indicator','blue tick','last seen','low battery anxiety',
  'group chat MVP','main character energy','plot twist','side quest',
  'extra life','cheat code','loading screen','buffering','autocorrect fail',
  'missed call','voicemail','3am thoughts','notification sound',

  // specific relationship-only quirks — funny, needs a real story to describe
  'blanket thief','the aux cord','remote control custody','left side of the bed',
  'the good pillow','charger thief','backseat driver','human alarm clock',
  'emotional support human','hype person','designated snack sharer',
  'built-in translator for moods','vibe check','mood ring',

  // travel / journey metaphors
  'road trip','passenger seat','shotgun','designated driver','GPS voice',
  'pit stop','finish line','starting line','layover','safe landing',
  'turbulence buddy','black box','life raft','map marker','waypoint',

  // game/story metaphors
  'co-op partner','player two','main quest','walkthrough','easter egg',
  'directors cut','deleted scene','bonus content','rough draft','final draft',
  'co-author','ghostwriter',

  // sound / music metaphors
  'favorite song on repeat','white noise','in sync','on the same wavelength',
  'harmony','duet',

  // everyday romance (kept, but a smaller share than before)
  'inside joke','nickname','playlist','voice note','ring','tether',
  'good morning text','good night call','matching outfits','photo album',
  'screenshot','video call','late night talk',

  // emotional/relationship concepts
  'trust','loyalty','patience','support','forgiveness','apology','promise',
  'distance','reunion','comfort','overthinking','jealousy','growth',
  'vulnerability','reassurance','belonging','constant variable','favorite chaos',
  'calm in the storm','eye of the storm',

  // milestones (kept a handful)
  'first date','first kiss','proposal','anniversary','long distance'
];

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('on'),2400);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function showLoadingError(msg){
  document.getElementById('loadingMsg').innerHTML=msg;
  document.querySelector('#s-loading .dots').style.display='none';
  showScreen('s-loading');
}
function withTimeout(promise,ms=12000){
  return Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timed out — check your connection')),ms))
  ]);
}
function vibrate(pattern){
  if(navigator.vibrate){ try{navigator.vibrate(pattern);}catch(e){} }
}

// ── BOOT ──
async function boot(){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){MY_UID=session.user.id;}
    else{
      const{data,error}=await sb.auth.signInAnonymously();
      if(error) throw error;
      MY_UID=data.user.id;
    }
    // Defensive: .maybeSingle() only tolerates zero matching rows — if the
    // sessions table ever has more than one row for this auth_uid (a data
    // anomaly, but possible), it throws instead of picking one. limit(1) +
    // taking the first result degrades gracefully either way.
    const{data:sessRows,error:sessErr}=await sb.from('sessions').select('user_name').eq('auth_uid',MY_UID).limit(1);
    if(sessErr) throw sessErr;
    const sess=sessRows&&sessRows[0];
    if(!sess){
      showLoadingError("Open and log into Tether chat on this device first,<br/>then come back here.");
      return;
    }
    MY_NAME=sess.user_name;document.body.dataset.me=MY_NAME; // drives which colour is "me" in the shared stylesheet
    OPP_NAME=MY_NAME==='Satyam'?'Snks':'Satyam';
    document.getElementById('avatarSm').textContent=MY_NAME[0];
    document.getElementById('myNameLbl').textContent=MY_NAME;

    // Use the throwing variant for the FIRST load only — if this fails (e.g.
    // the whoami_resync SQL function isn't set up yet, or a real network
    // error), boot()'s catch below shows an actual error instead of leaving
    // the "Getting things ready" screen up forever with no explanation.
    // The 15s background poll further down uses the quiet resync() instead,
    // since we don't want a transient blip to interrupt an active game.
    await resyncOrThrow();
    subscribeAll();

    // Now backed by real reconnect logic above, so this is a light backstop
    // rather than the primary sync path. Kept quick (6s) since quota
    // headroom is not a concern here.
    setInterval(()=>{ if(!document.hidden) resync(); },6000);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden){ resync(); subscribeAll(); }
    });
    window.addEventListener('online',()=>{ resync(); subscribeAll(); });
    window.addEventListener('pageshow',()=>{ resync(); subscribeAll(); });
  }catch(e){
    console.error(e);
    showLoadingError('Something went wrong: '+(e.message||'unknown error'));
  }
}

(function init(){
  sb=supabase.createClient(SU,SK);
  boot();
})();

let _reconnectTimer=null;
function scheduleReconnect(){
  if(_reconnectTimer)return; // one retry in flight at a time
  _reconnectTimer=setTimeout(()=>{
    _reconnectTimer=null;
    if(!document.hidden) subscribeAll();
  },2000);
}

function subscribeAll(){
  if(matchCh){try{sb.removeChannel(matchCh);}catch(e){}}
  if(logCh){try{sb.removeChannel(logCh);}catch(e){}}

  matchCh=sb.channel('whoami-match-'+Date.now())
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'whoami_match',filter:'id=eq.1'},()=>resync())
    .subscribe(status=>{
      const el=document.getElementById('connStatus');
      if(status==='SUBSCRIBED'){
        if(el){ el.className='pill'; el.innerHTML=`<span class="dot"></span> Connected`; }
        resync(); // catch up on anything missed while this channel was down
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        if(el){ el.className='pill warn'; el.innerHTML=`<span class="dot"></span> Reconnecting...`; }
        scheduleReconnect();
      }
    });

  logCh=sb.channel('whoami-log-'+Date.now())
    .on('postgres_changes',{event:'*',schema:'public',table:'whoami_log'},()=>resync())
    .subscribe();
}

// Multiple things can trigger a resync close together — your own action,
// the realtime channel firing, and the 15s poll — and their network
// responses can land out of order. Without a guard, an older response
// landing after a newer one would silently overwrite fresh state with
// stale state, which is exactly what a "my message disappeared" symptom
// looks like. This tags each request and only ever applies the result of
// the LATEST one issued, discarding anything older that resolves late.
let _resyncSeq=0;
async function resyncOrThrow(){
  const mySeq=++_resyncSeq;
  const{data,error}=await withTimeout(sb.rpc('whoami_resync'));
  if(error) throw error;
  if(mySeq!==_resyncSeq) return; // a newer resync was issued while this one was in flight — drop this stale result
  match=data.match;
  myWord=data.my_word;
  log=data.log||[];
  renderFeed();
  routeScreen();
}

async function resync(){
  try{
    await resyncOrThrow();
  }catch(e){
    console.warn('resync failed (will retry):',e);
  }
}

const SERIES_ROUNDS_PER_PLAYER=20;
const SERIES_LENGTH=SERIES_ROUNDS_PER_PLAYER*2; // 40 total rounds = 20 each as guesser, since describer strictly alternates every round

function routeScreen(){
  if(!match)return;
  const iAmDescriber=match.describer===MY_NAME;

  if(match.status==='playing'){
    const wrap=document.getElementById('roleBannerWrap');
    wrap.innerHTML='';
    if(iAmDescriber){
      wrap.innerHTML=`
        <div class="role-banner">You're describing this round</div>
        <div class="hidden-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Hidden from ${OPP_NAME}</div>
        <div class="secret-word">${escHtml(myWord||'…')}</div>
        <div class="hint">Describe it without saying the word — think "who/what am I to you" style clues.</div>`;
      document.getElementById('clueCard').style.display='flex';
      document.getElementById('guessCard').style.display='none';
    }else{
      wrap.innerHTML=`
        <div class="role-banner guesser">${OPP_NAME} is describing — you're guessing</div>
        <div class="hint">Read the clues below and guess the word!</div>`;
      document.getElementById('clueCard').style.display='none';
      document.getElementById('guessCard').style.display='flex';
    }
    document.getElementById('guessCount').textContent=match.guess_count||0;
    document.getElementById('seriesProgress').textContent=
      `Round ${Math.min(match.round+1,SERIES_LENGTH)} of ${SERIES_LENGTH}  ·  fewest total guesses wins the series`;
    if(_lastRoutedStatus!=='playing'){
      document.getElementById('clueInput').value='';
      document.getElementById('guessInput').value='';
      document.getElementById('guessErr').textContent='';
    }
    showScreen('s-playing');
  }else if(match.round>=SERIES_LENGTH){
    renderSeriesOver();
    showScreen('s-series-over');
  }else{
    renderOver();
    showScreen('s-over');
  }
  _lastRoutedStatus=match.status;
}

function escHtml(s){
  const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;
}

function renderFeed(){
  const el=document.getElementById('feed');
  if(!el)return;
  if(!log.length){
    el.innerHTML='<div class="f-empty">No clues yet — describer, go ahead</div>';
    return;
  }
  el.innerHTML='';
  log.forEach(item=>{
    const isMine=item.sender===MY_NAME;
    const row=document.createElement('div');
    row.className='f-row '+(isMine?'mine':'theirs');
    const bubble=document.createElement('div');
    bubble.className='f-bubble'+(item.kind==='guess'?(item.correct?' right':' wrong'):'');
    const tag=document.createElement('div');
    tag.className='f-tag';
    tag.textContent=(isMine?'You':item.sender)+(item.kind==='guess'?' guessed':' said');
    const text=document.createElement('div');
    text.className='f-text';
    text.textContent=item.kind==='guess'?`"${item.content}"${item.correct?' — correct':' — not quite'}`:item.content;
    bubble.append(tag,text);
    row.appendChild(bubble);
    el.appendChild(row);
  });
  el.scrollTop=el.scrollHeight;
}

const TROPHY_ICON='<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1c0 2.5 1.5 4.5 4 5M17 5h3a1 1 0 0 1 1 1c0 2.5-1.5 4.5-4 5"/>';
const LOSS_ICON='<circle cx="12" cy="12" r="9"/><path d="M9 15l6-6M9 9l6 6"/>';

function renderOver(){
  const iWon=match.winner===MY_NAME;
  document.getElementById('overTrophy').innerHTML=iWon?TROPHY_ICON:LOSS_ICON;
  document.getElementById('finalWinnerName').textContent=match.winner
    ? (iWon?'You got it!':`${OPP_NAME} got it!`)
    : 'Round over';
  document.getElementById('revealWord').textContent=match.revealed_word||'—';
  document.getElementById('finalGuessStats').textContent=`Guesses this round: ${match.guess_count||0}`;
  document.getElementById('seriesProgressOver').textContent=
    `Series so far — you: ${match.total_guesses_satyam!==undefined?(MY_NAME==='Satyam'?match.total_guesses_satyam:match.total_guesses_snks):0} total guesses, `+
    `${OPP_NAME}: ${MY_NAME==='Satyam'?match.total_guesses_snks:match.total_guesses_satyam} total guesses  ·  round ${match.round} of ${SERIES_LENGTH}`;
  if(iWon&&!_confettiShownFor.has(match.updated_at)){
    _confettiShownFor.add(match.updated_at);
    burstConfetti();
    vibrate([25,60,25,60,60]);
  }
}

let _seriesConfettiShown=false;
function renderSeriesOver(){
  const myTotal=MY_NAME==='Satyam'?match.total_guesses_satyam:match.total_guesses_snks;
  const oppTotal=MY_NAME==='Satyam'?match.total_guesses_snks:match.total_guesses_satyam;
  const tied=myTotal===oppTotal;
  const iWon=myTotal<oppTotal; // fewer total guesses wins
  document.getElementById('seriesTrophy').innerHTML=tied?'<circle cx="12" cy="12" r="9"/><path d="M9 12h6M12 9v6"/>':(iWon?TROPHY_ICON:LOSS_ICON);
  document.getElementById('seriesFinalName').textContent=
    tied?"It's a tie!":(iWon?'You win the series!':`${OPP_NAME} wins the series!`);
  document.getElementById('seriesFinalScore').textContent=
    `Total guesses — You: ${myTotal}, ${OPP_NAME}: ${oppTotal} (fewer is better)`;
  if(iWon&&!tied&&!_seriesConfettiShown){
    _seriesConfettiShown=true;
    burstConfetti();
    vibrate([30,80,30,80,30,80,80]);
  }
}
const _confettiShownFor=new Set();
function burstConfetti(){
  const wrap=document.createElement('div');
  wrap.className='confetti-wrap';
  document.body.appendChild(wrap);
  const colors=['#ff9cc0','#8ccfff','#ffe27a','#a6ebc9','#cdbbff','#ffc7a1'];
  for(let i=0;i<42;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const size=5+Math.random()*7;
    p.style.width=size+'px';
    p.style.height=size*0.4+'px';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(1.8+Math.random()*1.4)+'s';
    p.style.animationDelay=(Math.random()*0.4)+'s';
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(),3600);
}

// ── ACTIONS ──
async function sendClue(){
  const input=document.getElementById('clueInput');
  const val=input.value.trim();
  if(!val)return;
  input.value='';
  vibrate(12);
  try{
    const{error}=await withTimeout(sb.rpc('whoami_add_clue',{p_text:val}));
    if(error) throw error;
    await resync();
  }catch(e){
    console.error('send clue failed:',e);
    toast('Could not send — try again');
    input.value=val;
  }
}

async function submitGuess(){
  const input=document.getElementById('guessInput');
  const val=input.value.trim();
  if(!val)return;
  document.getElementById('guessErr').textContent='';
  vibrate(12);
  try{
    const{data,error}=await withTimeout(sb.rpc('whoami_submit_guess',{p_guess:val}));
    if(error) throw error;
    input.value='';
    if(data.won){
      toast('Correct!');
    }else{
      document.getElementById('guessErr').textContent='Not quite — keep guessing';
    }
    await resync();
  }catch(e){
    console.error('submitGuess error:',e);
    document.getElementById('guessErr').textContent='Error: '+(e.message||'unknown');
  }
}

async function startNewRound(){
  const btn=document.querySelector('#s-over .btn');
  if(btn) btn.disabled=true;
  try{
    const{error}=await withTimeout(sb.rpc('whoami_new_round',{p_word_pool:WORD_POOL}));
    if(error) throw error;
    myWord=null;
    log=[];
    await resync();
  }catch(e){
    toast('Failed: '+(e.message||'try again'));
  }
  if(btn) btn.disabled=false;
}

async function startNewSeries(){
  const btn=document.querySelector('#s-series-over .btn');
  if(btn) btn.disabled=true;
  try{
    // Reset the running series tally and round counter directly — same
    // permissive-table-write pattern already used elsewhere in this app —
    // then deal a fresh word to kick off round 1 of the new series.
    const{error:resetErr}=await sb.from('whoami_match')
      .update({round:0,total_guesses_satyam:0,total_guesses_snks:0})
      .eq('id',1);
    if(resetErr) throw resetErr;
    const{error}=await withTimeout(sb.rpc('whoami_new_round',{p_word_pool:WORD_POOL}));
    if(error) throw error;
    myWord=null;
    log=[];
    _seriesConfettiShown=false;
    await resync();
  }catch(e){
    toast('Failed to start new series: '+(e.message||'try again'));
  }
  if(btn) btn.disabled=false;
}
</script>
</body>
</html>
